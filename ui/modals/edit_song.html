<div id="editSongModal"
    class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 backdrop-blur-sm transition-opacity">
    <div
        class="bg-zinc-900/80 backdrop-blur-2xl rounded-2xl border border-white/10 shadow-2xl shadow-black/60 w-full max-w-md p-6 relative">
        <!-- Ambient Glow inside Modal -->
        <div
            class="absolute -right-20 -top-20 w-48 h-48 bg-orange-500/10 rounded-full blur-[60px] pointer-events-none z-0">
        </div>

        <h2 class="relative z-10 text-2xl font-bold mb-4 text-zinc-100 border-b border-white/10 pb-2">Edit Song Metadata
        </h2>
        <form id="editSongForm" class="space-y-4 relative z-10">
            <input type="hidden" id="edit-file" name="File">
            <input type="hidden" id="edit-cover-art-data" name="CoverArt">
            <input type="hidden" id="edit-is-podcast" name="IsPodcast" value="">

            <div>
                <label for="edit-title" class="block text-sm font-semibold text-zinc-300">Title</label>
                <input type="text" id="edit-title"
                    class="mt-1 block w-full rounded-lg border border-white/[0.12] shadow-sm focus:border-orange-500 focus:ring-1 focus:ring-orange-500 sm:text-sm px-3 py-2 bg-white/[0.06] text-zinc-100 placeholder-zinc-500 outline-none transition-all duration-300 hover:border-white/25 focus:bg-white/[0.08]"
                    placeholder="Song Title">
            </div>

            <div>
                <label for="edit-artist" class="block text-sm font-semibold text-zinc-300">Artist</label>
                <input type="text" id="edit-artist"
                    class="mt-1 block w-full rounded-lg border border-white/[0.12] shadow-sm focus:border-orange-500 focus:ring-1 focus:ring-orange-500 sm:text-sm px-3 py-2 bg-white/[0.06] text-zinc-100 placeholder-zinc-500 outline-none transition-all duration-300 hover:border-white/25 focus:bg-white/[0.08]"
                    placeholder="Artist Name">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="edit-album" class="block text-sm font-semibold text-zinc-300">Album</label>
                    <input type="text" id="edit-album"
                        class="mt-1 block w-full rounded-lg border border-white/[0.12] shadow-sm focus:border-orange-500 focus:ring-1 focus:ring-orange-500 sm:text-sm px-3 py-2 bg-white/[0.06] text-zinc-100 placeholder-zinc-500 outline-none transition-all duration-300 hover:border-white/25 focus:bg-white/[0.08]"
                        placeholder="Album Name">
                </div>

                <div>
                    <label for="edit-year" class="block text-sm font-semibold text-zinc-300">Year</label>
                    <input type="text" id="edit-year"
                        class="mt-1 block w-full rounded-lg border border-white/[0.12] shadow-sm focus:border-orange-500 focus:ring-1 focus:ring-orange-500 sm:text-sm px-3 py-2 bg-white/[0.06] text-zinc-100 placeholder-zinc-500 outline-none transition-all duration-300 hover:border-white/25 focus:bg-white/[0.08]"
                        placeholder="Year">
                </div>
            </div>

            <div class="flex items-center gap-4 bg-white/[0.04] p-3 rounded-xl border border-white/[0.08]">
                <div
                    class="w-16 h-16 rounded-lg bg-zinc-800/60 flex-shrink-0 overflow-hidden flex items-center justify-center border border-white/10 shadow-inner">
                    <img id="edit-cover-preview" src="" alt="Cover Preview" class="w-full h-full object-cover hidden">
                    <svg id="edit-cover-preview-fallback" class="w-8 h-8 text-zinc-500" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3">
                        </path>
                    </svg>
                </div>
                <div class="flex-grow flex items-center justify-between">
                    <div class="flex-grow">
                        <label for="edit-cover"
                            class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider">Cover
                            Image</label>
                        <input type="file" id="edit-cover" accept="image/*"
                            class="mt-1 block w-full text-xs text-zinc-300 cursor-pointer bg-transparent outline-none focus:outline-none file:mr-3 file:py-1 file:px-2.5 file:border file:border-white/10 file:rounded-md file:text-xs file:font-semibold file:bg-white/[0.06] file:text-zinc-200 file:hover:bg-white/[0.12] file:cursor-pointer file:transition-colors">
                    </div>
                    <button type="button" onclick="removeCoverImage()"
                        class="hover:cursor-pointer ml-2 mt-4 px-2 py-1 bg-red-500/20 text-red-400 hover:bg-red-500/30 rounded text-xs font-semibold border border-red-500/30 transition-colors"
                        title="Remove Cover">
                        Remove
                    </button>
                </div>
            </div>

            <div class="flex justify-end space-x-3 pt-4 border-t border-white/10 mt-5">
                <button type="button" onclick="closeEditModal()"
                    class="px-4 py-2 hover:cursor-pointer bg-white/[0.06] text-zinc-300 font-medium rounded-lg border border-white/10 hover:bg-white/[0.12] hover:text-white focus:outline-none transition-all duration-300 hover:scale-105 active:scale-95">Cancel</button>
                <button type="submit"
                    class="px-4 py-2 bg-orange-500 text-white hover:cursor-pointer font-medium rounded-lg hover:bg-orange-600 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-opacity-50 transition-all duration-300 hover:scale-105 active:scale-95 shadow-md shadow-orange-500/20 hover:shadow-lg hover:shadow-orange-500/40">Save
                    Changes</button>
            </div>
        </form>
    </div>
</div>

<script>
    function openEditModal(song) {
        document.getElementById('edit-file').value = song.File || '';
        document.getElementById('edit-title').value = song.Title !== 'Unknown' ? song.Title : '';
        document.getElementById('edit-artist').value = song.Artist !== 'Unknown' ? song.Artist : '';
        document.getElementById('edit-album').value = song.Album !== 'Unknown' ? song.Album : '';
        document.getElementById('edit-year').value = song.Year !== 'Unknown' ? song.Year : '';
        document.getElementById('edit-cover-art-data').value = song.CoverArt || '';
        document.getElementById('edit-is-podcast').value = song.IsPodcast ? '1' : '';
        document.getElementById('edit-cover').value = '';

        const previewImg = document.getElementById('edit-cover-preview');
        const previewFallback = document.getElementById('edit-cover-preview-fallback');

        // Show modal immediately
        const modal = document.getElementById('editSongModal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');

        if (song.CoverArt) {
            previewImg.src = song.CoverArt;
            previewImg.classList.remove('hidden');
            previewFallback.classList.add('hidden');
        } else {
            // Start with fallback, then try to load cover art
            previewImg.src = '';
            previewImg.classList.add('hidden');
            previewFallback.classList.remove('hidden');

            // Check JS cache first, then fetch from Python
            const fileName = song.File;
            if (fileName) {
                const cached = window._coverCache && window._coverCache.get(fileName);
                if (cached) {
                    previewImg.src = cached;
                    previewImg.classList.remove('hidden');
                    previewFallback.classList.add('hidden');
                    document.getElementById('edit-cover-art-data').value = cached;
                } else if (window.pywebview && window.pywebview.api) {
                    window.pywebview.api.get_cover_art_base64(fileName).then(base64 => {
                        if (base64) {
                            previewImg.src = base64;
                            previewImg.classList.remove('hidden');
                            previewFallback.classList.add('hidden');
                            document.getElementById('edit-cover-art-data').value = base64;
                        }
                    }).catch(() => { });
                }
            }
        }
    }

    function closeEditModal() {
        const modal = document.getElementById('editSongModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }

    function removeCoverImage() {
        document.getElementById('edit-cover').value = '';
        document.getElementById('edit-cover-art-data').value = 'REMOVE';

        const previewImg = document.getElementById('edit-cover-preview');
        const previewFallback = document.getElementById('edit-cover-preview-fallback');

        previewImg.src = '';
        previewImg.classList.add('hidden');
        previewFallback.classList.remove('hidden');
    }

    document.getElementById('edit-cover').addEventListener('change', function (e) {
        const file = e.target.files[0];
        const previewImg = document.getElementById('edit-cover-preview');
        const previewFallback = document.getElementById('edit-cover-preview-fallback');
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                previewImg.src = event.target.result;
                previewImg.classList.remove('hidden');
                previewFallback.classList.add('hidden');
                // Since user chose a new file, clear the previous database/URL coverArt value
                document.getElementById('edit-cover-art-data').value = '';
            };
            reader.readAsDataURL(file);
        }
    });

    document.getElementById('editSongForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        let updatedData = {
            File: document.getElementById('edit-file').value,
            Title: document.getElementById('edit-title').value,
            Artist: document.getElementById('edit-artist').value,
            Album: document.getElementById('edit-album').value,
            Year: document.getElementById('edit-year').value
        };
        if (document.getElementById('edit-is-podcast').value === '1') {
            updatedData.IsPodcast = true;
        }

        async function saveMetadata(data) {
            try {
                const result = await window.pywebview.api.update_song_metadata(data);
                if (result === false) {
                    const notyf = new Notyf({ position: { x: 'right', y: 'bottom' } });
                    notyf.error({ message: 'Failed to save metadata. Check the file is accessible.', duration: 0, dismissible: true });
                    return;
                }
                closeEditModal();

                // Refresh the main library view
                if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.send_song_list === 'function') {
                    window.pywebview.api.send_song_list();
                }

                // Podcasts view keeps its own lightweight list: refresh the file
                if (data.IsPodcast && typeof window._podRefreshFile === 'function') {
                    try { await window._podRefreshFile(data.File); } catch (e) { console.error(e); }
                }
                
                // If we are currently in the playlist view, refresh it as well
                if (window.currentPlaylist && typeof window._pvRenderSorted === 'function') {
                    const playlistId = window.currentPlaylist.id || window.currentPlaylist.Id;
                    if (playlistId) {
                        try {
                            const songs = await window.pywebview.api.get_playlist_songs(playlistId);
                            if (songs) {
                                window.currentPlaylistSongs = songs;
                                window._pvSongsData = songs;
                                window._pvRenderSorted();
                            }
                        } catch (e) { console.error("Failed to refresh playlist view:", e); }
                    }
                }
            } catch (err) {
                console.error('Metadata save error:', err);
                const notyf = new Notyf({ position: { x: 'right', y: 'bottom' } });
                notyf.error({ message: `Error saving metadata: ${err.message || err}`, duration: 0, dismissible: true });
            }
        }

        const coverFile = document.getElementById('edit-cover').files[0];
        if (coverFile) {
            const reader = new FileReader();
            reader.onload = async (event) => {
                updatedData.CoverArt = event.target.result;
                await saveMetadata(updatedData);
            };
            reader.readAsDataURL(coverFile);
        } else {
            const coverArtData = document.getElementById('edit-cover-art-data').value;
            if (coverArtData) {
                updatedData.CoverArt = coverArtData;
            }
            await saveMetadata(updatedData);
        }
    });
</script>
