<div id="editSongModal"
    class="fixed inset-0 z-50 hidden items-center justify-center bg-transparent bg-opacity-40 backdrop-blur-sm transition-opacity">
    <div class="bg-neutral-800 rounded-xl shadow-2xl w-full max-w-md p-6 relative">
        <h2 class="text-2xl font-bold mb-4 text-zinc-200 border-b border-neutral-700 pb-2">Edit Song Metadata</h2>
        <form id="editSongForm" class="space-y-4">
            <input type="hidden" id="edit-file" name="File">
            <input type="hidden" id="edit-cover-art-data" name="CoverArt">

            <div>
                <label for="edit-title" class="block text-sm font-semibold text-gray-200">Title</label>
                <input type="text" id="edit-title"
                    class="mt-1 block w-full rounded-md border-neutral-700 shadow-sm focus:border-orange-400 focus:ring-orange-500 sm:text-sm px-3 py-2 border bg-neutral-700 outline-none transition-all duration-300 hover:border-neutral-500 focus:bg-neutral-600"
                    placeholder="Song Title">
            </div>

            <div>
                <label for="edit-artist" class="block text-sm font-semibold text-gray-200">Artist</label>
                <input type="text" id="edit-artist"
                    class="mt-1 block w-full rounded-md border-neutral-700 shadow-sm focus:border-orange-400 focus:ring-orange-500 sm:text-sm px-3 py-2 border bg-neutral-700 outline-none transition-all duration-300 hover:border-neutral-500 focus:bg-neutral-600"
                    placeholder="Artist Name">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="edit-album" class="block text-sm font-semibold text-gray-200">Album</label>
                    <input type="text" id="edit-album"
                        class="mt-1 block w-full rounded-md border-neutral-700 shadow-sm focus:border-orange-400 focus:ring-orange-500 sm:text-sm px-3 py-2 border bg-neutral-700 outline-none transition-all duration-300 hover:border-neutral-500 focus:bg-neutral-600"
                        placeholder="Album Name">
                </div>

                <div>
                    <label for="edit-year" class="block text-sm font-semibold text-gray-200">Year</label>
                    <input type="text" id="edit-year"
                        class="mt-1 block w-full rounded-md border-neutral-700 shadow-sm focus:border-orange-400 focus:ring-orange-500 sm:text-sm px-3 py-2 border bg-neutral-700 outline-none transition-all duration-300 hover:border-neutral-500 focus:bg-neutral-600"
                        placeholder="Year">
                </div>
            </div>

            <div class="flex items-center gap-4 bg-neutral-900/50 p-3 rounded-lg border border-neutral-700/50">
                <div
                    class="w-16 h-16 rounded-md bg-neutral-700 flex-shrink-0 overflow-hidden flex items-center justify-center border border-white/10 shadow-inner">
                    <img id="edit-cover-preview" src="" alt="Cover Preview" class="w-full h-full object-cover hidden">
                    <svg id="edit-cover-preview-fallback" class="w-8 h-8 text-zinc-500" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3">
                        </path>
                    </svg>
                </div>
                <div class="flex-grow flex items-center justify-between">
                    <div class="flex-grow">
                        <label for="edit-cover"
                            class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Cover
                            Image</label>
                        <input type="file" id="edit-cover" accept="image/*"
                            class="mt-1 block w-full text-xs text-zinc-300 cursor-pointer bg-transparent outline-none focus:outline-none file:mr-3 file:py-1 file:px-2.5 file:border file:border-white/10 file:rounded-md file:text-xs file:font-semibold file:bg-neutral-800 file:text-zinc-200 file:hover:bg-neutral-700 file:cursor-pointer file:transition-colors">
                    </div>
                    <button type="button" onclick="removeCoverImage()"
                        class="hover:cursor-pointer ml-2 mt-4 px-2 py-1 bg-red-500/20 text-red-400 hover:bg-red-500/30 rounded text-xs font-semibold border border-red-500/30 transition-colors"
                        title="Remove Cover">
                        Remove
                    </button>
                </div>
            </div>

            <div class="flex justify-end space-x-3 pt-4 border-t border-neutral-700 mt-5">
                <button type="button" onclick="closeEditModal()"
                    class="px-4 py-2 hover:cursor-pointer bg-gray-200 text-slate-800 font-medium rounded-lg hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-opacity-50 transition-all duration-300 hover:scale-105 active:scale-95">Cancel</button>
                <button type="submit"
                    class="px-4 py-2 bg-orange-400 text-white hover:cursor-pointer font-medium rounded-lg hover:bg-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-opacity-50 transition-all duration-300 hover:scale-105 active:scale-95 shadow-md shadow-orange-500/20 hover:shadow-lg hover:shadow-orange-500/40">Save
                    Changes</button>
            </div>
        </form>
    </div>
</div>

<script>
    function openEditModal(song) {
        document.getElementById('edit-file').value = song.File || '';
        document.getElementById('edit-title').value = song.Title !== 'Unknown' ? song.Title : '';
        document.getElementById('edit-artist').value = song.Artist !== 'Unknown' ? song.Artist : '';
        document.getElementById('edit-album').value = song.Album !== 'Unknown' ? song.Album : '';
        document.getElementById('edit-year').value = song.Year !== 'Unknown' ? song.Year : '';
        document.getElementById('edit-cover-art-data').value = song.CoverArt || '';
        document.getElementById('edit-cover').value = '';

        const previewImg = document.getElementById('edit-cover-preview');
        const previewFallback = document.getElementById('edit-cover-preview-fallback');

        // Show modal immediately
        const modal = document.getElementById('editSongModal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');

        if (song.CoverArt) {
            previewImg.src = song.CoverArt;
            previewImg.classList.remove('hidden');
            previewFallback.classList.add('hidden');
        } else {
            // Start with fallback, then try to load cover art
            previewImg.src = '';
            previewImg.classList.add('hidden');
            previewFallback.classList.remove('hidden');

            // Check JS cache first, then fetch from Python
            const fileName = song.File;
            if (fileName) {
                const cached = window._coverCache && window._coverCache.get(fileName);
                if (cached) {
                    previewImg.src = cached;
                    previewImg.classList.remove('hidden');
                    previewFallback.classList.add('hidden');
                    document.getElementById('edit-cover-art-data').value = cached;
                } else if (window.pywebview && window.pywebview.api) {
                    window.pywebview.api.get_cover_art_base64(fileName).then(base64 => {
                        if (base64) {
                            previewImg.src = base64;
                            previewImg.classList.remove('hidden');
                            previewFallback.classList.add('hidden');
                            document.getElementById('edit-cover-art-data').value = base64;
                        }
                    }).catch(() => {});
                }
            }
        }
    }

    function closeEditModal() {
        const modal = document.getElementById('editSongModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }

    function removeCoverImage() {
        document.getElementById('edit-cover').value = '';
        document.getElementById('edit-cover-art-data').value = 'REMOVE';

        const previewImg = document.getElementById('edit-cover-preview');
        const previewFallback = document.getElementById('edit-cover-preview-fallback');

        previewImg.src = '';
        previewImg.classList.add('hidden');
        previewFallback.classList.remove('hidden');
    }

    document.getElementById('edit-cover').addEventListener('change', function (e) {
        const file = e.target.files[0];
        const previewImg = document.getElementById('edit-cover-preview');
        const previewFallback = document.getElementById('edit-cover-preview-fallback');
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                previewImg.src = event.target.result;
                previewImg.classList.remove('hidden');
                previewFallback.classList.add('hidden');
                // Since user chose a new file, clear the previous database/URL coverArt value
                document.getElementById('edit-cover-art-data').value = '';
            };
            reader.readAsDataURL(file);
        }
    });

    document.getElementById('editSongForm').addEventListener('submit', function (e) {
        e.preventDefault();

        let updatedData = {
            File: document.getElementById('edit-file').value,
            Title: document.getElementById('edit-title').value,
            Artist: document.getElementById('edit-artist').value,
            Album: document.getElementById('edit-album').value,
            Year: document.getElementById('edit-year').value
        };

        const coverFile = document.getElementById('edit-cover').files[0];
        if (coverFile) {
            const reader = new FileReader();
            reader.onload = (event) => {
                updatedData.CoverArt = event.target.result;
                window.pywebview.api.update_song_metadata(updatedData);
                closeEditModal();
            };
            reader.readAsDataURL(coverFile);
        } else {
            const coverArtData = document.getElementById('edit-cover-art-data').value;
            if (coverArtData) {
                updatedData.CoverArt = coverArtData;
            }
            window.pywebview.api.update_song_metadata(updatedData);
            closeEditModal();
        }
    });
</script>
