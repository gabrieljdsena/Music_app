<div class="max-w-6xl mx-auto w-full pt-8 px-6 sm:px-8 pb-24 flex flex-col gap-10">

    <!-- Playlist Header (Glassmorphism) -->
    <div
        class="relative group rounded-3xl overflow-hidden p-6 sm:p-10 flex flex-col sm:flex-row items-center sm:items-end gap-6 sm:gap-10 bg-zinc-900/40 border border-white/5 backdrop-blur-2xl shadow-[0_8px_32px_rgba(0,0,0,0.5)] transition-all duration-500">
        <!-- Glassmorphism glare -->
        <div class="absolute inset-0 bg-gradient-to-b from-white/[0.04] to-transparent pointer-events-none"></div>

        <!-- Ambient Background Glow inside the header -->
        <div
            class="absolute -right-1/4 -top-1/4 w-96 h-96 bg-orange-500/10 rounded-full blur-[100px] pointer-events-none z-0">
        </div>

        <!-- Edit / Save / Cancel Buttons -->
        <div class="absolute right-3 top-3 sm:right-4 sm:top-4 flex items-center gap-1.5 sm:gap-2 z-20">
            <!-- Cancel button (hidden by default, shown in edit mode) -->
            <button id="pv-cancel-btn" onclick="cancelEditPlaylist()"
                class="hidden p-1.5 sm:p-2 rounded-full bg-white/10 hover:bg-red-500/30 text-zinc-400 hover:text-red-300 transition-all duration-300 hover:cursor-pointer backdrop-blur-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 sm:w-6 sm:h-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <!-- Edit / Save button -->
            <button id="pv-edit-btn" onclick="toggleEditPlaylist()"
                class="p-1.5 sm:p-2 rounded-full bg-white/20 hover:bg-white/40 transition-all duration-300 hover:cursor-pointer">
                <!-- Edit icon (shown by default) -->
                <svg id="pv-edit-icon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 sm:w-6 sm:h-6" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
                </svg>
                <!-- Save icon (hidden by default) -->
                <svg id="pv-save-icon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 sm:w-6 sm:h-6 hidden"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                </svg>
            </button>
        </div>

        <!-- Cover Image -->
        <div id="pv-cover-wrapper"
            class="relative w-56 h-56 flex-shrink-0 rounded-2xl overflow-hidden shadow-2xl shadow-black/60 border border-white/10 group-hover:shadow-orange-500/20 transition-all duration-500 z-10 bg-zinc-800 flex items-center justify-center">
            <img id="pv-cover" src="" alt="Playlist Cover"
                class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">

            <!-- Fallback icon if no image -->
            <div id="pv-cover-fallback" class="absolute inset-0 flex items-center justify-center bg-zinc-800/80">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-20 h-20 text-zinc-600" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                </svg>
            </div>

            <!-- Change image overlay (hidden by default, shown in edit mode) -->
            <div id="pv-cover-edit-overlay" onclick="pickPlaylistImage()"
                class="absolute inset-0 bg-black/60 flex flex-col items-center justify-center gap-2 opacity-0 pointer-events-none transition-all duration-300 cursor-pointer z-20">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-white/80" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" />
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z" />
                </svg>
                <span class="text-white/70 text-xs font-medium tracking-wide">Change Image</span>
            </div>
        </div>

        <!-- Details -->
        <div
            class="relative z-10 flex flex-col items-center sm:items-start text-center sm:text-left flex-1 min-w-0 pb-2">
            <span
                class="text-xs sm:text-sm font-semibold text-orange-400 tracking-widest uppercase mb-2">Playlist</span>
            <h1 id="pv-title"
                class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-zinc-100 via-zinc-200 to-zinc-500 tracking-tight truncate w-full pb-1 drop-shadow-sm mb-3 sm:mb-4 outline-none transition-all duration-300"
                spellcheck="false">
                Playlist</h1>

            <p id="pv-description"
                class="text-sm sm:text-base text-zinc-400 max-w-2xl line-clamp-2 mb-6 leading-relaxed outline-none transition-all duration-300"
                spellcheck="false">Your custom
                playlist</p>

            <!-- Actions -->
            <div class="flex items-center gap-4 mt-auto">
                <!-- Play Button -->
                <button id="pv-play-btn"
                    class="flex items-center justify-center w-14 h-14 hover:cursor-pointer bg-orange-500 text-white rounded-full hover:bg-orange-400 transition-all duration-300 hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(249,115,22,0.3)] hover:shadow-[0_0_30px_rgba(249,115,22,0.5)] focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                        class="w-7 h-7 ml-1">
                        <path fill-rule="evenodd"
                            d="M4.5 5.653c0-1.427 1.529-2.38 2.831-1.643L20.5 12 7.331 20.007c-1.302.737-2.831-.216-2.831-1.643V5.653Z"
                            clip-rule="evenodd" />
                    </svg>
                </button>
                <!-- Options Button -->
                <button
                    class="flex items-center justify-center w-12 h-12 hover:cursor-pointer bg-white/5 text-zinc-300 rounded-full hover:bg-white/10 hover:text-white transition-all duration-300 hover:scale-105 active:scale-95 border border-white/5 shadow-lg focus:outline-none"
                    title="Options">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                        stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M6.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM12.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM18.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Controls & Table Placeholder -->
    <div class="flex flex-col gap-4">
        <div
            class="grid grid-cols-[3fr_2fr_1fr_auto] gap-4 px-4 pb-3 mb-2 text-xs font-semibold tracking-wider text-zinc-500 uppercase border-b border-white/5">
            <div class="cursor-pointer hover:text-zinc-300 transition-colors">Song</div>
            <div class="cursor-pointer hover:text-zinc-300 transition-colors">Album</div>
            <div class="cursor-pointer hover:text-zinc-300 transition-colors text-right">Duration</div>
            <div></div>
        </div>

        <!-- Empty state (Dynamically replace this with songs using your JS) -->
        <div id="pv-songs-container" class="flex flex-col gap-2">
            <div class="py-16 flex flex-col items-center justify-center text-center opacity-70">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-zinc-600 mb-4" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                </svg>
                <p class="text-zinc-400 font-medium text-lg">It's a bit quiet here</p>
                <p class="text-sm text-zinc-500 mt-2 max-w-md">Start adding songs to your custom playlist by selecting
                    them from your library.</p>
            </div>
        </div>
    </div>

</div>

<style>
    /* Editable field styling when in edit mode */
    [contenteditable="true"]#pv-title {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 0.5rem;
        padding: 0.25rem 0.5rem;
        border: 1px solid rgba(249, 115, 22, 0.4);
        cursor: text;
        overflow: visible;
        white-space: normal;
        text-overflow: unset;
    }

    [contenteditable="true"]#pv-description {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 0.5rem;
        padding: 0.25rem 0.5rem;
        border: 1px solid rgba(249, 115, 22, 0.4);
        cursor: text;
        overflow: visible;
        display: block;
    }
</style>

<script>
    // ── Edit mode state ──
    window._pvEditMode = false;
    window._pvNewCover = null; // holds picked base64 cover during editing

    function toggleEditPlaylist() {
        if (window._pvEditMode) {
            savePlaylistEdits();
        } else {
            enterEditMode();
        }
    }

    function enterEditMode() {
        window._pvEditMode = true;
        window._pvNewCover = null;

        const titleEl = document.getElementById("pv-title");
        const descEl = document.getElementById("pv-description");
        const editIcon = document.getElementById("pv-edit-icon");
        const saveIcon = document.getElementById("pv-save-icon");
        const overlay = document.getElementById("pv-cover-edit-overlay");
        const editBtn = document.getElementById("pv-edit-btn");
        const cancelBtn = document.getElementById("pv-cancel-btn");

        // Save originals so cancel can restore them
        window._pvOrigTitle = titleEl.innerText;
        window._pvOrigDesc = descEl.innerText;
        window._pvOrigCoverSrc = document.getElementById("pv-cover").src;

        // Make fields editable
        titleEl.contentEditable = "true";
        descEl.contentEditable = "true";

        // Strip gradient-text and truncate classes so the cursor is visible and text is editable
        titleEl.classList.remove("text-transparent", "bg-clip-text", "bg-gradient-to-r", "from-zinc-100", "via-zinc-200", "to-zinc-500", "truncate");
        titleEl.classList.add("text-zinc-100");

        // Swap to save icon with orange tint
        editIcon.classList.add("hidden");
        saveIcon.classList.remove("hidden");
        editBtn.classList.remove("bg-white/20", "hover:bg-white/40");
        editBtn.classList.add("bg-orange-500/30", "hover:bg-orange-500/50");

        // Show cancel button
        cancelBtn.classList.remove("hidden");

        // Show cover edit overlay
        overlay.classList.remove("opacity-0", "pointer-events-none");
        overlay.classList.add("opacity-100", "pointer-events-auto");

        // Focus title
        titleEl.focus();

        // Prevent Enter from creating new lines in the title
        titleEl.addEventListener("keydown", preventEnterInTitle);
    }

    function preventEnterInTitle(e) {
        if (e.key === "Enter") {
            e.preventDefault();
            document.getElementById("pv-description").focus();
        }
    }

    async function savePlaylistEdits() {
        const titleEl = document.getElementById("pv-title");
        const descEl = document.getElementById("pv-description");
        const editIcon = document.getElementById("pv-edit-icon");
        const saveIcon = document.getElementById("pv-save-icon");
        const overlay = document.getElementById("pv-cover-edit-overlay");
        const editBtn = document.getElementById("pv-edit-btn");

        const playlistId = window.currentPlaylist ? (window.currentPlaylist.id || window.currentPlaylist.Id) : null;
        if (!playlistId) return;

        const newTitle = titleEl.innerText.trim();
        const newDesc = descEl.innerText.trim();

        const updateData = {
            title: newTitle,
            description: newDesc
        };

        // If a new cover was picked, include it
        if (window._pvNewCover) {
            updateData.thumbnail = window._pvNewCover;
        }

        // Call backend
        if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.update_playlist === 'function') {
            try {
                await window.pywebview.api.update_playlist(playlistId, updateData);

                // Update the local currentPlaylist object so re-navigation stays in sync
                if (window.currentPlaylist) {
                    window.currentPlaylist.title = newTitle;
                    window.currentPlaylist.Title = newTitle;
                    window.currentPlaylist.description = newDesc;
                    window.currentPlaylist.Description = newDesc;
                }

                // Show success notification
                if (window.notyf) {
                    window.notyf.success('Playlist updated!');
                }
            } catch (e) {
                console.error("Failed to update playlist:", e);
                if (window.notyf) {
                    window.notyf.error('Failed to update playlist');
                }
            }
        }

        // Exit edit mode
        exitEditModeUI();
    }

    function cancelEditPlaylist() {
        // Restore original values
        const titleEl = document.getElementById("pv-title");
        const descEl = document.getElementById("pv-description");
        const imgEl = document.getElementById("pv-cover");

        titleEl.innerText = window._pvOrigTitle || titleEl.innerText;
        descEl.innerText = window._pvOrigDesc || descEl.innerText;
        if (window._pvOrigCoverSrc) {
            imgEl.src = window._pvOrigCoverSrc;
        }

        exitEditModeUI();
    }

    function exitEditModeUI() {
        const titleEl = document.getElementById("pv-title");
        const descEl = document.getElementById("pv-description");
        const editIcon = document.getElementById("pv-edit-icon");
        const saveIcon = document.getElementById("pv-save-icon");
        const overlay = document.getElementById("pv-cover-edit-overlay");
        const editBtn = document.getElementById("pv-edit-btn");
        const cancelBtn = document.getElementById("pv-cancel-btn");

        titleEl.contentEditable = "false";
        descEl.contentEditable = "false";

        // Restore gradient-text and truncate classes
        titleEl.classList.remove("text-zinc-100");
        titleEl.classList.add("text-transparent", "bg-clip-text", "bg-gradient-to-r", "from-zinc-100", "via-zinc-200", "to-zinc-500", "truncate");

        // Swap back to edit icon
        saveIcon.classList.add("hidden");
        editIcon.classList.remove("hidden");
        editBtn.classList.remove("bg-orange-500/30", "hover:bg-orange-500/50");
        editBtn.classList.add("bg-white/20", "hover:bg-white/40");

        // Hide cancel button
        cancelBtn.classList.add("hidden");

        // Hide cover overlay
        overlay.classList.remove("opacity-100", "pointer-events-auto");
        overlay.classList.add("opacity-0", "pointer-events-none");

        titleEl.removeEventListener("keydown", preventEnterInTitle);

        window._pvEditMode = false;
        window._pvNewCover = null;
    }

    async function pickPlaylistImage() {
        if (!window._pvEditMode) return;
        if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.pick_playlist_image === 'function') {
            try {
                const base64 = await window.pywebview.api.pick_playlist_image();
                if (base64) {
                    window._pvNewCover = base64;
                    const imgEl = document.getElementById("pv-cover");
                    const fallbackEl = document.getElementById("pv-cover-fallback");
                    imgEl.src = base64;
                    if (fallbackEl) fallbackEl.classList.add("hidden");
                }
            } catch (e) {
                console.error("Failed to pick image:", e);
            }
        }
    }

    // ── Initial data population (unchanged logic) ──
    if (window.currentPlaylist) {
        document.getElementById("pv-title").innerText = window.currentPlaylist.title || window.currentPlaylist.Title || "Unknown Playlist";
        const descEl = document.getElementById("pv-description");
        if (descEl) {
            descEl.innerText = window.currentPlaylist.description || window.currentPlaylist.Description || "Your custom playlist";
        }
    }

    // Store playlist songs for queue usage
    window.currentPlaylistSongs = [];

    (async () => {
        const playlistId = window.currentPlaylist ? (window.currentPlaylist.id || window.currentPlaylist.Id) : null;
        if (!playlistId) return;

        if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.getImage === 'function') {
            const img = await window.pywebview.api.getImage(playlistId);
            const imgEl = document.getElementById("pv-cover");
            const fallbackEl = document.getElementById("pv-cover-fallback");

            if (img && imgEl) {
                imgEl.src = img;
                imgEl.alt = window.currentPlaylist.title || "Unknown Playlist";
                if (fallbackEl) fallbackEl.classList.add("hidden");
            } else {
                if (fallbackEl) fallbackEl.classList.remove("hidden");
            }
        }

        if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.get_playlist_songs === 'function') {
            try {
                const songs = await window.pywebview.api.get_playlist_songs(playlistId);
                window.currentPlaylistSongs = songs || [];
                const container = document.getElementById("pv-songs-container");
                if (container) {
                    if (songs && songs.length > 0) {
                        let htmlBuffer = "";
                        songs.forEach(song => {
                            htmlBuffer += `
                            <div class="song-row-container" style="min-height: 64px;" data-path="${JSON.stringify(song).replace(/"/g, '&quot;')}">
                            </div>`;
                        });
                        container.innerHTML = htmlBuffer;

                        const containers = container.querySelectorAll(".song-row-container");
                        containers.forEach(c => {
                            if (window.lazyRowObserver) {
                                window.lazyRowObserver.observe(c);
                            }
                        });
                    } else {
                        container.innerHTML = `
                            <div class="py-16 flex flex-col items-center justify-center text-center opacity-70">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-zinc-600 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
                                </svg>
                                <p class="text-zinc-400 font-medium text-lg">It's a bit quiet here</p>
                                <p class="text-sm text-zinc-500 mt-2 max-w-md">Start adding songs to this playlist from your library by right-clicking a song and choosing 'Add to Playlist'.</p>
                            </div>
                        `;
                    }
                }
            } catch (e) {
                console.error("Failed to load playlist songs:", e);
            }
        }

        // Wire up the Play button to play/pause the playlist
        const playBtn = document.querySelector('#pv-play-btn');
        if (playBtn) {
            // Set initial icon state based on whether music is currently playing
            if (window.is_currently_playing && window.currentPlaylistSongs && window.currentPlaylistSongs.length > 0) {
                const currentFile = window.current_playing_song ? window.current_playing_song.File : null;
                const isFromThisPlaylist = currentFile && window.currentPlaylistSongs.some(s => s.File === currentFile);
                if (isFromThisPlaylist) {
                    playBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-7 h-7"><path fill-rule="evenodd" d="M6.75 5.25a.75.75 0 0 1 .75-.75H9a.75.75 0 0 1 .75.75v13.5a.75.75 0 0 1-.75.75H7.5a.75.75 0 0 1-.75-.75V5.25Zm7.5 0A.75.75 0 0 1 15 4.5h1.5a.75.75 0 0 1 .75.75v13.5a.75.75 0 0 1-.75.75H15a.75.75 0 0 1-.75-.75V5.25Z" clip-rule="evenodd" /></svg>`;
                }
            }

            playBtn.addEventListener('click', async function () {
                if (!window.currentPlaylistSongs || window.currentPlaylistSongs.length === 0) return;

                // Check if the currently playing song is from this playlist
                const currentFile = window.current_playing_song ? window.current_playing_song.File : null;
                const isFromThisPlaylist = currentFile && window.currentPlaylistSongs.some(s => s.File === currentFile);

                if (isFromThisPlaylist) {
                    // Toggle play/pause
                    await window.toggle_play_pause();
                } else {
                    // Start playing the playlist from the first song
                    const firstSong = window.currentPlaylistSongs[0];
                    window.current_playing_song = firstSong;
                    if (window.set_active_song_ui) window.set_active_song_ui(firstSong);

                    if (window.pywebview && window.pywebview.api && window.pywebview.api.populate_queue_from_list) {
                        await window.pywebview.api.populate_queue_from_list(firstSong, window.currentPlaylistSongs);
                    }
                    await window.play_button(firstSong);
                }
            });
        }
    })();

</script>
