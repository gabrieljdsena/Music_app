<div class="max-w-6xl mx-auto w-full pt-8 px-6 sm:px-8 pb-24 flex flex-col gap-10">
    
    <!-- Playlist Header (Glassmorphism) -->
    <div class="relative group rounded-3xl overflow-hidden p-6 sm:p-10 flex flex-col sm:flex-row items-center sm:items-end gap-6 sm:gap-10 bg-zinc-900/40 border border-white/5 backdrop-blur-2xl shadow-[0_8px_32px_rgba(0,0,0,0.5)] transition-all duration-500">
        <!-- Glassmorphism glare -->
        <div class="absolute inset-0 bg-gradient-to-b from-white/[0.04] to-transparent pointer-events-none"></div>
        
        <!-- Ambient Background Glow inside the header -->
        <div class="absolute -right-1/4 -top-1/4 w-96 h-96 bg-orange-500/10 rounded-full blur-[100px] pointer-events-none z-0"></div>
        
        <!-- Cover Image -->
        <div class="relative w-56 h-56 flex-shrink-0 rounded-2xl overflow-hidden shadow-2xl shadow-black/60 border border-white/10 group-hover:shadow-orange-500/20 transition-all duration-500 z-10 bg-zinc-800 flex items-center justify-center">
            <img id="pv-cover" src="" alt="Playlist Cover" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
            
            <!-- Fallback icon if no image -->
            <div id="pv-cover-fallback" class="absolute inset-0 flex items-center justify-center bg-zinc-800/80">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-20 h-20 text-zinc-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
                </svg>
            </div>
        </div>

        <!-- Details -->
        <div class="relative z-10 flex flex-col items-center sm:items-start text-center sm:text-left flex-1 min-w-0 pb-2">
            <span class="text-xs sm:text-sm font-semibold text-orange-400 tracking-widest uppercase mb-2">Playlist</span>
            <h1 id="pv-title" class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-zinc-100 via-zinc-200 to-zinc-500 tracking-tight truncate w-full pb-1 drop-shadow-sm mb-3 sm:mb-4">Playlist</h1>
            
            <p id="pv-description" class="text-sm sm:text-base text-zinc-400 max-w-2xl line-clamp-2 mb-6 leading-relaxed">Your custom playlist</p>

            <!-- Actions -->
            <div class="flex items-center gap-4 mt-auto">
                <!-- Play Button -->
                <button class="flex items-center justify-center w-14 h-14 hover:cursor-pointer bg-orange-500 text-white rounded-full hover:bg-orange-400 transition-all duration-300 hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(249,115,22,0.3)] hover:shadow-[0_0_30px_rgba(249,115,22,0.5)] focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-7 h-7 ml-1">
                        <path fill-rule="evenodd" d="M4.5 5.653c0-1.427 1.529-2.38 2.831-1.643L20.5 12 7.331 20.007c-1.302.737-2.831-.216-2.831-1.643V5.653Z" clip-rule="evenodd" />
                    </svg>
                </button>
                <!-- Options Button -->
                <button class="flex items-center justify-center w-12 h-12 hover:cursor-pointer bg-white/5 text-zinc-300 rounded-full hover:bg-white/10 hover:text-white transition-all duration-300 hover:scale-105 active:scale-95 border border-white/5 shadow-lg focus:outline-none" title="Options">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM12.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM18.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Controls & Table Placeholder -->
    <div class="flex flex-col gap-4">
        <div class="grid grid-cols-[3fr_2fr_1fr_auto] gap-4 px-4 pb-3 mb-2 text-xs font-semibold tracking-wider text-zinc-500 uppercase border-b border-white/5">
            <div class="cursor-pointer hover:text-zinc-300 transition-colors">Song</div>
            <div class="cursor-pointer hover:text-zinc-300 transition-colors">Album</div>
            <div class="cursor-pointer hover:text-zinc-300 transition-colors text-right">Duration</div>
            <div></div>
        </div>
        
        <!-- Empty state (Dynamically replace this with songs using your JS) -->
        <div id="pv-songs-container" class="flex flex-col gap-2">
            <div class="py-16 flex flex-col items-center justify-center text-center opacity-70">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-zinc-600 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
                </svg>
                <p class="text-zinc-400 font-medium text-lg">It's a bit quiet here</p>
                <p class="text-sm text-zinc-500 mt-2 max-w-md">Start adding songs to your custom playlist by selecting them from your library.</p>
            </div>
        </div>
    </div>
</div>

<script>
    if (window.currentPlaylist) {
        document.getElementById("pv-title").innerText = window.currentPlaylist.title || window.currentPlaylist.Title || "Unknown Playlist";
        const descEl = document.getElementById("pv-description");
        if (descEl) {
            descEl.innerText = window.currentPlaylist.description || window.currentPlaylist.Description || "Your custom playlist";
        }
    }

    (async () => {
        const img = await window.pywebview.api.getImage(window.currentPlaylist.id);
        const imgEl = document.getElementById("pv-cover");
        const fallbackEl = document.getElementById("pv-cover-fallback");

        if (img && imgEl) {
            imgEl.src = img;
            imgEl.alt = window.currentPlaylist.title || "Unknown Playlist";
            if (fallbackEl) fallbackEl.classList.add("hidden");
        }else{
            if (fallbackEl) fallbackEl.classList.remove("hidden");
        }
    })();

</script>
