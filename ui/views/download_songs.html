<!-- Main Song Search Card -->
<div class="flex flex-col items-center justify-start w-full pt-12">

  <!-- Header -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-orange-400 to-orange-500 mb-5 shadow-lg shadow-orange-500/30">
      <!-- Music note SVG -->
      <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
      </svg>
    </div>
    <h1 class="text-3xl sm:text-4xl font-bold from-white text-orange-400">
      Download Songs
    </h1>
    <p class="text-zinc-500 mt-2 text-sm sm:text-base tracking-wide">
      Search & download
    </p>
  </div>

  <!-- Search Section -->
  <div class="space-y-4 w-full max-w-2xl px-4 sm:px-0">
    <!-- Search Bar -->
    <div class="relative group">
      <div class="absolute -inset-1 bg-gradient-to-r from-orange-400 to-orange-500 rounded-2xl opacity-0"></div>
      <div class="relative flex items-center bg-white/[0.06] border border-white/[0.12] rounded-2xl overflow-hidden backdrop-blur-md transition-all duration-300 group-hover:border-white/[0.25] group-hover:bg-white/[0.08] focus-within:border-orange-500 focus-within:ring-1 focus-within:ring-orange-500">
        <!-- Search Icon (SVG) -->
        <div class="pl-5 pr-3">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-500 transition-colors duration-300 group-focus-within:text-orange-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
        <!-- Input -->
        <input
          type="text"
          id="songSearch"
          placeholder="Search for songs, artists, or albums..."
          class="w-full py-4 pr-4 bg-transparent text-white placeholder-gray-500 text-base border-none tracking-wide focus:ring-0 focus:outline-none transition-colors duration-300"
          spellcheck="false"
          autocomplete="off"
        />
        <!-- Clear button (hidden by default) -->
        <button
          id="clearBtn"
          class="pr-4 text-gray-500 hover:text-gray-300 transition-colors duration-200 hidden"
          onclick="clearSearch()"
        >
          <!-- X circle SVG -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Search and Import Buttons -->
    <div class="flex flex-col sm:flex-row gap-3 mt-5 w-full">
      <button
        id="searchBtn" onclick="search_click()"
        class="flex-1 relative group overflow-hidden rounded-2xl font-semibold text-white text-lg py-4 transition-all duration-300 active:scale-[0.98] hover:-translate-y-1 hover:shadow-xl hover:shadow-orange-500/30 hover:bg-orange-600 bg-orange-500 hover:cursor-pointer">
          <!-- Content -->
        <span class="relative flex items-center justify-center gap-3">
          <!-- Search SVG -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <span>Search Songs</span>
        </span>
      </button>

      <button onclick="document.getElementById('txtFileInput').click()" 
        class="sm:w-auto relative group overflow-hidden rounded-2xl font-semibold text-orange-400 text-lg py-4 px-6 transition-all duration-300 active:scale-[0.98] hover:-translate-y-1 hover:shadow-xl hover:shadow-orange-500/30 hover:bg-orange-500/10 bg-white/[0.06] border border-orange-500/30 hover:border-orange-500 hover:cursor-pointer flex items-center justify-center gap-3">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
          </svg>
          <span class="whitespace-nowrap">Import .txt</span>
      </button>
      <input type="file" id="txtFileInput" accept=".txt" class="hidden">
    </div>

    <!-- Trending tags -->
    <div id="trending-tags" class="flex flex-wrap gap-2 mt-5 justify-center items-center min-h-[28px]">
      <span class="text-xs text-gray-500 tracking-wider uppercase">Trending:</span>
      <span class="spinner" style="width: 16px; height: 16px; border-width: 2px;"></span>
    </div>

    <!-- Search Results Container -->
    <div id="search-results-container" class="mt-8 w-full flex flex-col gap-3 pb-24"></div>
  </div>

<!-- Custom animations & script (self-contained) -->
<style>
  /* Custom animations previously in tailwind.config */
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-20px); }
  }
  @keyframes glow {
    0% { box-shadow: 0 0 20px rgba(251, 146, 60, 0.3); }
    100% { box-shadow: 0 0 40px rgba(251, 146, 60, 0.6); }
  }
  .animate-float {
    animation: float 6s ease-in-out infinite;
  }
  .animate-glow {
    animation: glow 2s ease-in-out infinite alternate;
  }
  .animate-pulse-slow {
    animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }
  /* Simple spinner (no external dependency) */
  .spinner {
    border: 3px solid rgba(255,255,255,0.2);
    border-top: 3px solid #f97316; /* orange-500 */
    border-radius: 50%;
    width: 20px;
    height: 20px;
    animation: spin 0.8s linear infinite;
    display: inline-block;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>

<script type="module">
    // Icon SVGs for different states
  const icons = {
    check: `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`,
    search: `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-orange-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>`,
    clearX: `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`,
    warning: `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-orange-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>`,
    spinner: `<span class="spinner"></span>`,
    download: `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>`
  };

  // Initialize Notyf
  const notyf = new Notyf({
    position: {
    x: 'right',
    y: 'bottom'
    }
  });

  // New Search functionality
  window.search_click = async function() {
    const val = $('#songSearch').val();
    if (!val) return;
    
    const container = $('#search-results-container');
    container.html(`<div class="text-center text-orange-400 py-8"><span class="spinner"></span><p class="mt-2 text-zinc-400 text-sm">Searching YouTube...</p></div>`);
    
    try {
        // Call the Python API to search (ensure this is exposed in your pywebview api!)
        const results = await window.pywebview.api.search_yt(val);
        
        container.empty();
        if (!Array.isArray(results) || results.length === 0) {
            container.html('<p class="text-zinc-500 text-center py-4">No results found.</p>');
            return;
        }

        results.forEach(result => {
            // Format duration from seconds
            const min = Math.floor(result.duration / 60);
            const sec = Math.floor(result.duration % 60).toString().padStart(2, '0');
            const thumbnail = result.thumbnail || 'https://via.placeholder.com/120x90?text=No+Image';
            
            // Escape quotes in title
            const safeTitle = result.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            
            const html = `
            <div class="flex items-center gap-4 bg-white/[0.04] border border-white/[0.08] rounded-xl p-3 hover:bg-white/[0.08] transition-all duration-300">
                <div class="relative w-24 h-16 flex-shrink-0 group rounded-lg overflow-hidden cursor-pointer shadow-md" onclick="preview_video('${result.id}')">
                    <img src="${thumbnail}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity backdrop-blur-[2px]">
                        <!-- Play Icon -->
                        <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                </div>
                <div class="flex-1 min-w-0">
                    <h4 class="text-zinc-100 font-medium truncate text-sm sm:text-base">${result.title}</h4>
                    <p class="text-zinc-500 text-xs sm:text-sm truncate">${result.uploader} • ${min}:${sec}</p>
                </div>
                <div class="flex gap-2 flex-shrink-0">
                    <button onclick="download_specific('${result.id}', '${safeTitle}')" class="hover:cursor-pointer flex items-center justify-center w-10 h-10 rounded-full bg-orange-500/10 text-orange-400 hover:bg-orange-500 hover:text-white transition-colors shadow-md" title="Download">
                        ${icons.download}
                    </button>
                </div>
            </div>
            `;
            container.append(html);
        });
    } catch (e) {
        container.html(`<p class="text-red-400 text-center py-4">Error searching. Make sure you exposed "search_yt" in api.py!</p>`);
        console.error("Search error: ", e);
    }
  };

  // Original JS -> Python entrypoint (kept for backwards compatibility)
  async function download_click() {
    const val = $('#songSearch').val();
    if (!val) return;
    
    window.add_progress_bar(val);
    
    $('#songSearch').val("");
    try {
        const response = await window.pywebview.api.recieve_download(val);
        const isError = response === false || (typeof response === 'number' && response !== 0) || (typeof response === 'string' && response.toLowerCase().includes('error'));
        if (isError) {
            notyf.error(`Failed to download: ${val}`);
            if (typeof window.update_download_progress === 'function') window.update_download_progress(val, 100, 'Failed');
        } else {
            notyf.success(`Song Downloaded: ${val}`);
        }
    } catch (e) {
        notyf.error(`Download error: ${val}`);
        if (typeof window.update_download_progress === 'function') window.update_download_progress(val, 100, 'Failed');
    } finally {
        setTimeout(() => window.remove_progress_bar(val), 3000);
    }
  }

  window.add_progress_bar = function(id, display_text) {
    display_text = display_text || id;
    const safeId = btoa(encodeURIComponent(id)).replace(/[^a-zA-Z0-9]/g, '');
    
    // Ensure the container exists on the main body so it persists across tabs
    if ($('#global-downloads-container').length === 0) {
      $('body').append('<div id="global-downloads-container" class="fixed top-6 right-6 w-80 max-w-[calc(100vw-3rem)] flex flex-col gap-3 z-[9999] empty:hidden pointer-events-none *:pointer-events-auto"></div>');
    }

    if ($(`#progress-${safeId}`).length) return;

    const html = `
      <div id="progress-${safeId}" class="bg-zinc-900/95 border border-white/[0.12] rounded-xl p-4 backdrop-blur-md flex flex-col gap-2 shadow-2xl">
        <div class="flex justify-between items-center text-sm">
          <span class="text-white font-medium truncate pr-4">${display_text}</span>
          <span id="percent-${safeId}" class="text-orange-400 font-semibold w-auto whitespace-nowrap text-right">0%</span>
        </div>
        <div class="w-full bg-white/[0.1] rounded-full h-2.5 overflow-hidden">
          <div id="bar-${safeId}" class="bg-gradient-to-r from-orange-400 to-orange-500 h-2.5 rounded-full transition-all duration-300 shadow-[0_0_10px_rgba(251,146,60,0.5)]" style="width: 0%"></div>
        </div>
      </div>
    `;
    
    $('#global-downloads-container').append(html);
  }

  window.remove_progress_bar = function(id) {
    const safeId = btoa(encodeURIComponent(id)).replace(/[^a-zA-Z0-9]/g, '');
    $(`#progress-${safeId}`).fadeOut(300, function() { $(this).remove(); });
  }

  // Preview video using SweetAlert2 and an iframe
  window.preview_video = function(videoId) {
    Swal.fire({
        html: `
            <div class="relative w-full" style="padding-bottom: 56.25%;">
                <iframe class="absolute top-0 left-0 w-full h-full rounded-lg" 
                    src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                    title="YouTube video player" frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
        `,
        width: 600,
        background: '#18181b', // zinc-900
        showConfirmButton: false,
        showCloseButton: true,
        padding: '1rem',
        customClass: {
            popup: 'border border-white/10 rounded-2xl shadow-2xl',
            closeButton: 'focus:outline-none hover:text-orange-400'
        }
    });
  };

  // Modified download function to take specific video ID from search results
  window.download_specific = async function(id, title) {
    const url = `https://www.youtube.com/watch?v=${id}`;
    window.add_progress_bar(url, title);

    notyf.open({
      message: `<b>Downloading:</b> ${title}`,
      background: '#fb923c',
      duration: 5000,
      dismissible: true
    });
    
    try {
        // Pass the direct URL to the backend
        const response = await window.pywebview.api.recieve_download(url);
        const isError = response === false || (typeof response === 'number' && response !== 0) || (typeof response === 'string' && response.toLowerCase().includes('error'));
        if (isError) {
            notyf.error(`Failed to download: ${title}`);
            if (typeof window.update_download_progress === 'function') window.update_download_progress(url, 100, 'Failed');
        } else {
            notyf.success(`Song Downloaded: ${title}`);
        }
    } catch (e) {
        notyf.error(`Failed to download: ${title}`);
        if (typeof window.update_download_progress === 'function') window.update_download_progress(url, 100, 'Failed');
    } finally {
        setTimeout(() => window.remove_progress_bar(url), 3000);
    }
  };

  // Trigger search on Enter key press
  document.getElementById('songSearch').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      search_click();
    }
  });

  // Quick Search tags implementation
  window.quickSearch = function(term) {
    $('#songSearch').val(term);
    search_click();
  };

  window.update_download_progress = function(id, percent, statusText) {
    const safeId = btoa(encodeURIComponent(id)).replace(/[^a-zA-Z0-9]/g, '');
    
    const progressBar = document.getElementById(`bar-${safeId}`);
    const percentText = document.getElementById(`percent-${safeId}`);
    
    if (progressBar) {
        progressBar.style.width = `${percent}%`;
    }
    if (percentText) {
        if (statusText) {
            percentText.innerText = statusText;
        } else {
            percentText.innerText = `${Math.floor(percent)}%`;
        }
    }
  }

  // Fetch iTunes Top Weekly/Daily Songs
  async function loadTrending() {
    const container = $('#trending-tags');
    
    try {
      // Fetch top 4 songs from iTunes RSS feed
      const response = await fetch('https://itunes.apple.com/us/rss/topsongs/limit=4/json');
      const data = await response.json();
      
      const songs = data.feed.entry.slice(0, 4);
      
      container.empty();
      container.append('<span class="text-xs text-gray-500 tracking-wider uppercase">Trending:</span>');
      
      songs.forEach(song => {
        const title = song['im:name'].label;
        const artist = song['im:artist'].label;
        
        let displayTitle = title.split(' (')[0].split(' - ')[0];
        const searchQuery = `${title} ${artist}`.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        
        container.append(`<button onclick="quickSearch('${searchQuery}')" class="px-3 py-1 text-xs rounded-full bg-white/[0.05] border border-white/[0.08] text-gray-300 hover:bg-white/[0.12] hover:text-white hover:border-white/[0.2] transition-all duration-200 cursor-pointer whitespace-nowrap truncate max-w-[150px] sm:max-w-[200px]" title="${title} by ${artist}">${displayTitle}</button>`);
      });
    } catch (e) {
      console.error("Failed to load iTunes trending:", e);
      container.html(`<span class="text-xs text-gray-500 tracking-wider uppercase">Trending:</span><button onclick="quickSearch('Blinding Lights The Weeknd')" class="px-3 py-1 text-xs rounded-full bg-white/[0.05] border border-white/[0.08] text-gray-300 hover:bg-white/[0.12] hover:text-white hover:border-white/[0.2] transition-all duration-200 cursor-pointer">Blinding Lights</button>`);
    }
  }

  loadTrending();

  window.download_click = download_click;


  

  // File Import Logic
  document.getElementById('txtFileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async function(event) {
        const text = event.target.result;
        const songs = text.split(/\r?\n/).map(s => s.trim()).filter(s => s.length > 0);
        
        if (songs.length === 0) {
            notyf.error('No songs found in the file.');
            e.target.value = ''; // Reset input
            return;
        }

        notyf.success(`Starting import of ${songs.length} songs`);
        e.target.value = ''; // Reset input

        let limit = window.limit_downloads || 3;

        await processBatchDownloads(songs, limit);
        notyf.success('Batch import completed!');
    };
    reader.readAsText(file);
  });

  async function processBatchDownloads(songs, concurrency) {
    let index = 0;

    async function worker() {
        while (index < songs.length) {
            const songIndex = index++;
            const song = songs[songIndex];
            let currentBarId = song;
            
            try {
                  // Show an initial searching state
                  window.add_progress_bar(currentBarId, `Searching: ${song}`);
                  window.update_download_progress(currentBarId, 10, 'Searching...');
                  
                  const results = await window.pywebview.api.search_yt(song);
                  if (Array.isArray(results) && results.length > 0) {
                      const bestResult = results[0];
                      const url = `https://www.youtube.com/watch?v=${bestResult.id}`;
                      
                      // Swap progress bar to the actual video title and URL ID
                      window.remove_progress_bar(currentBarId);
                      currentBarId = url;
                      window.add_progress_bar(currentBarId, bestResult.title);
                      
                      const response = await window.pywebview.api.recieve_download(url);
                      const isError = response === false || (typeof response === 'number' && response !== 0) || (typeof response === 'string' && response.toLowerCase().includes('error'));
                      if (isError) {
                          notyf.error(`Failed: ${bestResult.title}`);
                          window.update_download_progress(currentBarId, 100, 'Failed');
                      }
                  } else {
                      notyf.error(`No results found for: ${song}`);
                      window.update_download_progress(currentBarId, 100, 'Failed');
                  }
            } catch (e) {
                console.error("Error downloading " + song, e);
                notyf.error(`Failed: ${song}`);
                window.update_download_progress(currentBarId, 100, 'Failed');
            } finally {
                setTimeout(() => window.remove_progress_bar(currentBarId), 3000);
                // Add a small delay so YouTube doesn't block the connection
                await new Promise(r => setTimeout(r, 1500));
            }
        }
    }

    const workers = [];
    for (let i = 0; i < concurrency; i++) {
        workers.push(worker());
    }

    await Promise.all(workers);
  }

</script>
