<div class="max-w-6xl mx-auto w-full pt-8 px-6 sm:px-8 pb-24 flex flex-col gap-8">
    <!-- Header -->
    <div class="flex items-center gap-4">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-orange-500/10 border border-orange-500/20 text-orange-400 shadow-[0_0_15px_rgba(249,115,22,0.15)]">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                <path d="M11.47 3.84a.75.75 0 011.06 0l8.99 8.99a.75.75 0 11-1.06 1.06L12 5.43 3.53 13.89a.75.75 0 11-1.06-1.06L11.47 3.84z" />
                <path d="M4.5 12.93v7.32c0 .41.34.75.75.75h4.5a.75.75 0 00.75-.75v-4.5a.75.75 0 01.75-.75h2.5a.75.75 0 01.75.75v4.5a.75.75 0 00.75.75h4.5a.75.75 0 00.75-.75v-7.32l-7.5-7.5-7.5 7.5z" />
            </svg>
        </div>
        <div>
            <h1 class="text-3xl font-bold text-zinc-100">Home</h1>
            <p id="home-date-subtitle" class="text-sm text-zinc-500 mt-1 tracking-wide">Pick what to listen to</p>
        </div>
    </div>

    <!-- Cards -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <!-- All Songs card -->
        <div id="home-card-all-songs"
            class="group relative rounded-3xl overflow-hidden p-6 sm:p-8 flex flex-col gap-6 bg-zinc-900/40 border border-white/5 hover:border-orange-500/40 backdrop-blur-2xl shadow-[0_8px_32px_rgba(0,0,0,0.5)] transition-all duration-300 cursor-pointer hover:shadow-orange-500/10 min-h-[260px]">
            <div class="absolute inset-0 bg-gradient-to-b from-white/[0.04] to-transparent pointer-events-none"></div>
            <div class="absolute -right-16 -top-16 w-64 h-64 bg-orange-500/10 rounded-full blur-[80px] pointer-events-none"></div>

            <div class="relative z-10 flex items-start justify-between">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-orange-400 to-orange-600 flex items-center justify-center shadow-lg shadow-orange-500/30 group-hover:scale-110 transition-transform duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                    </svg>
                </div>
                <div class="w-12 h-12 rounded-full bg-orange-500 text-white flex items-center justify-center shadow-lg shadow-orange-500/40 opacity-0 group-hover:opacity-100 translate-y-2 group-hover:translate-y-0 transition-all duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 ml-0.5">
                        <path fill-rule="evenodd" d="M4.5 5.653c0-1.427 1.529-2.38 2.831-1.643L20.5 12 7.331 20.007c-1.302.737-2.831-.216-2.831-1.643V5.653Z" clip-rule="evenodd" />
                    </svg>
                </div>
            </div>

            <div class="relative z-10 mt-auto">
                <h2 class="text-2xl font-bold text-zinc-100 group-hover:text-orange-400 transition-colors">All Songs</h2>
                <p id="home-all-songs-count" class="text-sm text-zinc-500 mt-1">Loading library…</p>
                <p class="text-xs text-zinc-600 mt-3 leading-relaxed">Browse, search and sort your full library.</p>
            </div>
        </div>

        <!-- Daily Mix card -->
        <div id="home-card-daily-mix"
            class="group relative rounded-3xl overflow-hidden p-6 sm:p-8 flex flex-col gap-6 bg-zinc-900/40 border border-white/5 hover:border-orange-500/40 backdrop-blur-2xl shadow-[0_8px_32px_rgba(0,0,0,0.5)] transition-all duration-300 cursor-pointer hover:shadow-orange-500/10 min-h-[260px]">
            <div class="absolute inset-0 bg-gradient-to-b from-white/[0.04] to-transparent pointer-events-none"></div>
            <div class="absolute -right-16 -top-16 w-64 h-64 bg-orange-600/15 rounded-full blur-[80px] pointer-events-none"></div>

            <div class="relative z-10 flex items-start justify-between">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center shadow-lg shadow-orange-500/30 group-hover:scale-110 transition-transform duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456z" />
                    </svg>
                </div>
                <span id="home-daily-badge" class="text-[11px] font-semibold uppercase tracking-widest px-2.5 py-1 rounded-full bg-orange-500/15 text-orange-300 border border-orange-500/30">Today</span>
            </div>

            <div class="relative z-10 mt-auto">
                <h2 class="text-2xl font-bold text-zinc-100 group-hover:text-orange-400 transition-colors">Daily Mix</h2>
                <p id="home-daily-count" class="text-sm text-zinc-500 mt-1">Generating your mix…</p>
                <p class="text-xs text-zinc-600 mt-3 leading-relaxed">Fresh every day.</p>
            </div>
        </div>
    </div>

    <!-- Recently Played (horizontal) -->
    <div class="flex flex-col gap-4">
        <div class="flex items-center justify-between px-1">
            <h2 class="text-xl font-bold text-zinc-100">Recently Played</h2>
            <button onclick="_homeGo('history')"
                class="text-xs font-semibold uppercase tracking-widest text-zinc-500 hover:text-orange-400 transition-colors cursor-pointer focus:outline-none">See all</button>
        </div>
        <div id="home-recent-row" class="flex gap-4 overflow-x-auto pb-3 custom-scrollbar">
            <div class="text-sm text-zinc-500 animate-pulse py-8">Loading…</div>
        </div>
    </div>

    <!-- Recently Downloaded (horizontal) -->
    <div class="flex flex-col gap-4">
        <div class="flex items-center justify-between px-1">
            <h2 class="text-xl font-bold text-zinc-100">Recently Downloaded</h2>
            <button onclick="_homeGo('history')"
                class="text-xs font-semibold uppercase tracking-widest text-zinc-500 hover:text-orange-400 transition-colors cursor-pointer focus:outline-none">See all</button>
        </div>
        <div id="home-downloaded-row" class="flex gap-4 overflow-x-auto pb-3 custom-scrollbar">
            <div class="text-sm text-zinc-500 animate-pulse py-8">Loading…</div>
        </div>
    </div>

</div>

<div id="edit-song-modal-container"></div>
<div id="add-playlist-modal-container"></div>

<script>
    function _homeGo(page) {
        if (typeof window.navigateTo === 'function') {
            window.navigateTo(page);
        } else if (typeof navigateTo === 'function') {
            navigateTo(page);
        }
    }

    document.getElementById('home-card-all-songs').addEventListener('click', () => _homeGo('all_songs'));
    document.getElementById('home-card-daily-mix').addEventListener('click', () => _homeGo('daily_mix'));

    // Home dashboard exposes no song list (cards only).
    window._homeSongsData = [];
    window._homeRenderedSongs = [];
    window._homeRecentSongs = [];
    window._homeDownloadedSongs = [];
    window.get_current_home_view_songs = function () { return []; };

    function _homePlayFromStrip(song, queueKey) {
        (async () => {
            const queue = window[queueKey] || [];
            const source = queueKey === '_homeDownloadedSongs'
                ? { type: 'recently_downloaded', id: null }
                : { type: 'recently_played', id: null };
            window.current_playing_song = song;
            if (window.set_active_song_ui) window.set_active_song_ui(song);
            if (window.pywebview && window.pywebview.api && window.pywebview.api.populate_queue_from_list) {
                await window.pywebview.api.populate_queue_from_list(song, queue, null, source);
            }
            await window.play_button(song);
        })();
    }

    function _homeRenderStrip(rowId, songs, queueKey, emptyText) {
        const row = document.getElementById(rowId);
        if (!row) return;
        window[queueKey] = songs || [];
        row.innerHTML = '';
        if (!window[queueKey].length) {
            row.innerHTML = `<div class="py-8 text-sm text-zinc-500">${emptyText}</div>`;
            return;
        }
        window[queueKey].forEach((song) => {
            const card = document.createElement('div');
            card.className = 'home-strip-card group relative w-36 sm:w-44 flex-shrink-0 rounded-2xl overflow-hidden bg-zinc-900/40 border border-white/5 hover:border-orange-500/40 transition-all duration-300 cursor-pointer';
            if (song.File) card.setAttribute('data-file', song.File);
            card._songData = song;

            const cover = document.createElement('div');
            cover.className = 'strip-cover aspect-square w-full bg-zinc-800 overflow-hidden relative';
            if (song.CoverArt) {
                const img = document.createElement('img');
                img.src = song.CoverArt;
                img.alt = song.Title || '';
                img.className = 'w-full h-full object-cover group-hover:scale-105 transition-transform duration-500';
                cover.appendChild(img);
            } else {
                const lazy = document.createElement('div');
                lazy.className = 'w-full h-full bg-zinc-800 flex items-center justify-center lazy-cover';
                if (song.File) lazy.setAttribute('data-filename', song.File);
                lazy.innerHTML = `<svg class="w-10 h-10 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>`;
                cover.appendChild(lazy);
                if (window.lazyCoverObserver) window.lazyCoverObserver.observe(lazy);
            }

            const overlay = document.createElement('div');
            overlay.className = 'absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center';
            overlay.innerHTML = `<div class="w-11 h-11 rounded-full bg-orange-500 hover:bg-orange-400 flex items-center justify-center text-white shadow-lg shadow-orange-500/40 transform translate-y-2 group-hover:translate-y-0 transition-transform duration-300">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 ml-0.5"><path fill-rule="evenodd" d="M4.5 5.653c0-1.427 1.529-2.38 2.831-1.643L20.5 12 7.331 20.007c-1.302.737-2.831-.216-2.831-1.643V5.653Z" clip-rule="evenodd" /></svg>
            </div>`;
            cover.appendChild(overlay);

            const meta = document.createElement('div');
            meta.className = 'p-3 flex flex-col min-w-0';
            const title = document.createElement('div');
            title.className = 'strip-title text-sm font-medium text-zinc-100 truncate group-hover:text-orange-400 transition-colors';
            title.textContent = song.Title || 'Unknown Title';
            const artist = document.createElement('div');
            artist.className = 'text-xs text-zinc-500 truncate mt-0.5';
            artist.textContent = song.Artist || 'Unknown Artist';
            meta.appendChild(title);
            meta.appendChild(artist);

            card.appendChild(cover);
            card.appendChild(meta);
            card.addEventListener('click', () => _homePlayFromStrip(song, queueKey));
            row.appendChild(card);
        });
    }

    (function initHomeDashboard() {
        const dateEl = document.getElementById('home-date-subtitle');
        if (dateEl) {
            try {
                dateEl.textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
            } catch (e) {}
        }

        async function api() {
            if (window.pywebview && window.pywebview.api) return window.pywebview.api;
            await new Promise(resolve => window.addEventListener('pywebviewready', resolve, { once: true }));
            return window.pywebview.api;
        }

        (async () => {
            try {
                const py = await api();
                if (py && typeof py.get_library_count === 'function') {
                    const count = await py.get_library_count();
                    const el = document.getElementById('home-all-songs-count');
                    if (el) el.textContent = `${count} song${count === 1 ? '' : 's'} in your library`;
                } else if (py && typeof py.get_all_songs === 'function') {
                    const songs = await py.get_all_songs();
                    const el = document.getElementById('home-all-songs-count');
                    if (el) el.textContent = `${(songs || []).length} songs in your library`;
                }
            } catch (e) {
                const el = document.getElementById('home-all-songs-count');
                if (el) el.textContent = 'Browse your full library';
            }

            try {
                const py = await api();
                if (py && typeof py.get_daily_mix === 'function') {
                    const mix = await py.get_daily_mix();
                    const songs = (mix && mix.songs) || [];
                    const date = (mix && mix.date) || '';
                    const el = document.getElementById('home-daily-count');
                    if (el) {
                        let dateStr = date;
                        try {
                            dateStr = new Date(date + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
                        } catch (err) {}
                        el.textContent = `${songs.length} songs · ${dateStr}`;
                    }
                }
            } catch (e) {
                const el = document.getElementById('home-daily-count');
                if (el) el.textContent = 'A fresh mix every day';
            }

            try {
                const py = await api();
                if (py && typeof py.get_recently_played === 'function') {
                    const recent = await py.get_recently_played(15);
                    _homeRenderStrip('home-recent-row', recent || [], '_homeRecentSongs', 'Nothing played yet — play something and it will show up here.');
                }
            } catch (e) {
                const row = document.getElementById('home-recent-row');
                if (row) row.innerHTML = `<div class="py-8 text-sm text-zinc-500">Could not load recently played.</div>`;
            }

            try {
                const py = await api();
                if (py && typeof py.get_recently_downloaded === 'function') {
                    const downloaded = await py.get_recently_downloaded(15);
                    _homeRenderStrip('home-downloaded-row', downloaded || [], '_homeDownloadedSongs', 'Nothing downloaded yet — grab some music and it will show up here.');
                }
            } catch (e) {
                const row = document.getElementById('home-downloaded-row');
                if (row) row.innerHTML = `<div class="py-8 text-sm text-zinc-500">Could not load recently downloaded.</div>`;
            }

            // If something is already playing, mark it in the strips.
            if (window.current_playing_song && typeof window.set_active_song_ui === 'function') {
                try { window.set_active_song_ui(window.current_playing_song); } catch (e) {}
            }
        })();
    })();

    fetch('modals/edit_song.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('edit-song-modal-container').innerHTML = html;
            const scripts = document.getElementById('edit-song-modal-container').getElementsByTagName('script');
            for (let i = 0; i < scripts.length; i++) {
                window.eval(scripts[i].innerText);
            }
        }).catch(err => console.error('Failed to load modal:', err));

    fetch('modals/add_playlist.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('add-playlist-modal-container').innerHTML = html;
            const scripts = document.getElementById('add-playlist-modal-container').getElementsByTagName('script');
            for (let i = 0; i < scripts.length; i++) {
                window.eval(scripts[i].innerText);
            }
        }).catch(err => console.error('Failed to load add_playlist modal:', err));
</script>
