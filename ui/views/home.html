                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />

            <button id="toggle-lyrics-btn" class="flex items-center justify-center w-10 h-10 bg-zinc-900/40 hover:bg-zinc-800/40 backdrop-blur-xl border border-white/5 rounded-full focus:outline-none shadow-[0_4px_20px_rgba(0,0,0,0.1)] transition-transform hover:scale-105 active:scale-95" title="Toggle Lyrics">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-zinc-400 hover:text-orange-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
            </button>
            <button id="toggle-queue-btn" class="flex items-center justify-center w-10 h-10 bg-zinc-900/40 hover:bg-zinc-800/40 backdrop-blur-xl border border-white/5 rounded-full text-zinc-400 hover:text-orange-400 transition-colors focus:outline-none shadow-[0_4px_20px_rgba(0,0,0,0.1)]" title="Toggle Queue">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h8m4-4v8m-4-4h8"></path></svg>
            </button>
        </div>
        <div id="list" class="max-w-5xl w-full mx-auto px-6 sm:px-8 pb-10">
            <div id="table">
                <!-- Header Row -->
                <div id="table-header" class="grid grid-cols-[3fr_2fr_1fr_auto] gap-4 px-4 pb-3 mb-2 text-xs font-semibold tracking-wider text-zinc-500 uppercase border-b border-white/5"> 
                    <div class="cursor-pointer hover:text-zinc-300 transition-colors">Song</div>
                    <div class="cursor-pointer hover:text-zinc-300 transition-colors">Album</div>
                    <div class="cursor-pointer hover:text-zinc-300 transition-colors text-right">Duration</div>
                    <div></div>
                </div>
        
                <!-- Body Row -->
                <div id="table-body" class="flex flex-col gap-1 pb-2"> 
                    <!-- Content will be dynamically populated via Javascript -->
                </div>
            </div>
        </div>
        
        <!-- Lyrics Container (Hidden by Default) -->
        <div id="lyrics-container-view" class="hidden max-w-7xl w-full h-full mx-auto px-6 sm:px-8 pb-10 flex-col items-center overflow-hidden relative">
            <div id="lyrics-container" class="w-full max-w-2xl text-center space-y-4 overflow-y-auto h-full px-4 scroll-smooth pb-32 pt-32 custom-scrollbar">
                <p class="text-zinc-500 text-xl animate-pulse">Select a song to load lyrics...</p>
            </div>
        </div>
    </div>

    <!-- Queue Auxiliary Bar -->
    <div id="queue-sidebar" class="w-full xl:w-80 flex-shrink-0 border bg-zinc-900/40 backdrop-blur-md rounded-2xl flex flex-col h-[calc(100vh-180px)] sticky top-0 shadow-2xl transition-all duration-300 ease-[cubic-bezier(0.4,0,0.2,1)] z-10 overflow-hidden max-w-0 max-h-0 opacity-0 invisible border-transparent m-0 p-0">
        <div class="flex flex-col w-[100vw] xl:w-[320px] h-[calc(100vh-180px)] flex-shrink-0">
            <div class="p-5 border-b border-white/5 flex items-center justify-between">
                <h2 class="text-base font-semibold text-zinc-100 flex items-center gap-2">
                    <svg class="w-4 h-4 text-orange-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h8m4-4v8m-4-4h8"></path></svg>
                    Up Next
                </h2>
                <button id="clear-queue-btn" class="text-xs font-medium text-zinc-500 hover:text-orange-400 transition-colors focus:outline-none uppercase tracking-wider">Clear</button>
            </div>
            <div class="p-3 overflow-y-auto flex-1 custom-scrollbar">
                <div id="queue-body" class="flex flex-col gap-1">
                    <p id="empty-queue-msg" class="text-sm text-zinc-500 text-center py-8">Queue is empty</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Context Menu (Hidden by default) -->
<div id="bento-context-menu" class="hidden fixed z-50 w-48 py-1 bg-zinc-800 border border-white/10 rounded-xl shadow-2xl origin-top-right">
    <button id="bento-play-btn" class="w-full text-left px-4 py-2 text-sm text-zinc-300 hover:bg-white/5 hover:text-white transition-colors flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        Play
    </button>
    <button id="bento-delete-btn" class="w-full text-left px-4 py-2 text-sm text-zinc-300 hover:bg-white/5 hover:text-white transition-colors flex items-center gap-2 text-red-400 hover:text-red-300">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        Delete
    </button>
    <button id="bento-edit-btn" class="w-full text-left px-4 py-2 text-sm text-zinc-300 hover:bg-white/5 hover:text-white transition-colors flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
        Edit Info
    </button>
    <button id="bento-add-queue-btn" class="w-full text-left px-4 py-2 text-sm text-zinc-300 hover:bg-white/5 hover:text-white transition-colors flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h8m4-4v8m-4-4h8"></path></svg>
        Add to queue
    </button>
    <button id="bento-add-playlist-btn" class="w-full text-left px-4 py-2 text-sm text-zinc-300 hover:bg-white/5 hover:text-white transition-colors flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
        Add to Playlist
    </button>
</div>

<div id="edit-song-modal-container"></div>

<script>
    window.parsedLyrics = [];
    
    function parseLRC(lrcText) {
        const lines = lrcText.split('\n');
        const result = [];
        const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

        lines.forEach(line => {
            const match = timeRegex.exec(line);
            if (match) {
                const minutes = parseInt(match[1]);
                const seconds = parseInt(match[2]);
                const milliseconds = parseInt(match[3].padEnd(3, '0'));
                const timeInSeconds = (minutes * 60) + seconds + (milliseconds / 1000);
                const text = line.replace(timeRegex, '').trim();
                
                if (text) {
                    result.push({ time: timeInSeconds, text: text });
                } else {
                    result.push({ time: timeInSeconds, text: '♪' });
                }
            }
        });
        return result;
    }

    function renderLyrics() {
        const container = document.getElementById('lyrics-container');
        if (!container) return;
        
        container.innerHTML = '';
        if (window.parsedLyrics.length === 0) {
            container.innerHTML = '<p class="text-zinc-500 text-xl">No synchronized lyrics found.</p>';
            return;
        }

        window.parsedLyrics.forEach((line, index) => {
            const p = document.createElement('p');
            p.id = `lyric-line-${index}`;
            p.className = 'lyric-line text-2xl text-zinc-500 cursor-pointer hover:text-zinc-300 transition-all duration-300';
            p.innerText = line.text;
            p.onclick = () => {
                if (window.pywebview && window.pywebview.api) {
                    window.pywebview.api.progress_slider_click(line.time);
                }
            };
            container.appendChild(p);
        });
    }

    window.updateHighlightedLine = function(currentTime) {
        if (!window.parsedLyrics || window.parsedLyrics.length === 0) return;

        let activeIndex = -1;
        for (let i = 0; i < window.parsedLyrics.length; i++) {
            if (currentTime >= window.parsedLyrics[i].time) {
                activeIndex = i;
            } else {
                break;
            }
        }

        if (activeIndex !== -1) {
            const currentActive = document.querySelector('.lyric-line.active-lyric');
            const newActive = document.getElementById(`lyric-line-${activeIndex}`);
            
            if (currentActive !== newActive) {
                if (currentActive) {
                    currentActive.classList.remove('active-lyric', 'text-white', 'scale-105', 'font-bold');
                    currentActive.classList.add('text-zinc-500');
                }
                if (newActive) {
                    newActive.classList.remove('text-zinc-500');
                    newActive.classList.add('active-lyric', 'text-white', 'scale-105', 'font-bold');
                    newActive.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }
    };

    window.fetchLyricsForCurrentSong = async function(songData) {
        const container = document.getElementById('lyrics-container');
        if (!container) return;
        
        songData = songData || window.current_playing_song;
        if (!songData) return;

        container.innerHTML = `<p class="text-zinc-500 text-xl animate-pulse">Loading lyrics for ${songData.Title}...</p>`;
        window.parsedLyrics = [];

        try {
            const lyricsData = await window.pywebview.api.get_lyrics(
                songData.Title, 
                songData.Artist, 
                songData.Album, 
                songData.Duration
            );
            
            if (lyricsData && lyricsData.synced) {
                window.parsedLyrics = parseLRC(lyricsData.synced);
                renderLyrics();
            } else if (lyricsData && lyricsData.plain) {
                container.innerHTML = `<div class="text-zinc-300 text-lg whitespace-pre-line leading-loose pt-8">${lyricsData.plain}</div>`;
            } else {
                container.innerHTML = '<p class="text-zinc-500 text-xl">No lyrics found for this song.</p>';
            }
        } catch (error) {
            container.innerHTML = '<p class="text-red-400 text-xl">Failed to load lyrics.</p>';
        }
    };

    // Helper function to guarantee only one active song UI at a time
    window.set_active_song_ui = function(songData) {
        const activeClasses = "bg-orange-500/10 scale-[1.02] shadow-xl relative z-10 ring-1 ring-orange-500/30";
        
        $(".song-row").removeClass(activeClasses);
        $(".song-row .song-title").removeClass("text-orange-400").addClass("text-zinc-100");
        $(".list-visualizer").remove();

        if (!songData) return;
        const fileName = songData.File;

        $(".song-row").each(function() {
            const rowData = $(this).data("path");
            const rowFileName = rowData ? rowData.File : null;
            if (rowFileName === fileName) {
                $(this).addClass(activeClasses);
                $(this).find(".song-title").removeClass("text-zinc-100").addClass("text-orange-400");
                $(this).find(".cover-art-container").before(`
                    <div class="flex items-end justify-center gap-[2px] w-4 h-4 ml-1 flex-shrink-0 list-visualizer transition-all duration-300 overflow-hidden">
                        <div class="visualizer-bar"></div>
                        <div class="visualizer-bar"></div>
                        <div class="visualizer-bar"></div>
                        <div class="visualizer-bar"></div>
                    </div>
                `);
            }
        });
    };

    window.queue_songs = window.queue_songs || [];
    window.is_custom_queue = window.is_custom_queue || false;

    window.update_queue_ui = function() {
        const queueBody = $("#queue-body");
        queueBody.find(".queue-item").remove();

        if (window.queue_songs.length === 0) {
            $("#empty-queue-msg").removeClass("hidden");
            $("#clear-queue-btn").addClass("hidden");
        } else {
            $("#empty-queue-msg").addClass("hidden");
            if (window.is_custom_queue) {
                $("#clear-queue-btn").removeClass("hidden");
            } else {
                $("#clear-queue-btn").addClass("hidden");
            }
            window.queue_songs.forEach((song, index) => {
                const coverArt = song.CoverArt 
                    ? `<img src="${song.CoverArt}" class="w-full h-full object-cover">`
                    : `<div class="w-full h-full bg-zinc-800 flex items-center justify-center"><svg class="w-4 h-4 text-zinc-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg></div>`;
                
                const queueItem = `
                    <div class="queue-item flex items-center gap-3 p-2 rounded-lg hover:bg-white/5 transition-colors cursor-pointer group" data-index="${index}" data-path="${JSON.stringify(song).replace(/"/g, '&quot;')}" draggable="true">
                        <div class="w-10 h-10 rounded shadow-md overflow-hidden flex-shrink-0 relative">
                            ${coverArt}
                            <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            </div>
                        </div>
                        <div class="flex flex-col overflow-hidden w-full">
                            <span class="text-sm font-medium text-zinc-200 truncate group-hover:text-orange-400 transition-colors">${song.Title || "Unknown Title"}</span>
                            <span class="text-xs text-zinc-500 truncate">${song.Artist || "Unknown Artist"}</span>
                        </div>
                        <button class="remove-queue-btn text-zinc-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-all p-1 focus:outline-none" title="Remove">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>
                `;
                queueBody.append(queueItem);
            });
        }
    };

    // Python -> JS
    window.song_list = function(data) {
        // Clear out any old rows
        $("#table-body").empty();

        data.forEach(song => {
            // Format the duration into MM:SS
            const durationSecs = Math.floor(song.Duration || 0);
            const minutes = Math.floor(durationSecs / 60);
            const seconds = (durationSecs % 60).toString().padStart(2, '0');
            const formattedDuration = `${minutes}:${seconds}`;
            
            // Build the Cover Art image or a fallback icon
            const coverArt = song.CoverArt 
                ? `<img src="${song.CoverArt}" class="w-full h-full object-cover">`
                : `<div class="w-full h-full bg-zinc-800 flex items-center justify-center"><svg class="w-5 h-5 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg></div>`;

            const currentFile = window.current_playing_song ? window.current_playing_song.File : null;
            const thisFile = song.File;
            const isActive = currentFile && thisFile && (currentFile === thisFile);
            const activeClasses = isActive ? "bg-orange-500/10 scale-[1.02] shadow-xl relative z-10 ring-1 ring-orange-500/30" : "";
            const titleColor = isActive ? "text-orange-400" : "text-zinc-100";
            
            const visualizerHtml = isActive ? `
                <div class="flex items-end justify-center gap-[2px] w-4 h-4 ml-1 flex-shrink-0 list-visualizer transition-all duration-300 overflow-hidden">
                    <div class="visualizer-bar"></div>
                    <div class="visualizer-bar"></div>
                    <div class="visualizer-bar"></div>
                    <div class="visualizer-bar"></div>
                </div>
            ` : '';

            const songRow = `
            <div class="song-row grid grid-cols-[3fr_2fr_1fr_auto] gap-4 items-center p-3 px-4 -mx-4 rounded-xl hover:bg-white/5 transition-all duration-300 cursor-pointer group ${activeClasses}" data-path="${JSON.stringify(song).replace(/"/g, '&quot;')}">
                <div class="flex items-center gap-3 overflow-hidden">
                    ${visualizerHtml}
                    <div class="w-10 h-10 rounded-md bg-zinc-800 flex-shrink-0 overflow-hidden shadow-md cover-art-container">
                        ${coverArt}
                    </div>
                    <div class="flex flex-col overflow-hidden">
                        <div class="song-title font-medium ${titleColor} group-hover:text-orange-400 transition-colors truncate">${song.Title || "Unknown Title"}</div>
                        <div class="cursor-pointer hover:text-zinc-400 transition-colors text-sm truncate">${song.Artist || "Unknown Artist"}</div>
                    </div>
                </div>
                <div class="text-sm text-zinc-500 truncate"><span class="hover:text-zinc-400">${song.Album || "Unknown Album"}</span></div>
                <div class="text-sm text-zinc-500 font-medium text-right">${formattedDuration}</div>
                <div class="flex items-center justify-end">
                    <button class="bento-btn p-2 hover:bg-white/10 hover:cursor-pointer rounded-full transition-colors focus:outline-none" aria-label="Menu">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-zinc-400 hover:text-white" fill="currentColor" viewBox="0 0 24 24">
                            <circle cx="5" cy="5" r="1.5"/>
                            <circle cx="12" cy="5" r="1.5"/>
                            <circle cx="19" cy="5" r="1.5"/>
                            <circle cx="5" cy="12" r="1.5"/>
                            <circle cx="12" cy="12" r="1.5"/>
                            <circle cx="19" cy="12" r="1.5"/>
                            <circle cx="5" cy="19" r="1.5"/>
                            <circle cx="12" cy="19" r="1.5"/>
                            <circle cx="19" cy="19" r="1.5"/>
                        </svg>
                    </button>
                </div>
            </div>`;
            
            $("#table-body").append(songRow);
        });
    }

    $(document).ready(function(){
        window.update_queue_ui();
        
        $("#txt_search").on("keyup", function() {
            var value = $(this).val().toLowerCase();
            $("#table-body .song-row").filter(function() {
                var title = $(this).find(".song-title").text().toLowerCase();
                $(this).toggle(title.indexOf(value) > -1);
            });
        });

        // Toggle queue sidebar
        $("#toggle-queue-btn").on("click", function() {
            const sidebar = $("#queue-sidebar");
            if (sidebar.hasClass("max-w-0") || sidebar.hasClass("hidden")) {
                sidebar.removeClass("max-w-0 max-h-0 opacity-0 invisible border-transparent m-0 p-0")
                       .removeClass("hidden")
                       .addClass("max-w-full xl:max-w-xs max-h-[calc(100vh-180px)] opacity-100 visible border-white/5 mt-6 xl:mt-0 ml-0 xl:ml-6 xl:mr-8 mb-8");
            } else {
                sidebar.removeClass("max-w-full xl:max-w-xs max-h-[calc(100vh-180px)] opacity-100 visible border-white/5 mt-6 xl:mt-0 ml-0 xl:ml-6 xl:mr-8 mb-8")
                       .addClass("max-w-0 max-h-0 opacity-0 invisible border-transparent m-0 p-0");
            }
        });

        // Toggle lyrics view
        $("#toggle-lyrics-btn").on("click", function() {
            const list = $("#list");
            const lyricsView = $("#lyrics-container-view");
            if (lyricsView.hasClass("hidden")) {
                list.addClass("hidden");
                lyricsView.removeClass("hidden").addClass("flex");
                $(this).html(`<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-orange-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>`);
                if (window.current_playing_song && window.parsedLyrics.length === 0) {
                    window.fetchLyricsForCurrentSong(window.current_playing_song);
                }
            } else {
                lyricsView.addClass("hidden").removeClass("flex");
                list.removeClass("hidden");
                $(this).html(`<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-zinc-400 hover:text-orange-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>`);
            }
        });

        // Add to queue via Context Menu
        $("#bento-add-queue-btn").on("click", function(e) {
            e.stopPropagation();
            const songPath = $("#bento-context-menu").data("song-path");
            if (songPath) {
                window.is_custom_queue = true;
                window.queue_songs.push(songPath);
                window.update_queue_ui();
                
                if (window.pywebview && window.pywebview.api && window.pywebview.api.add_to_queue) {
                    window.pywebview.api.add_to_queue(songPath);
                }
                
                if (typeof Notyf !== 'undefined') {
                    const notyf = new Notyf({ position: { x: 'right', y: 'bottom' } });
                    notyf.success({ message: `Added <b>${songPath.Title}</b> to Queue`, duration: 3000 });
                }
                
                $("#bento-context-menu").addClass("hidden");
            }
        });

        // Play queue item
        $(document).on("click", ".queue-item", async function(e) {
            if ($(e.target).closest(".remove-queue-btn").length) return;
            const songData = $(this).data("path");
            if (songData) {
                const index = $(this).data("index");
                window.current_playing_song = songData;
                window.set_active_song_ui(songData);
                
                window.queue_songs.splice(0, index + 1);
                window.update_queue_ui();
                
                if (window.pywebview && window.pywebview.api && window.pywebview.api.jump_to_queue_index) {
                    await window.pywebview.api.jump_to_queue_index(index);
                }
                
                await window.play_button(songData);
            }
        });

        // Remove item from queue
        $(document).on("click", ".remove-queue-btn", function(e) {
            e.stopPropagation();
            const index = $(this).closest(".queue-item").data("index");
            window.is_custom_queue = true;
            window.queue_songs.splice(index, 1);
            window.update_queue_ui();
            
            if (window.pywebview && window.pywebview.api && window.pywebview.api.remove_from_queue) {
                window.pywebview.api.remove_from_queue(index);
            }
        });

        // Clear queue
        $("#clear-queue-btn").on("click", function() {
            window.is_custom_queue = false;
            window.queue_songs = [];
            window.update_queue_ui();
            if (window.pywebview && window.pywebview.api && window.pywebview.api.clear_queue) {
                window.pywebview.api.clear_queue();
            }
        });
        
        // Hide context menu when clicking outside
        $(document).on("click", function(e) {
            if (!$(e.target).closest("#bento-context-menu").length && !$(e.target).closest(".bento-btn").length) {
                $("#bento-context-menu").addClass("hidden");
            }
        });

        // Show context menu and position it dynamically
        $(document).on("click", ".bento-btn", function(e) {
            e.stopPropagation();
            const songPath = $(this).closest(".song-row").data("path");
            const menu = $("#bento-context-menu");
            
            // Store target song in the menu's data for later reference
            menu.data("song-path", songPath);

            // Use viewport-relative positioning since the menu is `fixed`
            const buttonRect = this.getBoundingClientRect();
            menu.removeClass("hidden").css({
                top: buttonRect.bottom + 5,
                left: buttonRect.right - menu.outerWidth()
            });
        });

        // Handle Play click from context menu
        $("#bento-play-btn").on("click", async function(e) {
            e.stopPropagation();
            const songPath = $("#bento-context-menu").data("song-path");
            if (songPath) {
                window.current_playing_song = songPath;
                window.set_active_song_ui(songPath);
                
                // Auto-populate the queue
                if (window.pywebview && window.pywebview.api && window.pywebview.api.populate_queue) {
                    await window.pywebview.api.populate_queue(songPath);
                }
                
                await window.play_button(songPath);
                $("#bento-context-menu").addClass("hidden");
            }
        });

        $("#bento-edit-btn").on("click", async function(e) {
            e.stopPropagation();
            const songPath = $("#bento-context-menu").data("song-path");
            
            window.openEditModal(songPath);
            
            $("#bento-context-menu").addClass("hidden");

        });


        // Handle Delete click from context menu (Placeholder)
        $("#bento-delete-btn").on("click", function(e) {
            e.stopPropagation();

            const songPath = $("#bento-context-menu").data("song-path");
            $("#bento-context-menu").addClass("hidden");
            


            Swal.fire({
                title: 'Are you sure?',
                text: "You are about to permanently delete this song. This cannot be undone.",
                icon: 'warning',
                iconColor: '#f97316',
                background: '#1a1a1a',
                color: '#f9fafb',
                showCancelButton: true,
                confirmButtonColor: '#f97316',
                cancelButtonColor: '#4b5563',
                confirmButtonText: 'Yes, delete it',
                cancelButtonText: 'Cancel',

                customClass: {
                    popup: 'border border-gray-700 rounded-2xl shadow-2xl',
                    confirmButton: 'font-semibold rounded-lg px-5 py-2.5',
                    cancelButton: 'font-semibold rounded-lg px-5 py-2.5'
                }

            }).then(async (result) => {

                if (result.isConfirmed) {

                    if (songPath) {
                        
                        await window.pywebview.api.delete_song(songPath);

                        // Hide the specific song row visually and remove it from the DOM
                        $('.song-row').filter(function() {
                            return $(this).data("path").File === songPath.File;
                        }).slideUp("fast", function() { $(this).remove(); });
                    }

                    Swal.fire({
                        title: 'Deleted!',
                        text: 'The song has been deleted successfully.',
                        icon: 'success',
                        iconColor: '#f97316',
                        background: '#1f2937',
                        color: '#f9fafb',
                        confirmButtonColor: '#f97316',
                        customClass: {
                        popup: 'border border-gray-700 rounded-2xl shadow-2xl',
                        confirmButton: 'font-semibold rounded-lg px-5 py-2.5'
                        }
                    });
                }
            });            
        });
        
        // --- Queue Drag and Drop Logic ---
        let draggedItemIndex = null;

        $(document).on("dragstart", ".queue-item", function(e) {
            draggedItemIndex = $(this).data("index");
            $(this).addClass("opacity-50");
            e.originalEvent.dataTransfer.effectAllowed = "move";
            e.originalEvent.dataTransfer.setData("text/plain", draggedItemIndex);
        });

        $(document).on("dragover", ".queue-item", function(e) {
            e.preventDefault();
            e.originalEvent.dataTransfer.dropEffect = "move";
            const bounding = this.getBoundingClientRect();
            const offset = bounding.y + (bounding.height / 2);
            $(".queue-item").removeClass("border-t-2 border-b-2 border-orange-500");
            if (e.originalEvent.clientY > offset) {
                $(this).addClass("border-b-2 border-orange-500");
            } else {
                $(this).addClass("border-t-2 border-orange-500");
            }
        });

        $(document).on("dragleave", ".queue-item", function(e) {
            $(this).removeClass("border-t-2 border-b-2 border-orange-500");
        });

        $(document).on("drop", ".queue-item", async function(e) {
            e.preventDefault();
            $(".queue-item").removeClass("border-t-2 border-b-2 border-orange-500 opacity-50");
            
            const targetIndex = $(this).data("index");
            if (draggedItemIndex === null || draggedItemIndex === targetIndex) return;

            const bounding = this.getBoundingClientRect();
            const offset = bounding.y + (bounding.height / 2);
            let insertIndex = targetIndex;
            
            if (e.originalEvent.clientY > offset) {
                insertIndex++;
            }
            if (draggedItemIndex < insertIndex) {
                insertIndex--;
            }

            window.is_custom_queue = true;
            const item = window.queue_songs.splice(draggedItemIndex, 1)[0];
            window.queue_songs.splice(insertIndex, 0, item);
            window.update_queue_ui();

            if (window.pywebview && window.pywebview.api && window.pywebview.api.reorder_queue) {
                await window.pywebview.api.reorder_queue(draggedItemIndex, insertIndex);
            }
            draggedItemIndex = null;
        });

        $(document).on("dragend", ".queue-item", function(e) {
            $(this).removeClass("opacity-50");
            $(".queue-item").removeClass("border-t-2 border-b-2 border-orange-500");
            draggedItemIndex = null;
        });

    });


    // Add event listener for song row clicks
    $(document).off("click", ".song-row").on("click", ".song-row", async function() {
        const songPath = $(this).data("path");
        if (songPath) {
            window.current_playing_song = songPath;
            window.set_active_song_ui(songPath);
            
            // Auto-populate the queue with the remaining songs in the list
            if (window.pywebview && window.pywebview.api && window.pywebview.api.populate_queue) {
                await window.pywebview.api.populate_queue(songPath);
            }
            
            await window.play_button(songPath);
        }
    });

    fetch('modals/edit_song.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('edit-song-modal-container').innerHTML = html;
            
            // Execute any script tags inside the fetched HTML (since innerHTML doesn't auto-run scripts)
            const scripts = document.getElementById('edit-song-modal-container').getElementsByTagName('script');
            for (let i = 0; i < scripts.length; i++) {
                window.eval(scripts[i].innerText);
            }
        }).catch(err => console.error('Failed to load modal:', err));

</script>
