    <style>
        /* Global SweetAlert2 Glass Theme */
        .swal2-popup {
            background: rgba(24, 24, 27, 0.85) !important;
            backdrop-filter: blur(24px) !important;
            -webkit-backdrop-filter: blur(24px) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 1rem !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6) !important;
            color: #f4f4f5 !important;
        }
        .swal2-title {
            color: #f4f4f5 !important;
        }
        .swal2-html-container {
            color: #a1a1aa !important;
        }
        .swal2-confirm {
            background-color: #f97316 !important;
            border-radius: 0.75rem !important;
            font-weight: 600 !important;
            padding: 0.625rem 1.25rem !important;
            box-shadow: 0 4px 6px -1px rgba(249, 115, 22, 0.3) !important;
        }
        .swal2-confirm:hover {
            background-color: #ea580c !important;
        }
        .swal2-cancel {
            background-color: rgba(255, 255, 255, 0.06) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #d4d4d8 !important;
            border-radius: 0.75rem !important;
            font-weight: 600 !important;
            padding: 0.625rem 1.25rem !important;
        }
        .swal2-cancel:hover {
            background-color: rgba(255, 255, 255, 0.12) !important;
            color: #fff !important;
        }
        .swal2-close {
            color: #71717a !important;
        }
        .swal2-close:hover {
            color: #fb923c !important;
        }
        .swal2-icon.swal2-warning {
            border-color: #f97316 !important;
            color: #f97316 !important;
        }
        .swal2-icon.swal2-success {
            border-color: #f97316 !important;
        }
        .swal2-icon.swal2-success .swal2-success-ring {
            border-color: rgba(249, 115, 22, 0.3) !important;
        }
        .swal2-icon.swal2-success [class^='swal2-success-line'] {
            background-color: #f97316 !important;
        }
        .swal2-loader {
            border-color: #f97316 transparent #f97316 transparent !important;
        }
    </style>

<body

    <!-- Custom Titlebar (frameless window drag + controls) -->
    <div id="titlebar"
        class="relative flex-shrink-0 h-10 flex items-center justify-between border-b border-white/5 bg-black/40 backdrop-blur-2xl z-50 select-none">

                <path
                    d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.5A2.25 2.25 0 0 0 2.25 9.75v4.5a2.25 2.25 0 0 0 2.25 2.25h2.44l4.5 4.5c.944.945 2.56.276 2.56-1.06V4.06ZM18.75 12c0-1.24-.51-2.35-1.34-3.14a.75.75 0 1 0-1.03 1.1c.41.38.67.92.67 1.51s-.26 1.13-.67 1.51a.75.75 0 1 0 1.03 1.1c.83-.79 1.34-1.9 1.34-3.14Zm2.25 0c0-2.32-.94-4.42-2.45-5.94a.75.75 0 1 0-1.06 1.06A6.73 6.73 0 0 1 19.5 12c0 1.91-.79 3.63-2.06 4.88a.75.75 0 1 0 1.06 1.06A8.23 8.23 0 0 0 21 12Z" />

        <div class="flex items-center h-full ml-1 border-l border-white/5">
            <button id="titlebar-minimize" title="Minimize" aria-label="Minimize" class="win-ctrl-btn">

            </button>
            <button id="titlebar-maximize" title="Maximize / Restore" aria-label="Maximize or restore" class="win-ctrl-btn">

    <!-- Window Resize Zones (frameless edges & corners) -->
    <div id="window-resize-zones" class="fixed inset-0 pointer-events-none" style="z-index:60;">
        <div class="rz" data-edge="n" style="position:absolute;top:0;left:8px;right:8px;height:5px;cursor:n-resize;pointer-events:auto;"></div>
        <div class="rz" data-edge="s" style="position:absolute;bottom:0;left:8px;right:8px;height:5px;cursor:s-resize;pointer-events:auto;"></div>
        <div class="rz" data-edge="w" style="position:absolute;left:0;top:8px;bottom:8px;width:5px;cursor:w-resize;pointer-events:auto;"></div>
        <div class="rz" data-edge="e" style="position:absolute;right:0;top:8px;bottom:8px;width:5px;cursor:e-resize;pointer-events:auto;"></div>
        <div class="rz" data-edge="nw" style="position:absolute;top:0;left:0;width:10px;height:10px;cursor:nw-resize;pointer-events:auto;"></div>
        <div class="rz" data-edge="ne" style="position:absolute;top:0;right:0;width:10px;height:10px;cursor:ne-resize;pointer-events:auto;"></div>
        <div class="rz" data-edge="sw" style="position:absolute;bottom:0;left:0;width:10px;height:10px;cursor:sw-resize;pointer-events:auto;"></div>
        <div class="rz" data-edge="se" style="position:absolute;bottom:0;right:0;width:10px;height:10px;cursor:se-resize;pointer-events:auto;"></div>
    </div>

    <style>
        /* Keep the queue sidebar clear of the custom titlebar and bottom controls */
        @media (max-width: 1279.98px) {
            #queue-sidebar { top: 40px; height: calc(100vh - 152px) !important; }
        }
        @media (min-width: 1280px) {
            #queue-sidebar { height: calc(100vh - 220px); }
        }

        /* ── KDE Plasma / Breeze-style titlebar controls ── */
        .win-ctrl-btn {
            position: relative; display: flex; align-items: center; justify-content: center;
            height: 100%; width: 44px; margin: 0 2px; border-radius: 8px;
            color: #a1a1aa; outline: none; cursor: pointer;
            transition: color .15s ease, background-color .15s ease, box-shadow .2s ease;
            -webkit-app-region: no-drag;
        }
        .win-ctrl-btn:active { filter: brightness(.65); }
        .win-ctrl-btn svg {
            transition: transform .18s cubic-bezier(.34, 1.56, .64, 1), filter .25s ease;
        }

        /* Minimize — the Breeze line, simply brightens with a soft drop shadow */
        #titlebar-minimize:hover { color: #fff; background: rgba(255, 255, 255, .06); }
        #titlebar-minimize:hover svg {
            transform: translateY(1px) scale(1.05);
            filter: drop-shadow(0 2px 4px rgba(255, 255, 255, .25));
        }

        /* Maximize — faint orange tint, soft corner hint */
        #titlebar-maximize:hover {
            color: #fdba74; background: rgba(249, 115, 22, .08);
            box-shadow: inset 0 0 0 1px rgba(249, 115, 22, .28);
        }
        #titlebar-maximize:hover svg {
            transform: scale(1.08);
            filter: drop-shadow(0 0 4px rgba(249, 115, 22, .45));
        }

        /* Close — muted red tint, gentle */
        #titlebar-close:hover {
            color: #fecaca; background: rgba(220, 38, 38, .32);
            box-shadow: inset 0 0 0 1px rgba(248, 113, 113, .28);
        }
        #titlebar-close:hover svg { transform: scale(1.06); }
    </style>

    <script>

        // ── Error bridge: forward frontend errors to hathor.log via Python ──
        // (registered first so it outlives any later failure in this script)
        window.__logToPy = function (msg) {
            try {
                const api = (window.pywebview && window.pywebview.api) ? window.pywebview.api : null;
                if (api && api.js_log) {
                    const m = String(msg).slice(0, 2000);
                    if (m.indexOf('js_log') !== -1) return; // avoid feedback loop
                    const p = api.js_log(m);
                    if (p && p.catch) p.catch(function () {});
                }
            } catch (e) { /* logging must never break the app */ }
        };
        window.addEventListener('error', function (e) {
            try {
                window.__logToPy('onerror: ' + (e.message || e.error) + ' @' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || ''));
            } catch (err) {}
        });
        window.addEventListener('unhandledrejection', function (e) {
            try {
                const r = e.reason;
                window.__logToPy('unhandledrejection: ' + ((r && (r.stack || r.message || r)) || 'unknown'));
            } catch (err) {}
        });

        // JS -> Python

        window.isSeeking = false;

        // Download progress bars - real implementations are loaded by the Download Songs view.
        window.add_progress_bar = window.add_progress_bar || function () {};
        window.update_download_progress = window.update_download_progress || function () {};
        window.remove_progress_bar = window.remove_progress_bar || function () {};

        function updateSliderProgress(slider) {
            if (!slider) return;
            const min = parseFloat(slider.min) || 0;
            const max = parseFloat(slider.max) || 100;
            const val = parseFloat(slider.value) || 0;
            const percent = max === min ? 0 : ((val - min) / (max - min)) * 100;
            slider.style.setProperty('--range-percent', `${percent}%`);
        }

        // Live volume: push to Python while the slider is still being dragged.
        // Throttled (trailing edge) so a drag doesn't flood the bridge; the
        // change event always sends the final value immediately.
        let _volLiveTimer = null;
        function scheduleLiveVolume(v) {
            if (_volLiveTimer) clearTimeout(_volLiveTimer);
            _volLiveTimer = setTimeout(async function () {
                _volLiveTimer = null;
                try {
                    if (window.pywebview && window.pywebview.api && window.pywebview.api.volume_slider) {
                        await window.pywebview.api.volume_slider(v);
                    }
                } catch (err) {}
            }, 80);
        }
        function flushLiveVolume() {
            if (_volLiveTimer) {
                clearTimeout(_volLiveTimer);
                _volLiveTimer = null;
            }
        }

        document.addEventListener("input", function (e) {
            if (e.target && (e.target.id === "volumeSlider" || e.target.id === "progressSlider")) {
                updateSliderProgress(e.target);
            }
            if (e.target && e.target.id === "volumeSlider") {
                update_volume_icon(e.target.value);
                scheduleLiveVolume(e.target.value);
            }
        });

        document.addEventListener("change", async function (e) {
            if (e.target && e.target.id === "volumeSlider") {
                flushLiveVolume();
                await window.pywebview.api.volume_slider(e.target.value);
            }
            if (e.target && e.target.id === "progressSlider") {
                window.isSeeking = true;
                try {
                    await window.pywebview.api.progress_slider_click(e.target.value);
                } catch (err) {
                    console.error(err);
                }
                setTimeout(() => {
                    window.isSeeking = false;
                }, 300);
            }
        });

        window._previousVolume = 1.0;

        window.seek_by = async function (seconds) {
            const slider = document.getElementById("progressSlider");
            if (!slider) return;
            const max = parseFloat(slider.max) || 0;
            const next = Math.min(Math.max((parseFloat(slider.value) || 0) + seconds, 0), max);
            slider.value = next;
            updateSliderProgress(slider);
            if (window.pywebview && window.pywebview.api && window.pywebview.api.progress_slider_click) {
                window.isSeeking = true;
                try {
                    await window.pywebview.api.progress_slider_click(next);
                } catch (err) {
                    console.error(err);
                }
                setTimeout(() => { window.isSeeking = false; }, 300);
            }
        };

        window.shift_volume = async function (delta) {
            const slider = document.getElementById("volumeSlider");
            if (!slider) return;
            const next = Math.min(Math.max((parseFloat(slider.value) || 0) + delta, 0), 1);
            slider.value = next;
            updateSliderProgress(slider);
            update_volume_icon(slider.value);
            const npVol = document.getElementById("np-volume");
            if (npVol) {
                npVol.value = next;
                updateSliderProgress(npVol);
            }
            if (window.pywebview && window.pywebview.api && window.pywebview.api.volume_slider) {
                await window.pywebview.api.volume_slider(slider.value);
            }
        };

        window.toggle_mute = async function() {
            const volumeSlider = document.getElementById("volumeSlider");
            if (!volumeSlider) return;
            let currentVol = parseFloat(volumeSlider.value);

            if (currentVol > 0) {
                window._previousVolume = currentVol;
                volumeSlider.value = 0;
            } else {
                volumeSlider.value = window._previousVolume > 0 ? window._previousVolume : 1.0;
            }

            updateSliderProgress(volumeSlider);
            update_volume_icon(volumeSlider.value);
            const npVol = document.getElementById("np-volume");
            if (npVol) {
                npVol.value = volumeSlider.value;
                updateSliderProgress(npVol);
            }
            if (window.pywebview && window.pywebview.api) {
                await window.pywebview.api.volume_slider(volumeSlider.value);
            }
        };

        function update_volume_icon(vol) {
            const icon = document.getElementById("volumeIcon");
            if (!icon) return;
            if (vol == 0) {
                icon.innerHTML = `<path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.5A2.25 2.25 0 0 0 2.25 9.75v4.5a2.25 2.25 0 0 0 2.25 2.25h2.44l4.5 4.5c.944.945 2.56.276 2.56-1.06V4.06ZM17.78 9.22a.75.75 0 1 0-1.06 1.06L18.44 12l-1.72 1.72a.75.75 0 1 0 1.06 1.06l1.72-1.72 1.72 1.72a.75.75 0 1 0 1.06-1.06L20.56 12l1.72-1.72a.75.75 0 1 0-1.06-1.06l-1.72 1.72-1.72-1.72Z"/>`;
            } else if (vol < 0.5) {
                icon.innerHTML = `<path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.5A2.25 2.25 0 0 0 2.25 9.75v4.5a2.25 2.25 0 0 0 2.25 2.25h2.44l4.5 4.5c.944.945 2.56.276 2.56-1.06V4.06ZM18.75 12c0-1.24-.51-2.35-1.34-3.14a.75.75 0 1 0-1.03 1.1c.41.38.67.92.67 1.51s-.26 1.13-.67 1.51a.75.75 0 1 0 1.03 1.1c.83-.79 1.34-1.9 1.34-3.14Z"/>`;
            } else {
                icon.innerHTML = `<path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.5A2.25 2.25 0 0 0 2.25 9.75v4.5a2.25 2.25 0 0 0 2.25 2.25h2.44l4.5 4.5c.944.945 2.56.276 2.56-1.06V4.06ZM18.75 12c0-1.24-.51-2.35-1.34-3.14a.75.75 0 1 0-1.03 1.1c.41.38.67.92.67 1.51s-.26 1.13-.67 1.51a.75.75 0 1 0 1.03 1.1c.83-.79 1.34-1.9 1.34-3.14Zm2.25 0c0-2.32-.94-4.42-2.45-5.94a.75.75 0 1 0-1.06 1.06A6.73 6.73 0 0 1 19.5 12c0 1.91-.79 3.63-2.06 4.88a.75.75 0 1 0 1.06 1.06A8.23 8.23 0 0 0 21 12Z"/>`;
            }
        }



        window.play_button = async function (current_song) {
            const isPlaying = await window.pywebview.api.play_button(current_song);
            update_play_button_ui(isPlaying);
        }

        window.toggle_play_pause = async function () {
            // Optimistically flip the UI so it feels completely instant
            if (window.current_playing_song) {
                update_play_button_ui(!window.is_currently_playing);
            }

            const isPlaying = await window.pywebview.api.play_button(null);

            // If no song is loaded, try to play the first song in the active list
            if (isPlaying === null) {
                // Revert the optimistic update if we didn't actually play
                if (window.current_playing_song) {
                    update_play_button_ui(!window.is_currently_playing);
                }
                const firstSong = document.querySelector(".song-row");
                if (firstSong) firstSong.click();
                return;
            }

            update_play_button_ui(isPlaying);
        }

        window.toggle_shuffle = async function () {
            const isShuffled = await window.pywebview.api.toggle_shuffle();
            const btn = document.getElementById("shuffleBtn");
            if (isShuffled) {
                btn.classList.remove("text-zinc-400", "hover:text-white");
                btn.classList.add("text-orange-500", "hover:text-orange-400", "bg-white/15");
            } else {
                btn.classList.remove("text-orange-500", "hover:text-orange-400", "bg-white/15");
                btn.classList.add("text-zinc-400", "hover:text-white");
            }
        }

        window.toggle_repeat = async function () {
            const isRepeating = await window.pywebview.api.toggle_repeat();
            const btn = document.getElementById("repeatBtn");
            if (isRepeating) {

            const winCtrlClose = document.getElementById("titlebar-close");
            const resizeZones = document.querySelectorAll("#window-resize-zones .rz");
            const WIN_MIN_W = 895;
            const WIN_MIN_H = 400;

            function winApi() {
                return (window.pywebview && window.pywebview.api) ? window.pywebview.api : null;
            }

            // Cached window frame (physical px) so gestures always start from a known baseline
            const winFrame = { x: 0, y: 0, w: 0, h: 0, known: false };
            async function refreshWinFrame() {
                const api = winApi();
                if (api && api.get_window_geometry) {
                    try {
                        const g = await api.get_window_geometry();
                        if (g && g.width && g.height) {
                            winFrame.x = g.x;
                            winFrame.y = g.y;
                            winFrame.w = g.width;
                            winFrame.h = g.height;
                            winFrame.known = true;
                        }
                    } catch (err) {
                        console.error("window geometry fetch failed:", err);
                    }
                }
                return winFrame.known;
            }
            function physScale() {
                return window.devicePixelRatio || 1;
            }

            if (titlebar) {
                // Drag the window by grabbing the titlebar
                let drag = null;
                titlebar.addEventListener('pointerdown', async function (e) {
                    if (e.target.closest('.win-ctrl-btn')) return;
                    e.preventDefault();
                    await refreshWinFrame();
                    if (!winFrame.known) return;
                    const s = physScale();
                    drag = { sx: e.screenX * s, sy: e.screenY * s, bx: winFrame.x, by: winFrame.y };
                    try { titlebar.setPointerCapture(e.pointerId); } catch (err) { }
                });
                titlebar.addEventListener('pointermove', async function (e) {
                    const api = winApi();
                    if (!drag || !api || !api.move_window) return;
                    const s = physScale();
                    const nx = Math.round(drag.bx + (e.screenX * s - drag.sx));
                    const ny = Math.round(drag.by + (e.screenY * s - drag.sy));
                    try {
                        await api.move_window(nx, ny);
                        winFrame.x = nx;
                        winFrame.y = ny;
                    } catch (err) { }
                });
                titlebar.addEventListener('pointerup', function () { drag = null; });
                titlebar.addEventListener('pointercancel', function () { drag = null; });

                // Double-click toggles maximize/restore
                titlebar.addEventListener('dblclick', function (e) {

            // Resize the frameless window from its edges and corners
            let resize = null;
            // The top edge/corners overlap the titlebar buttons (zones sit at
            // z-60 above the titlebar). A press starting on a button must not
            // start a resize with pointer capture, or the button's click is lost.
            function isOverWinBtn(x, y) {
                const btns = document.querySelectorAll('.win-ctrl-btn');
                for (const b of btns) {
                    const r = b.getBoundingClientRect();
                    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return true;
                }
                return false;
            }
            resizeZones.forEach(function (zone) {
                zone.addEventListener('pointerdown', async function (e) {
                    if (resize) return;
                    if (isOverWinBtn(e.clientX, e.clientY)) return;
                    e.preventDefault();
                    e.stopPropagation();
                    await refreshWinFrame();
                    if (!winFrame.known) return;
                    const s = physScale();
                    resize = {
                        edge: zone.getAttribute('data-edge'),
                        sx: e.screenX * s,
                        sy: e.screenY * s,
                        bx: winFrame.x,
                        by: winFrame.y,
                        bw: winFrame.w,
                        bh: winFrame.h,
                        minW: Math.round(WIN_MIN_W * s),
                        minH: Math.round(WIN_MIN_H * s)
                    };
                    try { zone.setPointerCapture(e.pointerId); } catch (err) { }
                });
            });
            document.addEventListener('pointermove', async function (e) {
                const api = winApi();
                if (!resize || !api || !api.resize_window) return;
                const s = physScale();
                const dx = e.screenX * s - resize.sx;
                const dy = e.screenY * s - resize.sy;
                const edge = resize.edge;
                let nx = resize.bx, ny = resize.by, nw = resize.bw, nh = resize.bh;
                if (edge.indexOf('e') > -1) nw = Math.max(resize.bw + dx, resize.minW);
                if (edge.indexOf('s') > -1) nh = Math.max(resize.bh + dy, resize.minH);
                if (edge.indexOf('w') > -1) {
                    const target = resize.bw - dx;
                    nw = Math.max(target, resize.minW);
                    nx = target >= resize.minW ? resize.bx + dx : resize.bx + (resize.bw - resize.minW);
                }
                if (edge.indexOf('n') > -1) {
                    const target = resize.bh - dy;
                    nh = Math.max(target, resize.minH);
                    ny = target >= resize.minH ? resize.by + dy : resize.by + (resize.bh - resize.minH);
                }
                nx = Math.round(nx); ny = Math.round(ny); nw = Math.round(nw); nh = Math.round(nh);
                try {
                    await api.resize_window(nw, nh, nx, ny);
                    winFrame.x = nx; winFrame.y = ny; winFrame.w = nw; winFrame.h = nh;
                } catch (err) { }
            });
            document.addEventListener('pointerup', function () { resize = null; });
            document.addEventListener('pointercancel', function () { resize = null; });

                btn.className = 'w-full text-left bg-white/5 hover:bg-white/10 rounded-xl p-3 px-4 transition-all duration-300 cursor-pointer';

                const title = document.createElement('div');
                title.className = 'font-bold text-zinc-100 text-sm md:text-base';
                title.innerText = s.trackName || 'Unknown track';

                const sub = document.createElement('div');
                sub.className = 'text-zinc-400 text-xs md:text-sm';
                sub.innerText = [s.artistName, s.albumName].filter(Boolean).join(' \u2014 ');

                btn.appendChild(title);
                btn.appendChild(sub);
                btn.addEventListener('click', async () => {
                    await window.pywebview.api.save_lyrics(s.syncedLyrics || null, s.plainLyrics || null);
                    window.fetchLyricsForCurrentSong(window.current_playing_song);
                });

                list.appendChild(btn);
            });

            container.appendChild(list);
        };

        window.fetchLyricsForCurrentSong = async function (songData) {
            const container = document.getElementById('lyrics-container');
            if (!container) return;

            songData = songData || window.current_playing_song;
            if (!songData) return;

            window.lyricsFetchId = (window.lyricsFetchId || 0) + 1;
            const currentFetchId = window.lyricsFetchId;

            container.innerHTML = `<p class="text-zinc-500 text-2xl md:text-4xl font-semibold animate-pulse">Loading lyrics for ${songData.Title}...</p>`;
            window.parsedLyrics = [];

            try {
                const lyricsData = await window.pywebview.api.get_lyrics(
                    songData.Title,
                    songData.Artist,
                    songData.Album,
                    songData.Duration
                );

                if (window.lyricsFetchId !== currentFetchId) {
                    return; // Another fetch has started, ignore these results
                }

                if (lyricsData && lyricsData.synced) {
                    window.parsedLyrics = window.parseLRC(lyricsData.synced);
                    window.renderLyrics();
                } else if (lyricsData && lyricsData.plain) {
                    container.innerHTML = `<div class="text-zinc-300 text-md md:text-xl lg:text-2xl font-bold whitespace-pre-line leading-relaxed md:leading-loose pt-8 pb-16">${lyricsData.plain}</div>`;
                } else {
                    container.innerHTML = '<p class="text-zinc-500 text-2xl md:text-4xl font-semibold">No exact lyrics found.</p><p class="text-zinc-400 text-xl md:text-2xl mt-2 animate-pulse">Searching for alternatives...</p>';
                    try {
                        const suggestions = await window.pywebview.api.search_lyrics(
                            songData.Title,
                            songData.Artist,
                            songData.Album,
                            songData.Duration
                        );
                        if (window.lyricsFetchId !== currentFetchId) {
                            return;
                        }
                        if (suggestions && suggestions.length) {
                            window.renderLyricsSuggestions(container, suggestions);
                        } else {
                            container.innerHTML = '<p class="text-zinc-500 text-2xl md:text-4xl font-semibold">No lyrics found for this song.</p>';
                        }
                    } catch (err) {
                        if (window.lyricsFetchId !== currentFetchId) {
                            return;
                        }
                        container.innerHTML = '<p class="text-zinc-500 text-2xl md:text-4xl font-semibold">No lyrics found for this song.</p>';
                    }
                }
            } catch (error) {
                container.innerHTML = '<p class="text-red-400 text-2xl md:text-4xl font-semibold">Failed to load lyrics.</p>';
            }
        };

        window.update_queue_ui = function () {
            const queueBody = document.getElementById("queue-body");
            if (!queueBody) return;

            document.querySelectorAll("#queue-body .queue-item, #queue-body .queue-item-container").forEach(el => el.remove());

            const emptyMsg = document.getElementById("empty-queue-msg");
            const clearBtn = document.getElementById("clear-queue-btn");

            if (window.queue_songs.length === 0) {
                if (emptyMsg) emptyMsg.classList.remove("hidden");
                if (clearBtn) clearBtn.classList.add("hidden");
            } else {
                if (emptyMsg) emptyMsg.classList.add("hidden");
                if (window.is_custom_queue) {
                    if (clearBtn) clearBtn.classList.remove("hidden");
                } else {
                    if (clearBtn) clearBtn.classList.add("hidden");
                }
                let queueHtmlBuffer = "";
                window.queue_songs.forEach((song, index) => {
                    queueHtmlBuffer += `<div class="queue-item-container" style="min-height: 56px;" data-index="${index}" data-path='${JSON.stringify(song).replace(/'/g, '&apos;')}' draggable="true"></div>`;
                });
                queueBody.insertAdjacentHTML('beforeend', queueHtmlBuffer);
            }

            document.querySelectorAll("#queue-body .queue-item-container").forEach(el => {
                if (window.lazyQueueObserver) window.lazyQueueObserver.observe(el);
            });
        };

        document.addEventListener("DOMContentLoaded", function () {
            window.update_queue_ui();
        });

        // --- Global Click Event Delegation ---
        document.addEventListener("click", async function (e) {
            // Toggle playlists submenu
            if (e.target.closest("#toggle-playlists-submenu")) {
                e.preventDefault();

                } else {
                    sidebar.classList.remove("max-w-full", "xl:max-w-xs", "xl:max-h-[calc(100vh-180px)]", "opacity-100", "visible", "xl:mr-8", "translate-x-0");
                    sidebar.classList.add("max-w-0", "xl:max-h-0", "opacity-0", "invisible", "translate-x-full", "xl:translate-x-0");
                }
            }

            // Toggle lyrics view
            const toggleLyricsBtn = e.target.closest("#toggle-lyrics-btn");
            if (toggleLyricsBtn) {
                const lyricsView = document.getElementById("lyrics-container-view");
                if (lyricsView.classList.contains("hidden")) {
                    lyricsView.classList.remove("hidden");
                    lyricsView.classList.add("flex");
                    document.body.classList.add("lyrics-active");
                    toggleLyricsBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-orange-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>`;
                    toggleLyricsBtn.classList.remove("text-zinc-400", "hover:text-white");
                    toggleLyricsBtn.classList.add("text-orange-500", "hover:text-orange-400");
                    if (window.current_playing_song && window.parsedLyrics.length === 0) {
                        window.fetchLyricsForCurrentSong(window.current_playing_song);
                    }
                } else {
                    lyricsView.classList.add("hidden");
                    lyricsView.classList.remove("flex");
                    document.body.classList.remove("lyrics-active");
                    toggleLyricsBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>`;
                    toggleLyricsBtn.classList.remove("text-orange-500", "hover:text-orange-400");
                    toggleLyricsBtn.classList.add("text-zinc-400", "hover:text-white");
                }
            }

            // Play queue item
            const queueItem = e.target.closest(".queue-item");
            if (queueItem) {
                if (e.target.closest(".remove-queue-btn")) return;
                const container = queueItem.closest(".queue-item-container");
                const songDataStr = container.getAttribute("data-path");
                if (!songDataStr) return;
                const songData = JSON.parse(songDataStr.replace(/&apos;/g, "'"));
                if (songData) {
                    const index = parseInt(container.getAttribute("data-index"));
                    window.current_playing_song = songData;
                    if (window.set_active_song_ui) window.set_active_song_ui(songData);

                    window.queue_songs.splice(0, index + 1);
                    window.update_queue_ui();

                    if (window.pywebview && window.pywebview.api && window.pywebview.api.jump_to_queue_index) {
                        await window.pywebview.api.jump_to_queue_index(index);
                    }

                    await window.play_button(songData);
                }
            }

            // Remove item from queue
            const removeQueueBtn = e.target.closest(".remove-queue-btn");
            if (removeQueueBtn) {
                e.stopPropagation();
                const container = removeQueueBtn.closest(".queue-item-container");
                const index = parseInt(container.getAttribute("data-index"));
                window.is_custom_queue = true;
                window.queue_songs.splice(index, 1);
                window.update_queue_ui();

                if (window.pywebview && window.pywebview.api && window.pywebview.api.remove_from_queue) {
                    window.pywebview.api.remove_from_queue(index);
                }
            }

            // Clear queue
            if (e.target.closest("#clear-queue-btn")) {
                window.is_custom_queue = false;
                window.queue_songs = [];
                window.update_queue_ui();
                if (window.pywebview && window.pywebview.api && window.pywebview.api.clear_queue) {
                    window.pywebview.api.clear_queue();
                }

        // --- Queue Drag and Drop Logic ---
        let draggedItemIndex = null;

        document.addEventListener("dragstart", function (e) {
            const container = e.target.closest(".queue-item-container");
            if (container) {
                draggedItemIndex = parseInt(container.getAttribute("data-index"));
                container.classList.add("opacity-50");
                e.dataTransfer.effectAllowed = "move";
                e.dataTransfer.setData("text/plain", draggedItemIndex);
            }
        });

        document.addEventListener("dragover", function (e) {
            const container = e.target.closest(".queue-item-container");
            if (container) {
                e.preventDefault();
                e.dataTransfer.dropEffect = "move";
                const bounding = container.getBoundingClientRect();
                const offset = bounding.y + (bounding.height / 2);
                document.querySelectorAll(".queue-item-container").forEach(el => el.classList.remove("border-t-2", "border-b-2", "border-orange-500"));
                if (e.clientY > offset) {
                    container.classList.add("border-b-2", "border-orange-500");
                } else {
                    container.classList.add("border-t-2", "border-orange-500");
                }
            }
        });

        document.addEventListener("dragleave", function (e) {
            const container = e.target.closest(".queue-item-container");
            if (container) {
                container.classList.remove("border-t-2", "border-b-2", "border-orange-500");
            }
        });

        document.addEventListener("drop", async function (e) {
            const container = e.target.closest(".queue-item-container");
            if (container) {
                e.preventDefault();
                document.querySelectorAll(".queue-item-container").forEach(el => el.classList.remove("border-t-2", "border-b-2", "border-orange-500", "opacity-50"));

                const targetIndex = parseInt(container.getAttribute("data-index"));
                if (draggedItemIndex === null || draggedItemIndex === targetIndex) return;

                const bounding = container.getBoundingClientRect();
                const offset = bounding.y + (bounding.height / 2);
                let insertIndex = targetIndex;

                if (e.clientY > offset) {
                    insertIndex++;
                }
                if (draggedItemIndex < insertIndex) {
                    insertIndex--;
                }

                window.is_custom_queue = true;
                const item = window.queue_songs.splice(draggedItemIndex, 1)[0];
                window.queue_songs.splice(insertIndex, 0, item);
                window.update_queue_ui();

                if (window.pywebview && window.pywebview.api && window.pywebview.api.reorder_queue) {
                    await window.pywebview.api.reorder_queue(draggedItemIndex, insertIndex);
                }
                draggedItemIndex = null;
            }
        });

        document.addEventListener("dragend", function (e) {
            const container = e.target.closest(".queue-item-container");
            if (container) {
                container.classList.remove("opacity-50");
            }
            document.querySelectorAll(".queue-item-container").forEach(el => el.classList.remove("border-t-2", "border-b-2", "border-orange-500"));
            draggedItemIndex = null;
        });

        // --- Global Song Row & Bento Context Menu Logic ---
        let contextMenuDataPath = null;

            }

            const albumLink = e.target.closest(".album-link");
            if (albumLink) {

            if (e.target.closest("#bento-next-to-queue-btn")) {

            } else if (e.target.closest("#bento-add-queue-btn")) {

                                    <div class="w-14 h-14 rounded-md overflow-hidden flex-shrink-0 bg-zinc-800 shadow-md">
                                        ${r.artwork_thumb ? `<img src="${r.artwork_thumb}" class="w-full h-full object-cover" onerror="this.style.display='none'">` : `<div class="w-full h-full flex items-center justify-center"><svg class="w-6 h-6 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg></div>`}

                            const swalResult = await Swal.fire({

                                    }, 200);
                                }
                                if (typeof Notyf !== 'undefined') {
                                    const notyf = new Notyf({ position: { x: 'right', y: 'bottom' } });
                                    notyf.success('Metadata selected! Review and save changes.');

                                let cData = container._songData;
                                if (!cData) {
                                    const raw = container.getAttribute("data-path");
                                    if (raw) {
                                        try { cData = JSON.parse(raw.replace(/&quot;/g, '"')); } catch (e) { }
                                    }
                                }
                                if (cData && cData.File === songPath.File) {
                                    container.style.transition = 'height 0.2s, opacity 0.2s';
                                    container.style.height = container.offsetHeight + 'px';
                                    container.style.opacity = '0';
                                    setTimeout(() => {
                                        container.style.height = '0px';
                                        setTimeout(() => container.remove(), 200);
                                    }, 10);
                                }
                            });

                            Swal.fire({
                                title: 'Deleted!',
                                text: 'The song has been deleted successfully.',
                                icon: 'success'
                            });
                        }
                    });
                }
            } else if (e.target.closest(".bento-btn")) {
                e.stopPropagation();
                const btn = e.target.closest(".bento-btn");
                const row = btn.closest(".song-row");
                const songPathStr = row.getAttribute("data-path");
                if (songPathStr) {
                    try {
                        contextMenuDataPath = JSON.parse(songPathStr.replace(/&quot;/g, '"'));
                    } catch (err) { console.error("Failed to parse row song data"); }
                }

                const buttonRect = btn.getBoundingClientRect();
                contextMenu.classList.remove("hidden");
                contextMenu.style.top = (buttonRect.bottom + 5) + "px";
                contextMenu.style.left = (buttonRect.right - contextMenu.offsetWidth) + "px";
            } else if (e.target.closest(".song-row")) {
                const row = e.target.closest(".song-row");
                if (!e.target.closest(".bento-btn")) {
                    // Prefer the cached song object (index-based rows) over the
                    // data-path attribute, whose &quot; encoding breaks on titles
                    // containing HTML-entity-like sequences (e.g. "&quot;").
                    let songPath = null;
                    try {
                        const container = row.closest(".song-row-container, .queue-item-container");
                        if (container && container._songData) {
                            songPath = container._songData;
                        } else if (typeof window.songDataFromRow === 'function') {
                            songPath = window.songDataFromRow(row);
                        }
                    } catch (err) { console.error("Song cache lookup failed:", err); }
                    const songPathStr = songPath ? null : row.getAttribute("data-path");
                    if (songPath || songPathStr) {
                        try {
                            if (!songPath) {
                                songPath = JSON.parse(songPathStr.replace(/&quot;/g, '"').replace(/&apos;/g, "'"));
                            }
                            window.current_playing_song = songPath;
                            window.set_active_song_ui(songPath);

                            // Use playlist queue if we're in a playlist view with loaded songs
                            if (window.currentPlaylistSongs && window.currentPlaylistSongs.length > 0) {
                                if (window.pywebview && window.pywebview.api && window.pywebview.api.populate_queue_from_list) {
                                    const playlistId = window.currentPlaylist ? (window.currentPlaylist.id || window.currentPlaylist.Id) : null;
                                    await window.pywebview.api.populate_queue_from_list(songPath, window.currentPlaylistSongs, playlistId);
                                }
                            } else {
                                const homeSongs = typeof window.get_current_home_view_songs === 'function' ? window.get_current_home_view_songs() : null;
                                if (homeSongs && homeSongs.length > 0) {
                                    if (window.pywebview && window.pywebview.api && window.pywebview.api.populate_queue_from_list) {
                                        await window.pywebview.api.populate_queue_from_list(songPath, homeSongs, null);
                                    }
                                } else if (window.pywebview && window.pywebview.api && window.pywebview.api.populate_queue) {
                                    await window.pywebview.api.populate_queue(songPath);
                                }
                            }
                            await window.play_button(songPath);
                        } catch (err) {
                            console.error("Failed to play song row:", err);
                            if (typeof window.__logToPy === 'function') {
                                window.__logToPy('song-row click failed: ' + ((err && (err.stack || err.message)) || err));
                            }
                            if (typeof Notyf !== 'undefined') {
                                new Notyf({ position: { x: 'right', y: 'bottom' } }).error('Could not play this song.');
                            }
                        }
                    } else {
                        console.error("Song row has no playable data attached.");
                    }
                }
                if (contextMenu && !contextMenu.classList.contains("hidden")) {
                    contextMenu.classList.add("hidden");
                }
            } else {
                if (contextMenu && !contextMenu.classList.contains("hidden")) {
                    contextMenu.classList.add("hidden");
                }
            }
        });

        // --- Global Keyboard Shortcuts ---
        document.addEventListener("keydown", async function (e) {
            if (e.ctrlKey || e.metaKey || e.altKey) return;

            const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
            if (tag === "input" || tag === "textarea" || tag === "select") return;
            if (e.target && e.target.isContentEditable) return;

            switch (e.code) {
                case "Space":
                    e.preventDefault();
                    if (e.target && e.target.closest && e.target.closest("button")) return;
                    if (window.toggle_play_pause) await window.toggle_play_pause();
                    break;
                case "ArrowLeft":
                    e.preventDefault();
                    if (window.seek_by) await window.seek_by(-10);
                    break;
                case "ArrowRight":
                    e.preventDefault();
                    if (window.seek_by) await window.seek_by(10);
                    break;
                case "ArrowUp":
                    e.preventDefault();
                    if (window.shift_volume) await window.shift_volume(0.05);
                    break;
                case "ArrowDown":
                    e.preventDefault();
                    if (window.shift_volume) await window.shift_volume(-0.05);
                    break;
                case "MediaTrackNext":
                    e.preventDefault();
                    if (window.pywebview && window.pywebview.api && window.pywebview.api.play_next) {
                        await window.pywebview.api.play_next();
                    }
                    break;
                case "MediaTrackPrevious":
                    e.preventDefault();
                    if (window.pywebview && window.pywebview.api && window.pywebview.api.play_prev) {
                        await window.pywebview.api.play_prev();
                    }
                    break;
                case "MediaPlayPause":
                    e.preventDefault();
                    if (window.toggle_play_pause) await window.toggle_play_pause();
                    break;
            }
        });

        // Best-effort Media Session integration
        if (navigator.mediaSession && navigator.mediaSession.setActionHandler) {
            const mediaAction = (action) => async () => {
                if (action === "play" || action === "pause") {
                    if (window.toggle_play_pause) await window.toggle_play_pause();
                } else if (action === "previoustrack") {
                    if (window.pywebview && window.pywebview.api && window.pywebview.api.play_prev) {
                        await window.pywebview.api.play_prev();
                    }
                } else if (action === "nexttrack") {
                    if (window.pywebview && window.pywebview.api && window.pywebview.api.play_next) {
                        await window.pywebview.api.play_next();
                    }
                }
            };
            ["play", "pause", "previoustrack", "nexttrack"].forEach((action) => {
                try { navigator.mediaSession.setActionHandler(action, mediaAction(action)); } catch (err) {}
            });
        }

    </script>

    <div id="startup-toast" role="status" aria-live="polite">

            </div>

                <span id="st-dot-libs" class="st-dot"></span>
                <span id="st-label-libs" class="text-xs text-zinc-400 truncate flex-1">Libraries: waiting…</span>
            </div>

            <button id="st-retry" class="hidden text-[11px] font-semibold text-orange-400 hover:text-orange-300 border border-orange-500/30 hover:border-orange-400/60 bg-orange-500/10 hover:bg-orange-500/20 rounded-lg px-2.5 py-1 transition-all focus:outline-none">Retry</button>
        </div>
    </div>
    <script>
        window.startupToast = (function () {
            var hideTimer = null;
            var el = null, bar = null, titleEl = null, detailEl = null, retryBtn = null, hintEl = null;

            function refs() {
                if (el) return true;
                el = document.getElementById('startup-toast');
                if (!el) return false;
                bar = document.getElementById('st-bar');
                titleEl = document.getElementById('st-title');
                detailEl = document.getElementById('st-detail');
                retryBtn = document.getElementById('st-retry');
                hintEl = document.getElementById('st-hint');
                var closeBtn = document.getElementById('st-close');
                if (closeBtn && !closeBtn._stBound) {
                    closeBtn._stBound = true;
                    closeBtn.addEventListener('click', hide);
                }
                if (retryBtn && !retryBtn._stBound) {
                    retryBtn._stBound = true;
                    retryBtn.addEventListener('click', function () {
                        retryBtn.classList.add('hidden');
                        show('Checking for updates…');
                        if (window.pywebview && window.pywebview.api && window.pywebview.api.run_startup_maintenance) {
                            window.pywebview.api.run_startup_maintenance().then(function (summary) {
                                if (summary) complete(summary);
                            }).catch(function () {
                                update({ stage: 'done', label: 'Retry failed', percent: 100, detail: '', status: 'error' });
                            });
                        }
                    });
                }
                return true;
            }

            function setRow(stage, label, status) {
                var dot = document.getElementById(stage === 'ffmpeg' ? 'st-dot-ffmpeg' : 'st-dot-libs');
                var lab = document.getElementById(stage === 'ffmpeg' ? 'st-label-ffmpeg' : 'st-label-libs');
                if (!dot || !lab) return;
                dot.className = 'st-dot' + (status ? ' st-' + status : '');
                var prefix = stage === 'ffmpeg' ? 'FFmpeg: ' : 'Libraries: ';
                lab.textContent = prefix + (label || '');
                lab.title = label || '';
            }

            function setBar(percent) {
                if (!bar) return;
                bar.classList.remove('st-indeterminate');
                if (percent === null || percent === undefined) {
                    bar.classList.add('st-indeterminate');
                } else {
                    bar.style.width = Math.max(0, Math.min(100, percent)) + '%';
                }
            }

            function show(title) {
                if (!refs()) return;
                if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
                if (retryBtn) retryBtn.classList.add('hidden');
                if (titleEl && title) titleEl.textContent = title;
                setRow('ffmpeg', 'checking…', 'working');
                setRow('libs', 'waiting…', '');
                if (detailEl) detailEl.textContent = '';
                setBar(2);
                el.classList.add('st-visible');
            }

            function update(ev) {
                if (!refs() || !ev) return;
                el.classList.add('st-visible');
                if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
                var stage = ev.stage || '', label = ev.label || '', detail = ev.detail || '';
                var status = ev.status === 'up-to-date' ? 'done' : (ev.status || 'working');
                if (stage === 'ffmpeg') {
                    setRow('ffmpeg', label.replace(/^FFmpeg:\s*/i, ''), status);
                    if (ev.percent !== null && ev.percent !== undefined) setBar(ev.percent * 0.5);
                    else setBar(null);
                } else if (stage === 'libs') {
                    setRow('libs', label.replace(/^Libraries:\s*/i, ''), status);
                    if (ev.percent !== null && ev.percent !== undefined) setBar(50 + ev.percent * 0.5);
                    else setBar(null);
                } else if (stage === 'done') {
                    if (titleEl) titleEl.textContent = label || 'Startup check finished';
                    setBar(ev.percent !== null && ev.percent !== undefined ? ev.percent : 100);
                }
                if (detailEl) {
                    detailEl.textContent = detail;
                    detailEl.title = detail;
                }
                if (status === 'error' && retryBtn) retryBtn.classList.remove('hidden');
            }

            function complete(summary) {
                if (!refs() || !summary) { hide(); return; }
                var ff = summary.ffmpeg || {};
                var libs = summary.libraries || [];
                var ffOk = ff.status === 'ok';
                setRow('ffmpeg',
                    ffOk ? ('ready' + (ff.downloaded ? ' — just installed' : '')) : ('issue: ' + (ff.error || 'missing').toString().slice(0, 60)),
                    ffOk ? 'done' : 'error');
                var badLibs = libs.filter(function (r) { return r.status === 'error' || r.status === 'missing'; });
                var updated = libs.filter(function (r) { return r.status === 'updated' || r.status === 'installed'; });
                if (libs.length === 0) {
                    setRow('libs', 'could not reach update server', 'skipped');
                } else if (badLibs.length > 0) {
                    setRow('libs', badLibs.length + ' failed — app still works', 'error');
                } else if (updated.length > 0) {
                    setRow('libs', updated.map(function (r) { return r.package + ' → ' + r.current; }).join(', ').slice(0, 60), 'done');
                } else {
                    setRow('libs', 'all up to date', 'done');
                }
                setBar(100);
                if (detailEl) detailEl.textContent = '';
                if (titleEl) titleEl.textContent = summary.all_ok ? 'All set — up to date' : 'Startup check finished';

                var hasError = !ffOk || badLibs.length > 0;
                if (retryBtn) retryBtn.classList.toggle('hidden', !hasError);
                if (hintEl) hintEl.textContent = hasError ? 'Downloads may fail without FFmpeg' : 'Runs once at startup';
                if (hideTimer) clearTimeout(hideTimer);
                hideTimer = setTimeout(hide, hasError ? 12000 : (summary.all_ok ? 4500 : 7000));
            }

            function hide() {
                if (!refs()) return;
                if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
                el.classList.remove('st-visible');
            }

            return { show: show, update: update, complete: complete, hide: hide };
        })();
    </script>

                    <div class="flex items-center gap-2 text-[11px] font-semibold uppercase tracking-[0.25em] text-orange-400/90">
                        <span class="w-6 h-px bg-orange-400/60 inline-block"></span>
                        Now Playing
                    </div>
                    <h1 id="np-title" class="mt-3 text-3xl sm:text-4xl lg:text-5xl font-extrabold text-white leading-tight tracking-tight line-clamp-2">Nothing playing</h1>
                    <div id="np-artist" class="mt-2 text-base sm:text-lg text-zinc-400 font-medium truncate max-w-full cursor-pointer hover:text-orange-400 transition-colors">—</div>
                    <div id="np-album" class="mt-1 text-sm text-zinc-500 truncate max-w-full">—</div>

                    <!-- Progress -->
                    <div class="w-full mt-8 flex items-center gap-3">
                        <span id="np-current-time" class="text-xs text-zinc-400 font-mono w-10 text-right flex-shrink-0">0:00</span>
                        <input type="range" id="np-progress" min="0" step="0.1" value="0" class="w-full cursor-pointer outline-none">
                        <span id="np-total-time" class="text-xs text-zinc-400 font-mono w-10 flex-shrink-0">0:00</span>
                    </div>

                    <!-- Controls -->
                    <div class="w-full mt-4 flex items-center justify-center md:justify-start gap-4 sm:gap-6">
                        <button id="np-shuffle-btn" title="Toggle Shuffle" class="text-zinc-400 hover:text-white transition-all duration-200 hover:scale-110 active:scale-95 p-2.5 rounded-full hover:bg-white/10 focus:outline-none cursor-pointer">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path fill-rule="evenodd" d="M12.53 16.28a.75.75 0 0 1-1.06 0l-7.5-7.5a.75.75 0 0 1 1.06-1.06L12 14.69l6.97-6.97a.75.75 0 1 1 1.06 1.06l-7.5 7.5Z" clip-rule="evenodd" /><path fill-rule="evenodd" d="M11.47 7.72a.75.75 0 0 1 1.06 0l7.5 7.5a.75.75 0 1 1-1.06 1.06L12 9.31l-6.97 6.97a.75.75 0 0 1-1.06-1.06l7.5-7.5Z" clip-rule="evenodd" /></svg>
                        </button>
                        <button id="np-prev-btn" title="Previous" class="text-zinc-200 hover:text-white transition-all duration-200 hover:scale-110 active:scale-95 p-2.5 rounded-full hover:bg-white/10 focus:outline-none cursor-pointer">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8"><path fill-rule="evenodd" d="M21 16.811c0 .864-.933 1.406-1.683.977l-7.108-4.061a1.125 1.125 0 0 1 0-1.954l7.108-4.061A1.125 1.125 0 0 1 21 8.689v8.122ZM11.25 16.811c0 .864-.933 1.406-1.683.977l-7.108-4.061a1.125 1.125 0 0 1 0-1.954l7.108-4.061a1.125 1.125 0 0 1 1.683.977v8.122Z" clip-rule="evenodd" /></svg>
                        </button>
                        <button id="np-play-btn" title="Play / Pause" class="flex items-center justify-center w-16 h-16 bg-white text-zinc-950 hover:bg-orange-400 hover:text-white transition-all duration-200 hover:scale-105 active:scale-95 rounded-full shadow-[0_0_30px_rgba(255,255,255,0.15)] hover:shadow-[0_0_35px_rgba(251,146,60,0.5)] focus:outline-none cursor-pointer">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8 ml-1"><path fill-rule="evenodd" d="M4.5 5.653c0-1.427 1.529-2.38 2.831-1.643L20.5 12 7.331 20.007c-1.302.737-2.831-.216-2.831-1.643V5.653Z" clip-rule="evenodd" /></svg>
                        </button>
                        <button id="np-next-btn" title="Next" class="text-zinc-200 hover:text-white transition-all duration-200 hover:scale-110 active:scale-95 p-2.5 rounded-full hover:bg-white/10 focus:outline-none cursor-pointer">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8"><path fill-rule="evenodd" d="M3 8.689c0-.864.933-1.406 1.683-.977l7.108 4.061a1.125 1.125 0 0 1 0 1.954l-7.108 4.061A1.125 1.125 0 0 1 3 16.811V8.69ZM12.75 8.689c0-.864.933-1.406 1.683-.977l7.108 4.061a1.125 1.125 0 0 1 0 1.954l-7.108 4.061a1.125 1.125 0 0 1-1.683-.977V8.69Z" clip-rule="evenodd" /></svg>
                        </button>
                        <button id="np-repeat-btn" title="Toggle Repeat" class="text-zinc-400 hover:text-white transition-all duration-200 hover:scale-110 active:scale-95 p-2.5 rounded-full hover:bg-white/10 focus:outline-none cursor-pointer">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path fill-rule="evenodd" d="M12 5.25c1.213 0 2.415.046 3.605.135a3.256 3.256 0 0 1 3.01 3.01c.044.583.077 1.17.1 1.759L17.03 8.47a.75.75 0 1 0-1.06 1.06l3 3a.75.75 0 0 0 1.06 0l3-3a.75.75 0 0 0-1.06-1.06l-1.752 1.751c-.023-.65-.06-1.296-.108-1.939a4.756 4.756 0 0 0-4.392-4.392 49.422 49.422 0 0 0-7.436 0A4.756 4.756 0 0 0 3.89 8.282c-.017.224-.033.45-.046.676a.75.75 0 0 0 1.497.076c.013-.209.028-.417.044-.623a3.256 3.256 0 0 1 3.01-3.01c1.19-.09 2.392-.136 3.605-.136Zm-6.97 6.22a.75.75 0 0 0-1.06 0l-3 3a.75.75 0 1 0 1.06 1.06l1.752-1.751c.023.65.06 1.296.108 1.939a4.756 4.756 0 0 0 4.392 4.392 49.413 49.413 0 0 0 7.436 0 4.756 4.756 0 0 0 4.392-4.392c.017-.223.032-.449.046-.676a.75.75 0 0 0-1.497-.076c-.013.209-.028.417-.044.623a3.256 3.256 0 0 1-3.01 3.01 47.953 47.953 0 0 1-7.21 0 3.256 3.256 0 0 1-3.01-3.01 47.759 47.759 0 0 1-.1-1.759L6.97 15.53a.75.75 0 1 0 1.06-1.06l-3-3Z" clip-rule="evenodd" /></svg>
                        </button>
                    </div>

                    <!-- Volume -->
                    <div class="w-full mt-6 flex items-center justify-center md:justify-start gap-3 max-w-xs">
                        <span class="text-zinc-500"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.5A2.25 2.25 0 0 0 2.25 9.75v4.5a2.25 2.25 0 0 0 2.25 2.25h2.44l4.5 4.5c.944.945 2.56.276 2.56-1.06V4.06ZM18.75 12c0-1.24-.51-2.35-1.34-3.14a.75.75 0 1 0-1.03 1.1c.41.38.67.92.67 1.51s-.26 1.13-.67 1.51a.75.75 0 1 0 1.03 1.1c.83-.79 1.34-1.9 1.34-3.14Z" /></svg></span>
                        <input type="range" id="np-volume" min="0" max="1" step="0.01" value="1" class="w-full cursor-pointer outline-none">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Persistent Bento Context Menu -->
    <div id="bento-context-menu"
        class="hidden fixed z-50 w-48 py-1 bg-zinc-800 border border-white/10 rounded-xl shadow-2xl origin-top-right">
        <button id="bento-play-btn"
            class="w-full text-left px-4 py-2 text-sm text-zinc-300 hover:bg-white/5 hover:text-white transition-colors flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z">
                </path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            Play
        </button>
        <button id="bento-search-metadata-btn"
            class="w-full text-left px-4 py-2 text-sm text-zinc-300 hover:bg-white/5 hover:text-white transition-colors flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            Search Metadata
        </button>
        <button id="bento-next-to-queue-btn"
            class="w-full text-left px-4 py-2 text-sm text-zinc-300 hover:bg-white/5 hover:text-white transition-colors flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
            </svg>
            Play Next
        </button>
        <button id="bento-delete-btn"
            class="w-full text-left px-4 py-2 text-sm text-zinc-300 hover:bg-white/5 hover:text-white transition-colors flex items-center gap-2 text-red-400 hover:text-red-300">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                </path>
            </svg>
            Delete
        </button>
        <button id="bento-edit-btn"
            class="w-full text-left px-4 py-2 text-sm text-zinc-300 hover:bg-white/5 hover:text-white transition-colors flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                </path>
            </svg>
            Edit Info
        </button>
        <button id="bento-add-queue-btn"
            class="w-full text-left px-4 py-2 text-sm text-zinc-300 hover:bg-white/5 hover:text-white transition-colors flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 6h16M4 10h16M4 14h16M4 18h8m4-4v8m-4-4h8"></path>
            </svg>
            Add to queue
        </button>
        <button id="bento-add-playlist-btn"
            class="w-full text-left px-4 py-2 text-sm text-zinc-300 hover:bg-white/5 hover:text-white transition-colors flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path>
            </svg>
            Add to Playlist
        </button>
    </div>

</body>

</html>
