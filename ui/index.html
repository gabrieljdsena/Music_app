    <style>
        :root {
            --controller-height: 112px; /* h-28 = 7rem = 112px */
        }
        .main-content-area {
            height: calc(100vh - var(--controller-height));
        }
        
        /* Modern Dark Mode Scrollbar */
        * {
            scrollbar-width: thin;
            scrollbar-color: #3f3f46 transparent; /* zinc-700 thumb, transparent track */
        }
        
        /* WebKit Browsers (Chrome, Safari, Edge) */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background-color: #3f3f46; /* zinc-700 */
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background-color: #52525b; /* zinc-600 */
        }

        /* Mini Audio Visualizer */
        @keyframes visualizer-bounce {
            0%, 100% { transform: scaleY(0.3); }
            50% { transform: scaleY(1); }
        }
        .visualizer-bar {
            width: 3px;
            height: 16px;
            background-color: #f97316; /* Tailwind orange-500 */
            border-radius: 9999px;
            animation: visualizer-bounce 1s infinite ease-in-out;
            transform-origin: bottom;
        }
        .visualizer-bar:nth-child(1) { animation-duration: 0.5s; }
        .visualizer-bar:nth-child(2) { animation-duration: 0.7s; animation-delay: 0.1s; }
        .visualizer-bar:nth-child(3) { animation-duration: 0.6s; animation-delay: 0.4s; }
        .visualizer-bar:nth-child(4) { animation-duration: 0.8s; animation-delay: 0.2s; }

        /* Sidebar active state */
        .active-nav {
            background-color: rgba(249, 115, 22, 0.1) !important; /* matches bg-orange-500/10 */
            color: white !important;
        }
        .active-nav .nav-indicator {
            transform: scaleY(1) !important;
        }
        .active-nav svg {
            color: rgb(251, 146, 60) !important; /* matches text-orange-400 */
            transform: scale(1.1) !important;
        }
    </style>
</head>

<script>



    // JS -> Python

    $(document).on("change", "#volumeSlider", async function() {
        const volume = $(this).val();
        await window.pywebview.api.volume_slider(volume);
    });

    // Using "change" ensures it works for both clicking and dragging!
    $(document).on("change", "#progressSlider", async function() {
        const time = $(this).val();
        await window.pywebview.api.progress_slider_click(time);
    });

    
    window.play_button = async function(current_song) {
        const isPlaying = await window.pywebview.api.play_button(current_song);
        update_play_button_ui(isPlaying);
    }

    window.toggle_play_pause = async function() {
        // Optimistically flip the UI so it feels completely instant
        if (window.current_playing_song) {
            update_play_button_ui(!window.is_currently_playing);
        }

        const isPlaying = await window.pywebview.api.play_button(null);
        
        // If no song is loaded, try to play the first song in the active list
        if (isPlaying === null) {
            // Revert the optimistic update if we didn't actually play
            if (window.current_playing_song) {
                update_play_button_ui(!window.is_currently_playing);
            }
            $(".song-row").first().click();
            return;
        }
        
        update_play_button_ui(isPlaying);
    }

    window.toggle_shuffle = async function() {
        const isShuffled = await window.pywebview.api.toggle_shuffle();
        const btn = $("#shuffleBtn");
        if (isShuffled) {
            btn.removeClass("text-zinc-400 hover:text-white").addClass("text-orange-500 hover:text-orange-400 bg-white/15");
        } else {
            btn.removeClass("text-orange-500 hover:text-orange-400 bg-white/15").addClass("text-zinc-400 hover:text-white");
        }
    }

    window.is_currently_playing = false;

    function update_play_button_ui(isPlaying) {
        window.is_currently_playing = isPlaying;
        const playBtn = $("#playPauseBtn");
        if (isPlaying) {
            playBtn.html(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8"><path fill-rule="evenodd" d="M6.75 5.25a.75.75 0 0 1 .75-.75H9a.75.75 0 0 1 .75.75v13.5a.75.75 0 0 1-.75.75H7.5a.75.75 0 0 1-.75-.75V5.25Zm7.5 0A.75.75 0 0 1 15 4.5h1.5a.75.75 0 0 1 .75.75v13.5a.75.75 0 0 1-.75.75H15a.75.75 0 0 1-.75-.75V5.25Z" clip-rule="evenodd" /></svg>`);
            $("#audio-visualizer, .list-visualizer").removeClass("w-0 ml-0 opacity-0").addClass("w-4 ml-1 opacity-100");
        } else {
            playBtn.html(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8 ml-1"><path fill-rule="evenodd" d="M4.5 5.653c0-1.427 1.529-2.38 2.831-1.643L20.5 12 7.331 20.007c-1.302.737-2.831-.216-2.831-1.643V5.653Z" clip-rule="evenodd" /></svg>`);
            $("#audio-visualizer, .list-visualizer").removeClass("w-4 ml-1 opacity-100").addClass("w-0 ml-0 opacity-0");
        }
    }

    // Automatically sync visualizers when dynamically generated content (like home.html) is added
    const visualizerObserver = new MutationObserver(function(mutations) {
        if (window.is_currently_playing) {
            $(".list-visualizer").removeClass("w-0 ml-0 opacity-0").addClass("w-4 ml-1 opacity-100");
        } else {
            $(".list-visualizer").removeClass("w-4 ml-1 opacity-100").addClass("w-0 ml-0 opacity-0");
        }
    });

    async function sendData() {
        const val = $('#inp').val();
        const response = await window.pywebview.api.send_to_python(val);
    }

    // Python -> JS
    function song_list(data) {
        // msg is an array of song objects
        data.forEach(song => {
            // Format the duration into MM:SS
            const durationSecs = Math.floor(song.Duration || 0);
            const minutes = Math.floor(durationSecs / 60);
            const seconds = (durationSecs % 60).toString().padStart(2, '0');
            const formattedDuration = `${minutes}:${seconds}`;
            
            // Log each song to the console
            console.log(`Loaded: ${song.Title} by ${song.Artist} (${formattedDuration})`);
        
        });
    }

    // Initialize Notyf globally
    const notyf = new Notyf();

    $(window).on('resize', function() {
        if($(window).width() <= 700){
            hideSideBar();
            $("#sidebar-toggle").addClass("hidden");
        }else{
            $("#sidebar-toggle").removeClass("hidden");
        }
    });

    $("#sidebar-toggle").click(function() {
        if($("#sidebar").hasClass("w-64")){
            hideSideBar();
        }else{
            showSidebar();
        }
    });

    function hideSideBar(){
        $("#sidebar-toggle svg").addClass("rotate-180");
        $("#sidebar").removeClass("w-64").addClass("w-20");
        $(".nav-text").addClass("hidden");
        $("#brand-container").addClass("hidden");
        $("#sidebar-header").removeClass("justify-between").addClass("justify-center");
    } 

    function showSidebar(){
        $("#sidebar").removeClass("w-20").addClass("w-64");
        $("#sidebar-toggle svg").removeClass("rotate-180");
        $(".nav-text").removeClass("hidden");
        $("#brand-container").removeClass("hidden");
        $("#sidebar-header").removeClass("justify-center").addClass("justify-between");
    } 

    // --- Dynamic Content Routing ---
    function navigateTo(page) {
        // Fade out current content for a smooth transition
        $("#main").fadeOut(100, function() {
            // Load the HTML snippet from the views folder
            $(this).load("./views/" + page + ".html", function(response, status, xhr) {
                if (status === "error") {
                    $(this).html("<div class='p-4 text-red-500'>Error loading " + page + ".html: " + xhr.status + " " + xhr.statusText + "</div>");
                }
                $(this).fadeIn(150);
                
                if (page === "home") {
                    if (window.pywebview && window.pywebview.api) {
                        window.pywebview.api.send_song_list();
                    } else {
                        window.addEventListener('pywebviewready', function() {
                            window.pywebview.api.send_song_list();
                        }, { once: true });
                    }
                }
            });
        });
    }

    // Handle sidebar link clicks
    $(document).on("click", ".nav-link", function(e) {
        e.preventDefault();
        const targetPage = $(this).data("target");
        if (targetPage) {
            $(".nav-link").removeClass("active-nav");
            $(this).addClass("active-nav");
            
            navigateTo(targetPage);
        }
    });

    // Load initial view on startup
    $(document).ready(function() {
        // Start observing the main container for dynamic content changes
        visualizerObserver.observe(document.getElementById("main"), { childList: true, subtree: true });

        navigateTo("home");
        
        // Safely request Python to send the settings on startup
        if (window.pywebview && window.pywebview.api) {
            window.pywebview.api.load_settings();
        } else {
            window.addEventListener('pywebviewready', function() {
                window.pywebview.api.load_settings();
            }, { once: true });
        }
    });

    let progressTimer = null;
    let isDraggingProgress = false;

    // Prevent UI jumps if the user grabs the slider (useful when you add seeking later)
    $(document).on("mousedown touchstart", "#progressSlider", function() {
        isDraggingProgress = true;
    });

    $(document).on("mouseup touchend", "#progressSlider", function() {
        isDraggingProgress = false;
    });

    function startProgressTracking() {
        if (progressTimer) clearInterval(progressTimer);
        
        progressTimer = setInterval(async () => {
            try {
                if (!window.pywebview || !window.pywebview.api) return;
                const pos = await window.pywebview.api.get_current_pos();
                if (pos >= 0) {
                    const mins = Math.floor(pos / 60);
                    const secs = Math.floor(pos % 60).toString().padStart(2, '0');
                    $("#current_time").text(`${mins}:${secs}`);
                    
                    if (!isDraggingProgress) {
                        $("#progressSlider").val(pos);
                    }
                    if (typeof window.updateHighlightedLine === 'function' && !$("#lyrics-container-view").hasClass("hidden")) {
                        window.updateHighlightedLine(pos);
                    }
                }
            } catch (err) {
                // Window was likely closed or python object disposed mid-call
                clearInterval(progressTimer);
            }
        }, 100); // Polling 10 times a second for snappier lyrics response
    }

    // Clean up background polling when the user closes the window
    $(window).on("beforeunload", function() {
        if (progressTimer) clearInterval(progressTimer);
    });

    window.plaiyng_info = function(data) {
        window.current_playing_song = data;
        // Format the duration into MM:SS
        const duration = data.Duration || 0;
        const durationSecs = Math.floor(duration);
        const minutes = Math.floor(durationSecs / 60);
        const seconds = (durationSecs % 60).toString().padStart(2, '0');
        $("#total_time").text(`${minutes}:${seconds}`);
        
        // Set slider maximum to exact song duration and start the tracker
        $("#progressSlider").attr("max", duration).val(0);
        startProgressTracking();
        if (typeof window.fetchLyricsForCurrentSong === 'function') {
            window.fetchLyricsForCurrentSong(data);
        }
    }

    window.load_settings = function(volume) {
        $("#volumeSlider").val(parseFloat(volume));
    }

    window.playing_view = function(current_song) {
        const altText = `Album cover art for ${title} by ${artist}.`; // Added "Album cover art"
        const coverArt = current_song.CoverArt
            ? `<img src="${current_song.CoverArt}" class="w-full h-full object-cover" alt="${altText}"`
            : `<div class="w-full h-full bg-zinc-800 flex items-center justify-center"><svg class="w-5 h-5 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg></div>`;
        const html = `
            <div class="flex items-center gap-3 overflow-hidden">
                <div class="flex items-end justify-center gap-[2px] w-4 h-4 ml-1 flex-shrink-0 transition-all duration-300 overflow-hidden" id="audio-visualizer">
                    <div class="visualizer-bar"></div>
                    <div class="visualizer-bar"></div>
                    <div class="visualizer-bar"></div>
                    <div class="visualizer-bar"></div>
                </div>
                <div class="w-10 h-10 rounded-md bg-zinc-800 flex-shrink-0 overflow-hidden shadow-md">
                    ${coverArt}
                </div>
                <div class="flex flex-col">
                    <div class="song-title truncate font-medium text-zinc-100 group-hover:text-orange-400 transition-colors truncate">${current_song.Title || "Unknown Title"}</div>
                    <div class="cursor-pointer truncate hover:text-zinc-400 transition-colors text-sm truncate">${current_song.Artist || "Unknown Artist"}</div>
                </div>
            </div>`;
        $("#song_plaiyng_div").html(html);
    }

    // --- Global Queue Logic ---
    window.queue_songs = window.queue_songs || [];
    window.is_custom_queue = window.is_custom_queue || false;

    window.generateQueueItemHtml = function(song, index) {
        const coverArt = current_song.CoverArt
            ? `<img src="${current_song.CoverArt}" class="w-full h-full object-cover" alt="${altText}"`
            : `<div class="w-full h-full bg-zinc-800 flex items-center justify-center lazy-cover" data-filename="${song.File ? song.File.replace(/"/g, '&quot;') : ''}"><svg class="w-4 h-4 text-zinc-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg></div>`;
        
        return `
            <div class="queue-item flex items-center gap-3 p-2 rounded-lg hover:bg-white/5 transition-colors cursor-pointer group" data-index="${index}" data-path='${JSON.stringify(song).replace(/'/g, '&apos;')}'>
                <div class="w-10 h-10 rounded shadow-md overflow-hidden flex-shrink-0 relative">
                    ${coverArt}
                    <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                        <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                </div>
                <div class="flex flex-col overflow-hidden w-full">
                    <span class="text-sm font-medium text-zinc-200 truncate group-hover:text-orange-400 transition-colors">${song.Title || "Unknown Title"}</span>
                    <span class="text-xs text-zinc-500 truncate">${song.Artist || "Unknown Artist"}</span>
                </div>
                <button class="remove-queue-btn text-zinc-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-all p-1 focus:outline-none" title="Remove">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
        `;
    };

    if (window.lazyQueueObserver) window.lazyQueueObserver.disconnect();
    window.lazyQueueObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            const container = entry.target;
            if (entry.isIntersecting) {
                if (!container.hasAttribute('data-rendered')) {
                    const songDataStr = container.getAttribute('data-path');
                    const index = container.getAttribute('data-index');
                    if (songDataStr) {
                        const songData = JSON.parse(songDataStr.replace(/&apos;/g, "'"));
                        container.innerHTML = window.generateQueueItemHtml(songData, index);
                        container.setAttribute('data-rendered', 'true');
                        
                        const cover = container.querySelector('.lazy-cover');
                        if (cover && window.lazyCoverObserver) {
                            window.lazyCoverObserver.observe(cover);
                        }
                    }
                }
            } else {
                if (container.hasAttribute('data-rendered')) {
                    container.style.minHeight = container.offsetHeight + 'px';
                    container.innerHTML = '';
                    container.removeAttribute('data-rendered');
                }
            }
        });
    }, { rootMargin: '300px' });

    // --- Global Lyrics Logic ---
    window.parsedLyrics = [];
    
    window.parseLRC = function(lrcText) {
        const lines = lrcText.split('\n');
        const result = [];
        const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

        lines.forEach(line => {
            const match = timeRegex.exec(line);
            if (match) {
                const minutes = parseInt(match[1]);
                const seconds = parseInt(match[2]);
                const milliseconds = parseInt(match[3].padEnd(3, '0'));
                const timeInSeconds = (minutes * 60) + seconds + (milliseconds / 1000);
                const text = line.replace(timeRegex, '').trim();
                
                if (text) {
                    result.push({ time: timeInSeconds, text: text });
                } else {
                    result.push({ time: timeInSeconds, text: '♪' });
                }
            }
        });
        return result;
    };

    window.renderLyrics = function() {
        const container = document.getElementById('lyrics-container');
        if (!container) return;
        
        container.innerHTML = '';
        if (window.parsedLyrics.length === 0) {
            container.innerHTML = '<p class="text-zinc-500 text-2xl md:text-4xl font-semibold">No synchronized lyrics found.</p>';
            return;
        }

        window.parsedLyrics.forEach((line, index) => {
            const p = document.createElement('p');
            p.id = `lyric-line-${index}`;
            p.className = 'lyric-line text-3xl md:text-5xl lg:text-6xl font-bold text-zinc-600 cursor-pointer hover:text-zinc-400 transition-all duration-300';
            p.innerText = line.text;
            p.onclick = () => {
                if (window.pywebview && window.pywebview.api) {
                    window.pywebview.api.progress_slider_click(line.time);
                }
            };
            container.appendChild(p);
        });
    };

    window.updateHighlightedLine = function(currentTime) {
        if (!window.parsedLyrics || window.parsedLyrics.length === 0) return;

        let activeIndex = -1;
        for (let i = 0; i < window.parsedLyrics.length; i++) {
            if (currentTime >= window.parsedLyrics[i].time) {
                activeIndex = i;
            } else {
                break;
            }
        }

        if (activeIndex !== -1) {
            const currentActive = document.querySelector('.lyric-line.active-lyric');
            const newActive = document.getElementById(`lyric-line-${activeIndex}`);
            
            if (currentActive !== newActive) {
                if (currentActive) {
                    currentActive.classList.remove('active-lyric', 'text-white', 'scale-105');
                    currentActive.classList.add('text-zinc-600');
                }
                if (newActive) {
                    newActive.classList.remove('text-zinc-600');
                    newActive.classList.add('active-lyric', 'text-white', 'scale-105');
                    
                    // Replace scrollIntoView with precise container scrolling to prevent page shift
                    const container = document.getElementById('lyrics-container');
                    if (container) {
                        const topPos = newActive.offsetTop - (container.clientHeight / 2) + (newActive.clientHeight / 2);
                        container.scrollTo({
                            top: Math.max(0, topPos),
                            behavior: 'smooth'
                        });
                    }
                }
            }
        }
    };

    window.fetchLyricsForCurrentSong = async function(songData) {
        const container = document.getElementById('lyrics-container');
        if (!container) return;
        
        songData = songData || window.current_playing_song;
        if (!songData) return;

        container.innerHTML = `<p class="text-zinc-500 text-2xl md:text-4xl font-semibold animate-pulse">Loading lyrics for ${songData.Title}...</p>`;
        window.parsedLyrics = [];

        try {
            const lyricsData = await window.pywebview.api.get_lyrics(
                songData.Title, 
                songData.Artist, 
                songData.Album, 
                songData.Duration
            );
            
            if (lyricsData && lyricsData.synced) {
                window.parsedLyrics = window.parseLRC(lyricsData.synced);
                window.renderLyrics();
            } else if (lyricsData && lyricsData.plain) {
                container.innerHTML = `<div class="text-zinc-300 text-md md:text-xl lg:text-2xl font-bold whitespace-pre-line leading-relaxed md:leading-loose pt-8 pb-16">${lyricsData.plain}</div>`;
            } else {
                container.innerHTML = '<p class="text-zinc-500 text-2xl md:text-4xl font-semibold">No lyrics found for this song.</p>';
            }
        } catch (error) {
            container.innerHTML = '<p class="text-red-400 text-2xl md:text-4xl font-semibold">Failed to load lyrics.</p>';
        }
    };

    window.update_queue_ui = function() {
        const queueBody = $("#queue-body");
        queueBody.find(".queue-item, .queue-item-container").remove();

        if (window.queue_songs.length === 0) {
            $("#empty-queue-msg").removeClass("hidden");
            $("#clear-queue-btn").addClass("hidden");
        } else {
            $("#empty-queue-msg").addClass("hidden");
            if (window.is_custom_queue) {
                $("#clear-queue-btn").removeClass("hidden");
            } else {
                $("#clear-queue-btn").addClass("hidden");
            }
            let queueHtmlBuffer = "";
            window.queue_songs.forEach((song, index) => {
                queueHtmlBuffer += `<div class="queue-item-container" style="min-height: 56px;" data-index="${index}" data-path='${JSON.stringify(song).replace(/'/g, '&apos;')}' draggable="true"></div>`;
            });
            queueBody.append(queueHtmlBuffer);
        }
        
        $("#queue-body .queue-item-container").each(function() {
            if (window.lazyQueueObserver) window.lazyQueueObserver.observe(this);
        });
    };

    $(document).ready(function() {
        window.update_queue_ui();

        // Toggle queue sidebar
        $(document).on("click", "#toggle-queue-btn, #close-queue-btn-mobile", function() {
            const sidebar = $("#queue-sidebar");
            if (sidebar.hasClass("max-w-0")) {
                sidebar.removeClass("max-w-0 xl:max-h-0 opacity-0 invisible translate-x-full xl:translate-x-0")
                       .addClass("max-w-full xl:max-w-xs xl:max-h-[calc(100vh-180px)] opacity-100 visible xl:mr-8 translate-x-0");
            } else {
                sidebar.removeClass("max-w-full xl:max-w-xs xl:max-h-[calc(100vh-180px)] opacity-100 visible xl:mr-8 translate-x-0")
                       .addClass("max-w-0 xl:max-h-0 opacity-0 invisible translate-x-full xl:translate-x-0");
            }
        });

        // Toggle lyrics view
        $(document).on("click", "#toggle-lyrics-btn", function() {
            const lyricsView = $("#lyrics-container-view");
            const btn = $(this);
            if (lyricsView.hasClass("hidden")) {
                lyricsView.removeClass("hidden").addClass("flex");
                btn.html(`<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-orange-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>`);
                btn.removeClass("text-zinc-400 hover:text-white").addClass("text-orange-500 hover:text-orange-400");
                if (window.current_playing_song && window.parsedLyrics.length === 0) {
                    window.fetchLyricsForCurrentSong(window.current_playing_song);
                }
            } else {
                lyricsView.addClass("hidden").removeClass("flex");
                btn.html(`<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>`);
                btn.removeClass("text-orange-500 hover:text-orange-400").addClass("text-zinc-400 hover:text-white");
            }
        });

        // Play queue item
        $(document).on("click", ".queue-item", async function(e) {
            if ($(e.target).closest(".remove-queue-btn").length) return;
            const songData = JSON.parse($(this).closest(".queue-item-container").attr("data-path").replace(/&apos;/g, "'"));
            if (songData) {
                const index = $(this).closest(".queue-item-container").data("index");
                window.current_playing_song = songData;
                if (window.set_active_song_ui) window.set_active_song_ui(songData);
                
                window.queue_songs.splice(0, index + 1);
                window.update_queue_ui();
                
                if (window.pywebview && window.pywebview.api && window.pywebview.api.jump_to_queue_index) {
                    await window.pywebview.api.jump_to_queue_index(index);
                }
                
                await window.play_button(songData);
            }
        });

        // Remove item from queue
        $(document).on("click", ".remove-queue-btn", function(e) {
            e.stopPropagation();
            const index = $(this).closest(".queue-item-container").data("index");
            window.is_custom_queue = true;
            window.queue_songs.splice(index, 1);
            window.update_queue_ui();
            
            if (window.pywebview && window.pywebview.api && window.pywebview.api.remove_from_queue) {
                window.pywebview.api.remove_from_queue(index);
            }
        });

        // Clear queue
        $(document).on("click", "#clear-queue-btn", function() {
            window.is_custom_queue = false;
            window.queue_songs = [];
            window.update_queue_ui();
            if (window.pywebview && window.pywebview.api && window.pywebview.api.clear_queue) {
                window.pywebview.api.clear_queue();
            }
        });
        
        // --- Queue Drag and Drop Logic ---
        let draggedItemIndex = null;

        $(document).on("dragstart", ".queue-item-container", function(e) {
            draggedItemIndex = $(this).data("index");
            $(this).addClass("opacity-50");
            e.originalEvent.dataTransfer.effectAllowed = "move";
            e.originalEvent.dataTransfer.setData("text/plain", draggedItemIndex);
        });

        $(document).on("dragover", ".queue-item-container", function(e) {
            e.preventDefault();
            e.originalEvent.dataTransfer.dropEffect = "move";
            const bounding = this.getBoundingClientRect();
            const offset = bounding.y + (bounding.height / 2);
            $(".queue-item-container").removeClass("border-t-2 border-b-2 border-orange-500");
            if (e.originalEvent.clientY > offset) {
                $(this).addClass("border-b-2 border-orange-500");
            } else {
                $(this).addClass("border-t-2 border-orange-500");
            }
        });

        $(document).on("dragleave", ".queue-item-container", function(e) {
            $(this).removeClass("border-t-2 border-b-2 border-orange-500");
        });

        $(document).on("drop", ".queue-item-container", async function(e) {
            e.preventDefault();
            $(".queue-item-container").removeClass("border-t-2 border-b-2 border-orange-500 opacity-50");
            
            const targetIndex = $(this).data("index");
            if (draggedItemIndex === null || draggedItemIndex === targetIndex) return;

            const bounding = this.getBoundingClientRect();
            const offset = bounding.y + (bounding.height / 2);
            let insertIndex = targetIndex;
            
            if (e.originalEvent.clientY > offset) {
                insertIndex++;
            }
            if (draggedItemIndex < insertIndex) {
                insertIndex--;
            }

            window.is_custom_queue = true;
            const item = window.queue_songs.splice(draggedItemIndex, 1)[0];
            window.queue_songs.splice(insertIndex, 0, item);
            window.update_queue_ui();

            if (window.pywebview && window.pywebview.api && window.pywebview.api.reorder_queue) {
                await window.pywebview.api.reorder_queue(draggedItemIndex, insertIndex);
            }
            draggedItemIndex = null;
        });

        $(document).on("dragend", ".queue-item-container", function(e) {
            $(this).removeClass("opacity-50");
            $(".queue-item-container").removeClass("border-t-2 border-b-2 border-orange-500");
            draggedItemIndex = null;
        });
    });

</script>
