<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="./output.css" rel="stylesheet">
    <script src="./jquery.min.js"></script>
    <link href="../notyf.min.css" rel="stylesheet">
    <script src="../notyf.min.js"></script>
    <link rel="stylesheet" href="./css.css">
    <!-- SweetAlert2 (Local) -->
    <script src="../sweetalert2/dist/sweetalert2.all.min.js"></script>
    <!-- Notyf for notifications -->
    <style>
        :root {
            --controller-height: 112px; /* h-28 = 7rem = 112px */
        }
        .main-content-area {
            height: calc(100vh - var(--controller-height));
        }
        
        /* Modern Dark Mode Scrollbar */
        * {
            scrollbar-width: thin;
            scrollbar-color: #3f3f46 transparent; /* zinc-700 thumb, transparent track */
        }
        
        /* WebKit Browsers (Chrome, Safari, Edge) */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background-color: #3f3f46; /* zinc-700 */
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background-color: #52525b; /* zinc-600 */
        }

        /* Mini Audio Visualizer */
        @keyframes visualizer-bounce {
            0%, 100% { transform: scaleY(0.3); }
            50% { transform: scaleY(1); }
        }
        .visualizer-bar {
            width: 3px;
            height: 16px;
            background-color: #f97316; /* Tailwind orange-500 */
            border-radius: 9999px;
            animation: visualizer-bounce 1s infinite ease-in-out;
            transform-origin: bottom;
        }
        .visualizer-bar:nth-child(1) { animation-duration: 0.5s; }
        .visualizer-bar:nth-child(2) { animation-duration: 0.7s; animation-delay: 0.1s; }
        .visualizer-bar:nth-child(3) { animation-duration: 0.6s; animation-delay: 0.4s; }
        .visualizer-bar:nth-child(4) { animation-duration: 0.8s; animation-delay: 0.2s; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-300 font-sans overflow-hidden selection:bg-orange-500/30">
    <!-- FIX: Added w-full to ensure the page container respects the screen width -->
    <div id="page" class="flex flex-row w-full">
        <aside id="sidebar" class="w-64 flex-shrink-0 flex flex-col gap-y-6 border-r border-white/5 bg-zinc-900/40 backdrop-blur-xl transition-all duration-300 ease-[cubic-bezier(0.4,0,0.2,1)] z-10 relative">
            <button class="text-zinc-400 hover:text-white mt-4 mr-4 ml-auto p-2 rounded-xl hover:bg-white/5 transition-all duration-300" id="sidebar-toggle">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 transition-transform duration-300 ease-in-out">
                    <path fill-rule="evenodd" d="m18.75 4.5-7.5 7.5 7.5 7.5m-6-15L5.25 12l7.5 7.5" clip-rule="evenodd" />
                </svg>
            </button>
            <div class="p-2 justify-left" id="sidebar-content">
                <!-- Sidebar content goes here -->
                <a href="#" data-target="home" class="nav-link flex p-3 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5 transition-all duration-300 mb-4" title="Home">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-7 h-7 mr-2 flex-shrink-0">
                        <path d="M11.47 3.84a.75.75 0 011.06 0l8.99 8.99a.75.75 0 11-1.06 1.06L12 5.43 3.53 13.89a.75.75 0 11-1.06-1.06L11.47 3.84z" />
                        <path d="M4.5 12.93v7.32c0 .41.34.75.75.75h4.5a.75.75 0 00.75-.75v-4.5a.75.75 0 01.75-.75h2.5a.75.75 0 01.75.75v4.5a.75.75 0 00.75.75h4.5a.75.75 0 00.75-.75v-7.32l-7.5-7.5-7.5 7.5z" />
                    </svg>
                    <span class="nav-text">Home</span>
                </a>
                <a href="#" data-target="download_songs" class="nav-link flex items-left p-3 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5 transition-all duration-300 mb-4" title="Download">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-7 h-7 mr-2 flex-shrink-0">
                        <path fill-rule="evenodd" d="M12 2.25a.75.75 0 01.75.75v11.69l3.22-3.22a.75.75 0 111.06 1.06l-4.5 4.5a.75.75 0 01-1.06 0l-4.5-4.5a.75.75 0 111.06-1.06l3.22 3.22V3a.75.75 0 01.75-.75zM6 17.25a.75.75 0 01.75-.75h10.5a.75.75 0 010 1.5H6.75a.75.75 0 01-.75-.75z" clip-rule="evenodd" />
                    </svg>
                    <span class="nav-text">Download</span>
                </a>
                <a href="#" data-target="settings" class="nav-link flex items-left p-3 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5 transition-all duration-300 mb-4" title="Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-7 h-7 mr-2 flex-shrink-0">
                        <path fill-rule="evenodd" d="M11.078 2.25c-.917 0-1.699.663-1.85 1.567L9.05 4.889c-.02.12-.115.26-.297.348a7.493 7.493 0 00-.986.57c-.166.115-.334.126-.45.083L6.3 5.508a1.875 1.875 0 00-2.282.819l-.922 1.597a1.875 1.875 0 00.432 2.385l1.093.832c.12.09.19.228.21.365a7.484 7.484 0 000 1.002c-.02.137-.09.275-.21.365l-1.093.832a1.875 1.875 0 00-.432 2.385l.922 1.597a1.875 1.875 0 002.282.818l1.019-.382c.115-.043.283-.031.45.082.312.214.641.405.985.57.182.088.277.228.297.35l.178 1.071c.151.904.933 1.567 1.85 1.567h1.844c.916 0 1.699-.663 1.85-1.567l.178-1.072c.02-.12.114-.26.297-.349.344-.165.673-.356.985-.57.167-.114.335-.125.45-.082l1.02.382a1.875 1.875 0 002.28-.819l.923-1.597a1.875 1.875 0 00-.432-2.385l-1.093-.832c-.12-.09-.19-.228-.21-.365a7.484 7.484 0 000-1.002c.02-.137.09-.275.21-.365l1.093-.832a1.875 1.875 0 00.432-2.385l-.922-1.597a1.875 1.875 0 00-2.282-.818l-1.02.382c-.114.043-.282.031-.449-.083a7.49 7.49 0 00-.985-.57c-.183-.087-.277-.227-.297-.348l-.179-1.072a1.875 1.875 0 00-1.85-1.567h-1.843zM12 15.75a3.75 3.75 0 100-7.5 3.75 3.75 0 000 7.5z" clip-rule="evenodd" />
                    </svg>
                    <span class="nav-text">Settings</span>
                </a>
            </div>
        </aside>
        
        <div class="flex flex-col flex-grow min-w-0 p-8 lg:p-12 main-content-area bg-gradient-to-b from-zinc-900/30 to-zinc-950 relative">
            
            <div class="overflow-y-auto overflow-x-hidden flex-grow" id="main">
                <!-- Content will be dynamically loaded here by jQuery. -->
            </div>
        </div>
    </div>

    <!-- The fixed controller is outside the main flex container to avoid affecting its layout -->
    <div class="fixed bottom-0 left-0 right-0 flex flex-row items-center justify-between h-28 border-t border-white/5 bg-zinc-900/80 backdrop-blur-2xl px-6 z-20 shadow-[0_-10px_40px_rgba(0,0,0,0.3)]" id="controls">
        
        <!-- Left Side: Empty for now -->
        <div id="song_plaiyng_div" class="flex-1 flex items-center min-w-0"></div>

        <!-- Center: Buttons and Progress Slider -->
        <div class="flex flex-col items-center justify-center flex-[2] max-w-3xl gap-2">
            <div class="flex flex-row items-center justify-center gap-6 sm:gap-8 w-full">
                <button class="text-zinc-400 hover:text-white transition-all duration-300 hover:scale-110 active:scale-95 p-2 rounded-full hover:bg-white/5">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                        <path fill-rule="evenodd" d="M21 16.811c0 .864-.933 1.406-1.683.977l-7.108-4.061a1.125 1.125 0 0 1 0-1.954l7.108-4.061A1.125 1.125 0 0 1 21 8.689v8.122ZM11.25 16.811c0 .864-.933 1.406-1.683.977l-7.108-4.061a1.125 1.125 0 0 1 0-1.954l7.108-4.061a1.125 1.125 0 0 1 1.683.977v8.122Z" clip-rule="evenodd" />
                    </svg>
                </button>

                <button id="playPauseBtn" onclick="window.toggle_play_pause();" class="flex items-center justify-center w-14 h-14 bg-white text-zinc-950 hover:bg-orange-400 hover:text-white transition-all duration-300 hover:scale-105 active:scale-95 rounded-full shadow-[0_0_15px_rgba(255,255,255,0.1)] hover:shadow-[0_0_20px_rgba(251,146,60,0.4)]">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8 ml-1">
                        <path fill-rule="evenodd" d="M4.5 5.653c0-1.427 1.529-2.38 2.831-1.643L20.5 12 7.331 20.007c-1.302.737-2.831-.216-2.831-1.643V5.653Z" clip-rule="evenodd" />
                    </svg>
                </button>
                <button class="text-zinc-400 hover:text-white transition-all duration-300 hover:scale-110 active:scale-95 p-2 rounded-full hover:bg-white/5">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                        <path fill-rule="evenodd" d="M3 8.689c0-.864.933-1.406 1.683-.977l7.108 4.061a1.125 1.125 0 0 1 0 1.954l-7.108 4.061A1.125 1.125 0 0 1 3 16.811V8.69ZM12.75 8.689c0-.864.933-1.406 1.683-.977l7.108 4.061a1.125 1.125 0 0 1 0 1.954l-7.108 4.061a1.125 1.125 0 0 1-1.683-.977V8.69Z" clip-rule="evenodd" />
                    </svg>
                </button>
                <button class="text-zinc-400 hover:text-white transition-all duration-300 hover:scale-110 active:scale-95 p-2 rounded-full hover:bg-white/5">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                        <path fill-rule="evenodd" d="M12.53 16.28a.75.75 0 0 1-1.06 0l-7.5-7.5a.75.75 0 0 1 1.06-1.06L12 14.69l6.97-6.97a.75.75 0 1 1 1.06 1.06l-7.5 7.5Z" clip-rule="evenodd" />
                        <path fill-rule="evenodd" d="M11.47 7.72a.75.75 0 0 1 1.06 0l7.5 7.5a.75.75 0 1 1-1.06 1.06L12 9.31l-6.97 6.97a.75.75 0 0 1-1.06-1.06l7.5-7.5Z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
            <!-- Progress Slider -->
            <div class="w-full flex items-center gap-3">
                <span class="text-xs text-zinc-500 font-medium font-mono" id="current_time">0:00</span>
                <input 
                    type="range" 
                    id="progressSlider" 
                    min="0" step="0.1" value="0"
                    class="w-full h-1 bg-zinc-800 rounded-full cursor-pointer accent-orange-500 hover:accent-orange-400 outline-none border-none shadow-none focus:outline-none focus:ring-0 transition-all duration-300"
                >
                <span class="text-xs text-zinc-500 font-medium font-mono" id="total_time">0:00</span>
            </div>
        </div>

        <!-- Right Side: Volume -->
        <div class="flex-1 flex items-center justify-end gap-2 min-w-0">
            <!-- Volume Icon Button -->
            <button class="text-zinc-400 hover:text-white transition-all duration-300 hover:scale-110 active:scale-95 p-2 rounded-full hover:bg-white/5">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
                    <path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.5A2.25 2.25 0 0 0 2.25 9.75v4.5a2.25 2.25 0 0 0 2.25 2.25h2.44l4.5 4.5c.944.945 2.56.276 2.56-1.06V4.06ZM18.75 12c0-1.24-.51-2.35-1.34-3.14a.75.75 0 1 0-1.03 1.1c.41.38.67.92.67 1.51s-.26 1.13-.67 1.51a.75.75 0 1 0 1.03 1.1c.83-.79 1.34-1.9 1.34-3.14Zm2.25 0c0-2.32-.94-4.42-2.45-5.94a.75.75 0 1 0-1.06 1.06A6.73 6.73 0 0 1 19.5 12c0 1.91-.79 3.63-2.06 4.88a.75.75 0 1 0 1.06 1.06A8.23 8.23 0 0 0 21 12Z" />
                </svg>
            </button>

            <!-- Volume Slider -->
            <input 
                type="range" 
                id="volumeSlider" 
                min="0" max="1" step="0.01"
                    class="w-20 sm:w-28 h-1 bg-zinc-800 rounded-full cursor-pointer accent-orange-500 hover:accent-orange-400 outline-none border-none shadow-none focus:outline-none focus:ring-0 transition-all duration-300"
            >
        </div>
    </div> <!-- FIX: Added missing closing div tag here -->

<script>



    // JS -> Python

    $(document).on("change", "#volumeSlider", async function() {
        const volume = $(this).val();
        await window.pywebview.api.volume_slider(volume);
    });

    // Using "change" ensures it works for both clicking and dragging!
    $(document).on("change", "#progressSlider", async function() {
        const time = $(this).val();
        await window.pywebview.api.progress_slider_click(time);
    });

    
    window.play_button = async function(current_song) {
        const isPlaying = await window.pywebview.api.play_button(current_song);
        update_play_button_ui(isPlaying);
    }

    window.toggle_play_pause = async function() {
        const isPlaying = await window.pywebview.api.play_button(null);
        
        // If no song is loaded, try to play the first song in the active list
        if (isPlaying === null) {
            $(".song-row").first().click();
            return;
        }
        
        update_play_button_ui(isPlaying);
    }

    function update_play_button_ui(isPlaying) {
        const playBtn = $("#playPauseBtn");
        if (isPlaying) {
            playBtn.html(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8"><path fill-rule="evenodd" d="M6.75 5.25a.75.75 0 0 1 .75-.75H9a.75.75 0 0 1 .75.75v13.5a.75.75 0 0 1-.75.75H7.5a.75.75 0 0 1-.75-.75V5.25Zm7.5 0A.75.75 0 0 1 15 4.5h1.5a.75.75 0 0 1 .75.75v13.5a.75.75 0 0 1-.75.75H15a.75.75 0 0 1-.75-.75V5.25Z" clip-rule="evenodd" /></svg>`);
            $("#audio-visualizer, .list-visualizer").removeClass("w-0 ml-0 opacity-0").addClass("w-4 ml-1 opacity-100");
        } else {
            playBtn.html(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8 ml-1"><path fill-rule="evenodd" d="M4.5 5.653c0-1.427 1.529-2.38 2.831-1.643L20.5 12 7.331 20.007c-1.302.737-2.831-.216-2.831-1.643V5.653Z" clip-rule="evenodd" /></svg>`);
            $("#audio-visualizer, .list-visualizer").removeClass("w-4 ml-1 opacity-100").addClass("w-0 ml-0 opacity-0");
        }
    }

    async function sendData() {
        const val = $('#inp').val();
        const response = await window.pywebview.api.send_to_python(val);
    }

    // Python -> JS
    function song_list(data) {
        // msg is an array of song objects
        data.forEach(song => {
            // Format the duration into MM:SS
            const durationSecs = Math.floor(song.Duration || 0);
            const minutes = Math.floor(durationSecs / 60);
            const seconds = (durationSecs % 60).toString().padStart(2, '0');
            const formattedDuration = `${minutes}:${seconds}`;
            
            // Log each song to the console
            console.log(`Loaded: ${song.Title} by ${song.Artist} (${formattedDuration})`);
        
        });
    }

    // Initialize Notyf globally
    const notyf = new Notyf();

    $(window).on('resize', function() {
        if($(window).width() <= 700){
            hideSideBar();
            $("#sidebar-toggle").addClass("hidden");
        }else{
            $("#sidebar-toggle").removeClass("hidden");
        }
    });

    $("#sidebar-toggle").click(function() {
        if($("#sidebar").hasClass("w-64")){
            hideSideBar();
        }else{
            showSidebar();
        }
    });

    function hideSideBar(){
        $("#sidebar-toggle svg").addClass("rotate-180");
        $("#sidebar").removeClass("w-64");
        $("#sidebar").addClass("w-20");
        $("#sidebar-content .nav-text").addClass("hidden");
    } 

    function showSidebar(){
        $("#sidebar").removeClass("w-20");
        $("#sidebar").addClass("w-64");
        $("#sidebar-toggle svg").removeClass("rotate-180");
        $("#sidebar-content .nav-text").removeClass("hidden");
    } 

    // --- Dynamic Content Routing ---
    function navigateTo(page) {
        // Fade out current content for a smooth transition
        $("#main").fadeOut(100, function() {
            // Load the HTML snippet from the views folder
            $(this).load("./views/" + page + ".html", function(response, status, xhr) {
                if (status === "error") {
                    $(this).html("<div class='p-4 text-red-500'>Error loading " + page + ".html: " + xhr.status + " " + xhr.statusText + "</div>");
                }
                $(this).fadeIn(150);
                
                if (page === "home") {
                    if (window.pywebview && window.pywebview.api) {
                        window.pywebview.api.send_song_list();
                    } else {
                        window.addEventListener('pywebviewready', function() {
                            window.pywebview.api.send_song_list();
                        }, { once: true });
                    }
                }
            });
        });
    }

    // Handle sidebar link clicks
    $(document).on("click", ".nav-link", function(e) {
        e.preventDefault();
        const targetPage = $(this).data("target");
        if (targetPage) {
            navigateTo(targetPage);
        }
    });

    // Load initial view on startup
    $(document).ready(function() {
        navigateTo("home");
        
        // Safely request Python to send the settings on startup
        if (window.pywebview && window.pywebview.api) {
            window.pywebview.api.load_settings();
        } else {
            window.addEventListener('pywebviewready', function() {
                window.pywebview.api.load_settings();
            }, { once: true });
        }
    });

    let progressTimer = null;
    let isDraggingProgress = false;

    // Prevent UI jumps if the user grabs the slider (useful when you add seeking later)
    $(document).on("mousedown touchstart", "#progressSlider", function() {
        isDraggingProgress = true;
    });

    $(document).on("mouseup touchend", "#progressSlider", function() {
        isDraggingProgress = false;
    });

    function startProgressTracking() {
        if (progressTimer) clearInterval(progressTimer);
        
        progressTimer = setInterval(async () => {
            const pos = await window.pywebview.api.get_current_pos();
            if (pos >= 0) {
                const mins = Math.floor(pos / 60);
                const secs = Math.floor(pos % 60).toString().padStart(2, '0');
                $("#current_time").text(`${mins}:${secs}`);
                
                if (!isDraggingProgress) {
                    $("#progressSlider").val(pos);
                }
            }
        }, 250); // Polling 4 times a second guarantees fast response
    }

    window.plaiyng_info = function(data) {
        window.current_playing_song = data;
        // Format the duration into MM:SS
        const duration = data.Duration || 0;
        const durationSecs = Math.floor(duration);
        const minutes = Math.floor(durationSecs / 60);
        const seconds = (durationSecs % 60).toString().padStart(2, '0');
        $("#total_time").text(`${minutes}:${seconds}`);
        
        // Set slider maximum to exact song duration and start the tracker
        $("#progressSlider").attr("max", duration).val(0);
        startProgressTracking();
    }

    window.load_settings = function(volume) {
        $("#volumeSlider").val(parseFloat(volume));
    }

    window.playing_view = function(current_song) {
        const coverArt = current_song.CoverArt
            ? `<img src="${current_song.CoverArt}" class="w-full h-full object-cover">`
            : `<div class="w-full h-full bg-zinc-800 flex items-center justify-center"><svg class="w-5 h-5 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg></div>`;
        const html = `
            <div class="flex items-center gap-3 overflow-hidden">
                <div class="flex items-end justify-center gap-[2px] w-4 h-4 ml-1 flex-shrink-0 transition-all duration-300 overflow-hidden" id="audio-visualizer">
                    <div class="visualizer-bar"></div>
                    <div class="visualizer-bar"></div>
                    <div class="visualizer-bar"></div>
                    <div class="visualizer-bar"></div>
                </div>
                <div class="w-10 h-10 rounded-md bg-zinc-800 flex-shrink-0 overflow-hidden shadow-md">
                    ${coverArt}
                </div>
                <div class="flex flex-col">
                    <div class="song-title truncate font-medium text-zinc-100 group-hover:text-orange-400 transition-colors truncate">${current_song.Title || "Unknown Title"}</div>
                    <div class="cursor-pointer truncate hover:text-zinc-400 transition-colors text-sm truncate">${current_song.Artist || "Unknown Artist"}</div>
                </div>
            </div>`;
        $("#song_plaiyng_div").html(html);
    }

</script>
</body>
</html>
