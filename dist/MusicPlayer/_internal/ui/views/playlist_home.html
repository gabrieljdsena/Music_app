<div class="max-w-8xl mx-auto w-full pt-8 px-6 sm:px-8 pb-24">
    
    <div class="flex items-center justify-between mb-8 flex-wrap gap-4">
        <div class="flex items-center gap-4">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-orange-500/10 border border-orange-500/20 text-orange-400 shadow-[0_0_15px_rgba(249,115,22,0.15)]">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
                </svg>
            </div>
            <div>
                <h1 class="text-3xl font-bold text-zinc-100">Playlists</h1>
                <p class="text-sm text-zinc-500 mt-1 tracking-wide">Your custom playlists</p>
            </div>
        </div>
        <button onclick="openPlaylistModal()" class="flex items-center hover:cursor-pointer gap-2 px-5 py-2.5 bg-orange-500 hover:bg-orange-400 text-white rounded-lg font-medium transition-all duration-300 shadow-lg shadow-orange-500/20 active:scale-95">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
            New Playlist
        </button>
    </div>

    <!-- Playlists Grid -->
    <div id="playlists-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 sm:gap-6 mt-8">
        
        <!-- Create New Placeholder Card -->
        <div onclick="openPlaylistModal()" class="group relative aspect-square rounded-xl overflow-hidden border-2 border-dashed border-white/10 hover:border-orange-500/50 hover:bg-orange-500/5 transition-all duration-300 cursor-pointer flex flex-col items-center justify-center gap-3">
            <div class="w-12 h-12 rounded-full bg-white/5 group-hover:bg-orange-500/20 flex items-center justify-center text-zinc-500 group-hover:text-orange-400 transition-all duration-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                </svg>
            </div>
            <span class="text-sm font-medium text-zinc-400 group-hover:text-orange-400 transition-colors">Create Playlist</span>
        </div>
    </div>
    
    <!-- Modal-->
    <div id="playlistModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-transparent bg-opacity-40 backdrop-blur-sm transition-opacity">
        <div class="bg-neutral-800 rounded-xl border-2 border-neutral-900 shadow-2xl w-full max-w-md p-6 relative">
            <h2 class="text-2xl font-bold mb-4 text-zinc-200 border-b border-neutral-700 pb-2">Add Playlist</h2>
            <form id="playlistForm" class="space-y-4">
                <div>
                    <label for="title" class="block text-sm font-semibold text-gray-200">Title</label>
                    <input type="text" id="title" class="mt-1 block w-full rounded-md border-neutral-700 shadow-sm focus:border-orange-400 focus:ring-orange-500 sm:text-sm px-3 py-2 border bg-neutral-700 outline-none transition-all duration-300 hover:border-neutral-500 focus:bg-neutral-600" placeholder="Playlist Name">
                </div>
                
                <div>
                    <label for="description" class="block text-sm font-semibold text-gray-200">Description</label>
                    <textarea type="text" id="description" class="mt-1 block w-full rounded-md border-neutral-700 shadow-sm focus:border-orange-400 focus:ring-orange-500 sm:text-sm px-3 py-2 border bg-neutral-700 outline-none transition-all duration-300 hover:border-neutral-500 focus:bg-neutral-600" placeholder="Describe your playlist..."></textarea>
                </div>

                <div>
                    <label for="cover" class="block text-sm font-semibold text-gray-200">Cover Image</label>
                    <input type="file" id="cover" accept="image/*" class="mt-1 block w-full text-sm text-zinc-300 border border-neutral-700 rounded-md cursor-pointer bg-neutral-700 outline-none focus:border-orange-400 focus:ring-1 focus:ring-orange-500 transition-all duration-300 hover:border-neutral-500 file:mr-4 file:py-2 file:px-4 file:border-0 file:text-sm file:font-semibold file:bg-neutral-800 file:text-zinc-200 file:hover:bg-neutral-600 file:cursor-pointer file:transition-colors shadow-sm">
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t border-neutral-700 mt-5">
                    <button type="button" onclick="closePlaylistModal()" class="px-4 py-2 hover:cursor-pointer bg-gray-200 text-slate-800 font-medium rounded-lg hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-opacity-50 transition-all duration-300 hover:scale-105 active:scale-95">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-orange-400 text-white hover:cursor-pointer font-medium rounded-lg hover:bg-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-opacity-50 transition-all duration-300 hover:scale-105 active:scale-95 shadow-md shadow-orange-500/20 hover:shadow-lg hover:shadow-orange-500/40">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    
    function closePlaylistModal() {
        const modal = document.getElementById('playlistModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }

    function openPlaylistModal() {
        const modal = document.getElementById('playlistModal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    window.addEventListener('click', function(event) {
        const modal = document.getElementById('playlistModal');
        if (event.target === modal) {
            closePlaylistModal();
        }
    });

    document.getElementById('playlistForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        let data = {
            Title : document.getElementById('title').value,
            Description: document.getElementById('description').value,
        };

        const coverFile = document.getElementById('cover').files[0];
        if (coverFile) {
            const reader = new FileReader();
            reader.onload = (event) => {
                data.Cover = event.target.result;
                window.pywebview.api.new_playlist(data).then(() => {
                    closePlaylistModal();
                    if (typeof window.loadPlaylistsToSidebar === 'function') window.loadPlaylistsToSidebar();
                    reloadPlaylistsGrid();
                });
            };
            reader.readAsDataURL(coverFile);
        } else {
            window.pywebview.api.new_playlist(data).then(() => {
                closePlaylistModal();
                if (typeof window.loadPlaylistsToSidebar === 'function') window.loadPlaylistsToSidebar();
                reloadPlaylistsGrid();
            });
        }
    });

    async function reloadPlaylistsGrid() {
        const gridBody = document.getElementById("playlists-grid");
        if (gridBody) {
            // Clear current cards to prevent stacking (keeping the initial Add card)
            const cards = gridBody.querySelectorAll('.playlist-card');
            cards.forEach(card => card.remove());
            
            const list = await getPlaylists();
            list.forEach(playlist => {
                gridBody.insertAdjacentHTML('beforeend', generatePlaylistRowHtml(playlist));
            });
        }
    }

    reloadPlaylistsGrid();

    
    async function getPlaylists(current_song) {
        return await window.pywebview.api.load_playlists();
    }

    function generatePlaylistRowHtml(playlist) {

        let imgHtml;

        if(playlist.thumbnail){
            imgHtml = `<img src="${playlist.thumbnail}" alt="${playlist.title || playlist.Title}" class="w-full h-full object-cover rounded-xl transition-all duration-300">`

        }else{
            imgHtml = `<svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
                        </svg>`
        }

        // Create a lightweight version without the base64 thumbnail to save DOM RAM
        const slimPlaylist = {
            id: playlist.id,
            title: playlist.title || playlist.Title,
            description: playlist.description || playlist.Description
        };

        return `
        <div class="playlist-card group relative aspect-square rounded-xl overflow-hidden bg-zinc-800/40 border border-white/5 hover:border-orange-500/50 hover:bg-zinc-800/60 transition-all duration-300 cursor-pointer shadow-lg" data-playlist="${encodeURIComponent(JSON.stringify(slimPlaylist))}">
            <!-- Icon Placeholder -->
            <div class="absolute inset-0 flex items-center justify-center text-zinc-600 group-hover:text-orange-400/80 transition-all duration-300 group-hover:scale-110">
                ${imgHtml}
            </div>

            <!-- Hover Play Overlay -->
            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                <div class="w-12 h-12 rounded-full bg-orange-400 hover:bg-orange-500 flex items-center justify-center text-white shadow-lg shadow-orange-500/40 transform translate-y-4 group-hover:translate-y-0 transition-transform duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 ml-1">
                        <path fill-rule="evenodd" d="M4.5 5.653c0-1.427 1.529-2.38 2.831-1.643L20.5 12 7.331 20.007c-1.302.737-2.831-.216-2.831-1.643V5.653Z" clip-rule="evenodd" />
                    </svg>
                </div>
            </div>

            <!-- Text content -->
            <div class="absolute bottom-0 inset-x-0 p-4 bg-gradient-to-t from-zinc-950 via-zinc-900/80 to-transparent flex flex-col justify-end h-1/2">
                <span class="block text-zinc-200 font-medium group-hover:text-orange-400 transition-colors truncate drop-shadow-md">${playlist.title}</span>
                <span class="block text-xs text-zinc-400 mt-1 font-medium">0 songs</span>
            </div>
        </div>`;
    }

    document.getElementById("playlists-grid").addEventListener("click", function(e) {
        const card = e.target.closest(".playlist-card");
        if (card) {
            e.preventDefault();
            const playlistDataStr = card.getAttribute("data-playlist");
            if (playlistDataStr) {
                window.currentPlaylist = JSON.parse(decodeURIComponent(playlistDataStr));
                navigateTo("playlist_view");
            }
        }
    });

</script>
